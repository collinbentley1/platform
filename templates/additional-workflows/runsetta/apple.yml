name: Apple

on:
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions: {}

jobs:
  swift-package:
    name: Swift package check
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Reject workflow reruns before any required check
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Reject alternate required-check event paths
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            exit 0
          fi
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Check RunsettaCore
        run: |
          set -euo pipefail
          swift build --package-path apple
          swift run --package-path apple RunsettaCoreCheck
