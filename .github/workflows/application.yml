name: Application

on:
  workflow_call:

permissions: {}

jobs:
  verify:
    name: Bun verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Reject alternate required-check event paths
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            jq -e '
              if .action == "edited" then
                (.changes | type == "object") and
                ((.changes | keys) == ["body"]) and
                (.changes.body | type == "object") and
                ((.changes.body | keys) == ["from"]) and
                ((.changes.body.from | type) == "string" or .changes.body.from == null)
              else
                .action == "opened" or
                .action == "reopened" or
                .action == "synchronize"
              end
            ' "$GITHUB_EVENT_PATH" >/dev/null
            exit 0
          fi
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve the exact reusable-workflow source
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ -e "$GITHUB_WORKSPACE/_platform_policy" ] || [ -L "$GITHUB_WORKSPACE/_platform_policy" ]; then
            echo "The reserved _platform_policy checkout path must not exist in the caller repository." >&2
            exit 1
          fi

      - name: Checkout the exact platform policy source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _platform_policy
          persist-credentials: false

      - name: Verify the checked-out platform policy commit
        env:
          EXPECTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/_platform_policy" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install checksum-pinned Bun 1.4.0
        env:
          BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          echo "${BUN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          echo "$destination/bun-linux-x64" >> "$GITHUB_PATH"
          echo "PLATFORM_BUN=$destination/bun-linux-x64/bun" >> "$GITHUB_ENV"
          (
            cd "$GITHUB_WORKSPACE/_platform_policy/tools/ci"
            "$destination/bun-linux-x64/bun" --no-env-file --no-orphans \
              -e 'if (Bun.version !== "1.4.0") process.exit(1)'
          )

      - name: Enforce the platform dependency and container contract
        run: |
          set -euo pipefail
          (
            cd "$GITHUB_WORKSPACE/_platform_policy/tools/ci"
            bun --no-env-file --no-orphans ./enforce-app-contract.ts \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/_platform_policy/templates/app" \
              "${{ github.event.repository.id }}" \
              "${{ job.workflow_sha }}"
          )

      - name: Install dependencies with the public Socket policy
        run: |
          set -euo pipefail
          print_untrusted_output() {
            local stop_marker
            stop_marker="$(cat /proc/sys/kernel/random/uuid)"
            printf '::stop-commands::%s\n' "$stop_marker"
            printf '%s\n' "$1"
            printf '::%s::\n' "$stop_marker"
          }
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "Committed node_modules content is forbidden before dependency installation." >&2
            exit 1
          fi
          unset SOCKET_API_TOKEN SOCKET_API_KEY
          unset BUN_CONFIG_SKIP_LOAD_LOCKFILE BUN_FEATURE_FLAG_DISABLE_IGNORE_SCRIPTS BUN_CONFIG_REGISTRY NPM_CONFIG_REGISTRY
          if ! install_output="$(bun --no-env-file --no-orphans install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org 2>&1)"; then
            print_untrusted_output "$install_output"
            exit 1
          fi
          print_untrusted_output "$install_output"
          if ! grep -Fq 'Socket Security Scanner free mode' <<< "$install_output"; then
            echo "Application verification must install without a Socket credential." >&2
            exit 1
          fi

      - name: Verify app
        run: |
          set -euo pipefail
          (
            cd "$GITHUB_WORKSPACE/_platform_policy/tools/ci"
            "$PLATFORM_BUN" --no-env-file --no-orphans \
              "$GITHUB_WORKSPACE/_platform_policy/templates/app/tools/platform-verify.ts" \
              "$GITHUB_WORKSPACE"
          )
