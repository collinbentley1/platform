name: Cleanup preview

on:
  workflow_call:

permissions: {}

jobs:
  rerun-guard:
    name: Reject privileged workflow reruns
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

  cleanup:
    name: Cleanup preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      (github.event.action == 'closed' ||
       github.event.action == 'synchronize' ||
       github.event.action == 'converted_to_draft') &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: preview-operations
    permissions:
      id-token: write # Exchange only for the exact-SHA preview cleanup identity.
      pull-requests: read # Re-read current lifecycle state before any OIDC exchange.
    concurrency:
      group: preview-cloud-${{ github.event.repository.id }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Revalidate current pull request lifecycle before OIDC
        id: lifecycle
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          current="$(mktemp)"
          trap 'rm -f -- "$current"' EXIT
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${EXPECTED_REPOSITORY}/pulls/${PR_NUMBER}" > "$current"

          proceed=false
          case "$EVENT_ACTION" in
            synchronize)
              jq -e \
                --arg head "$EVENT_HEAD_SHA" \
                --arg repo "$EXPECTED_REPOSITORY" \
                --argjson repo_id "$EXPECTED_REPOSITORY_ID" \
                '.state == "open" and .draft == false and .base.ref == "main" and
                 .head.sha == $head and .head.repo.id == $repo_id and
                 .head.repo.full_name == $repo' \
                "$current" >/dev/null && proceed=true
              ;;
            converted_to_draft)
              jq -e \
                --arg head "$EVENT_HEAD_SHA" \
                --arg repo "$EXPECTED_REPOSITORY" \
                --argjson repo_id "$EXPECTED_REPOSITORY_ID" \
                '.state == "open" and .draft == true and .base.ref == "main" and
                 .head.sha == $head and .head.repo.id == $repo_id and
                 .head.repo.full_name == $repo' \
                "$current" >/dev/null && proceed=true
              ;;
            closed)
              jq -e '.state == "closed" and .base.ref == "main"' "$current" >/dev/null && proceed=true
              ;;
            *)
              echo "Unsupported cleanup event action." >&2
              exit 1
              ;;
          esac

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          if [ "$proceed" != true ]; then
            echo "Pull request lifecycle advanced after this event; preserving current preview state."
          fi

      - name: Resolve trusted application configuration
        id: app
        if: steps.lifecycle.outputs.proceed == 'true'
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151)
              project_id="cdbentley"
              project_number="882468538648"
              service_name="cdbentley"
              ;;
            711292980)
              project_id="runsetta"
              project_number="601124730704"
              service_name="runsetta"
              ;;
            1025243085)
              project_id="medlock-1025243085"
              project_number="229383559510"
              service_name="medlock"
              ;;
            280932482)
              project_id="critical-history-16823277"
              project_number="422714632513"
              service_name="critical-history"
              ;;
            *)
              echo "Repository id $REPOSITORY_ID is not registered for preview cleanup." >&2
              exit 1
              ;;
          esac

          {
            echo "project_id=$project_id"
            echo "region=us-east4"
            echo "service_name=$service_name"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "deploy_service_account=gha-preview-deploy@${project_id}.iam.gserviceaccount.com"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Install checksum-pinned Google Cloud CLI
        if: steps.lifecycle.outputs.proceed == 'true'
        env:
          GCLOUD_SHA256: deffdbe82ca6e3d19ffb291d063a651488e04e1b33799b5a238e4b5c6784e3c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/google-cloud-cli-581.0.0-linux-x86_64.tar.gz"
          sdk_root="$RUNNER_TEMP/google-cloud-cli"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            'https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-581.0.0-linux-x86_64.tar.gz?generation=1787059661116797'
          echo "${GCLOUD_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$sdk_root"
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          export CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          export CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
          "$sdk_root/bin/gcloud" version --format=json \
            | jq -e '.["Google Cloud SDK"] == "581.0.0"' >/dev/null
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true"
            echo "CLOUDSDK_CORE_DISABLE_PROMPTS=1"
            echo "CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true"
          } >> "$GITHUB_ENV"

      - name: Prove exact workflow-SHA WIF trust
        if: steps.lifecycle.outputs.proceed == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate trusted preview deployer for cleanup
        if: steps.lifecycle.outputs.proceed == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.deploy_service_account }}

      - name: Remove the invalidated pull request traffic tag
        if: steps.lifecycle.outputs.proceed == 'true'
        env:
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]] ||
             [[ ! "$REPOSITORY_ID" =~ ^(1255553151|711292980|1025243085|280932482)$ ]]; then
            echo "Refusing invalid preview cleanup identity." >&2
            exit 1
          fi
          preview_service="${SERVICE_NAME}-preview"
          preview_tag="pr-${PR_NUMBER}"
          service_json="$(mktemp)"
          describe_error="$(mktemp)"
          trap 'rm -f "$service_json" "$describe_error"' EXIT

          verify_stable_preview_absent() {
            if [ "$REPOSITORY_ID" != "280932482" ]; then
              return 0
            fi
            stable_url="https://pr-${PR_NUMBER}.preview.ycriticalhistory.org"
            for attempt in $(seq 1 30); do
              if status="$(curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 10 \
                --proto '=https' \
                "$stable_url")" && [ "$status" = "404" ]; then
                return 0
              fi
              if [ "$attempt" -lt 30 ]; then
                sleep 5
              fi
            done
            echo "Stable preview URL remained routable after removing $preview_tag." >&2
            return 1
          }

          if ! gcloud run services describe "$preview_service" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format=json > "$service_json" 2> "$describe_error"; then
            if grep -Eqi 'not[ _-]?found|could not be found|404' "$describe_error"; then
              echo "Preview service $preview_service does not exist; nothing to invalidate."
              verify_stable_preview_absent
              exit 0
            fi
            cat "$describe_error" >&2
            exit 1
          fi

          if ! jq -e --arg tag "$preview_tag" '.status.traffic[]? | select(.tag == $tag)' "$service_json" >/dev/null; then
            echo "Preview tag $preview_tag is already absent; nothing to invalidate."
            verify_stable_preview_absent
            exit 0
          fi

          gcloud run services update-traffic "$preview_service" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --remove-tags="$preview_tag" \
            --quiet
          verify_stable_preview_absent
