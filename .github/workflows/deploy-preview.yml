name: Deploy preview

on:
  workflow_call:

permissions: {}

jobs:
  rerun-guard:
    name: Reject privileged workflow reruns
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

  prefetch-bases:
    name: Prefetch exact public DHI bases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    # This fresh environment must allow only the selected protected main branch. It
    # contains one read-public-only DHI token and is never entered by PR code.
    environment: dhi-base-prefetch-20260822-098dca9280b3
    permissions: {}
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.bundle.outputs.content_sha256 }}
      manifest-sha256: ${{ steps.bundle.outputs.manifest_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source before secret use
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-prefetch-policy"
          git_home="$RUNNER_TEMP/platform-prefetch-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          test ! -e "$git_home" && test ! -L "$git_home"
          install -d -m 0700 "$destination" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          unset GIT_CONFIG_SYSTEM GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          git_safe() {
            /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= \
              -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false \
              -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"
          }
          git_safe -C "$destination" init --quiet
          git_safe -C "$destination" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$destination" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          git_safe -C "$destination" checkout --quiet --detach FETCH_HEAD
          test "$(git_safe -C "$destination" rev-parse --verify HEAD^{commit})" = "$WORKFLOW_SHA"
          test "$(git_safe -C "$destination" status --porcelain=v1 --untracked-files=all)" = ""
          helper="$destination/tools/ci/container-artifact-contract.sh"
          test -f "$helper" && test ! -L "$helper"
          expected="$(git_safe -C "$destination" rev-parse "$WORKFLOW_SHA:tools/ci/container-artifact-contract.sh")"
          test "$(git_safe -C "$destination" hash-object --no-filters "$helper")" = "$expected"
          rm -rf -- "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Fetch, verify, and close the exact public base graph
        id: bundle
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_KIND: preview
          DHI_PUBLIC_READ_TOKEN: ${{ secrets.DHI_PUBLIC_READ_TOKEN_20260822_098DCA9280B3 }}
          DHI_USERNAME: ${{ vars.DHI_USERNAME }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" prefetch

      - name: Verify DHI credentials were retired before artifact publication
        if: always() && github.run_attempt == '1'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          auth_root="$RUNNER_TEMP/platform-regctl-auth"
          artifact="${{ steps.bundle.outputs.artifact }}"
          if [ -e "$auth_root" ] || [ -L "$auth_root" ]; then
            echo "DHI registry credentials survived prefetch." >&2
            rm -rf -- "$auth_root" "$RUNNER_TEMP/platform-base-bundle" "$artifact"
            exit 1
          fi
          if [ ! -f "$artifact" ] || [ -L "$artifact" ]; then
            echo "Base-image artifact was not produced safely." >&2
            exit 1
          fi

      - name: Upload the one-day public base closure as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.bundle.outputs.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build untrusted preview without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prefetch-bases
    if: >-
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      needs.prefetch-bases.result == 'success'
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.oci.outputs.content_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-build-policy"
          repository="$RUNNER_TEMP/platform-build-repository"
          git_home="$RUNNER_TEMP/platform-build-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools templates | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Download only the exact base artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-base-download
          digest-mismatch: error
          skip-decompress: true

      - name: Validate and extract the closed base artifact
        id: base_images
        env:
          ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-base-download
          EXPECTED_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" verify-base

      - name: Resolve fixed build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha='${{ github.event.pull_request.head.sha }}'
          base_sha='${{ github.event.pull_request.base.sha }}'
          pr_number='${{ github.event.pull_request.number }}'
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          test "$base_sha" = "$GITHUB_SHA"
          pr="$RUNNER_TEMP/current-pr.json"
          main="$RUNNER_TEMP/current-main.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$pr"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$main"
          jq -e --arg head "$head_sha" --arg base "$base_sha" --arg repository "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and .head.sha == $head and
            .head.repo.full_name == $repository and .base.ref == "main" and .base.sha == $base
          ' "$pr" >/dev/null
          test "$(jq -er '.object.sha' "$main")" = "$base_sha"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify the exact checked-out pull request head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse --verify 'HEAD^{commit}')" = "$EXPECTED_HEAD_SHA"
          test "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)" = ""

      - name: Install checksum-pinned Bun 1.4.0 for structural policy checks
        env:
          BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          echo "${BUN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          echo "$destination/bun-linux-x64" >> "$GITHUB_PATH"
          (
            cd "${{ steps.policy.outputs.root }}/tools/ci"
            "$destination/bun-linux-x64/bun" --no-env-file --no-orphans \
              -e 'if (Bun.version !== "1.4.0") process.exit(1)'
          )

      - name: Enforce the trusted application and container contract
        run: |
          set -euo pipefail
          (
            cd "${{ steps.policy.outputs.root }}/tools/ci"
            bun --no-env-file --no-orphans ./enforce-app-contract.ts \
              "$GITHUB_WORKSPACE" \
              "${{ steps.policy.outputs.root }}/templates/app" \
              "${{ github.event.repository.id }}" \
              "${{ job.workflow_sha }}"
          )

      - name: Scan the resolved lock with the public Socket policy
        run: |
          set -euo pipefail
          print_untrusted_output() {
            local stop_marker
            stop_marker="$(cat /proc/sys/kernel/random/uuid)"
            printf '::stop-commands::%s\n' "$stop_marker"
            printf '%s\n' "$1"
            printf '::%s::\n' "$stop_marker"
          }
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "Committed node_modules content is forbidden before the public Socket scan." >&2
            exit 1
          fi
          before="$(sha256sum package.json bun.lock)"
          unset SOCKET_API_TOKEN SOCKET_API_KEY
          unset BUN_CONFIG_SKIP_LOAD_LOCKFILE BUN_FEATURE_FLAG_DISABLE_IGNORE_SCRIPTS BUN_CONFIG_REGISTRY NPM_CONFIG_REGISTRY
          if ! scan_output="$(bun --no-env-file --config="${{ steps.policy.outputs.root }}/tools/ci/bunfig.toml" pm scan 2>&1)"; then
            print_untrusted_output "$scan_output"
            exit 1
          fi
          print_untrusted_output "$scan_output"
          if ! grep -Fq 'Socket Security Scanner free mode' <<< "$scan_output"; then
            echo "The preview lock scan must remain credential-free." >&2
            exit 1
          fi
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "bun pm scan must not create node_modules." >&2
            exit 1
          fi
          if [[ "$(sha256sum package.json bun.lock)" != "$before" ]]; then
            echo "bun pm scan must not mutate package.json or bun.lock." >&2
            exit 1
          fi

      - name: Install checksum-pinned Docker Buildx and create pinned BuildKit
        id: buildx
        env:
          BUILDX_SHA256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/platform-docker"
          plugin="$docker_config/cli-plugins/docker-buildx"
          builder="platform-builder"
          mkdir -p "$(dirname "$plugin")"
          curl --fail --show-error --silent --location \
            --output "$plugin" \
            https://github.com/docker/buildx/releases/download/v0.36.1/buildx-v0.36.1.linux-amd64
          echo "${BUILDX_SHA256}  ${plugin}" | sha256sum --check --strict
          chmod 0755 "$plugin"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$docker_config" docker buildx version | grep -F 'v0.36.1'
          DOCKER_CONFIG="$docker_config" docker buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 \
            --use
          DOCKER_CONFIG="$docker_config" docker buildx inspect "$builder" --bootstrap
          echo "name=$builder" >> "$GITHUB_OUTPUT"

      - name: Disable workflow commands for untrusted build output
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/platform-build-command-token"
          if [ -e "$token_file" ] || [ -L "$token_file" ]; then
            echo "The workflow-command token file already exists." >&2
            exit 1
          fi
          token="$(cat /proc/sys/kernel/random/uuid)"
          [[ "$token" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          (umask 077; printf '%s\n' "$token" > "$token_file")
          printf '::stop-commands::%s\n' "$token"

      - name: Build untrusted preview image into a local OCI archive
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_CHECKS_ANNOTATIONS: "false"
        with:
          builder: ${{ steps.buildx.outputs.name }}
          github-token: ""
          build-contexts: |
            platform.invalid/bun-release=oci-layout://${{ steps.base_images.outputs.oven_layout }}@${{ steps.base_images.outputs.oven_child_digest }}
            platform.invalid/dhi-bun-dev=oci-layout://${{ steps.base_images.outputs.dhi_dev_layout }}@${{ steps.base_images.outputs.dhi_dev_child_digest }}
            platform.invalid/dhi-bun-runtime=oci-layout://${{ steps.base_images.outputs.dhi_runtime_layout }}@${{ steps.base_images.outputs.dhi_runtime_child_digest }}
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: false
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/platform-image.oci.tar,oci-mediatypes=true,oci-artifact=true
          provenance: mode=max,version=v1
          tags: platform-preview:${{ steps.metadata.outputs.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Restore workflow commands after untrusted build output
        if: always() && github.run_attempt == '1'
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/platform-build-command-token"
          if [ ! -f "$token_file" ] || [ -L "$token_file" ]; then
            echo "The workflow-command token file is missing or invalid." >&2
            exit 1
          fi
          token="$(cat "$token_file")"
          [[ "$token" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          unlink "$token_file"
          printf '::%s::\n' "$token"

      - name: Destroy BuildKit and runner-local bases
        if: always() && github.run_attempt == '1'
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          if [ -n "$BUILDER_NAME" ] && docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            docker buildx rm "$BUILDER_NAME"
          fi
          if [ -n "$BUILDER_NAME" ] && docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            echo "BuildKit builder still exists after removal." >&2
            exit 1
          fi
          rm -rf -- "${{ steps.base_images.outputs.base_root }}"
          if [ -e "${{ steps.base_images.outputs.base_root }}" ] ||
             [ -L "${{ steps.base_images.outputs.base_root }}" ]; then
            echo "Runner-local base-image layouts survived the build." >&2
            exit 1
          fi

      - name: Hash the opaque untrusted OCI output
        id: oci
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/platform-image.oci.tar"
          test -f "$image" && test ! -L "$image"
          test "$(stat -c %s "$image")" -le 1073741824
          content_sha256="$(sha256sum "$image" | cut -d ' ' -f 1)"
          echo "content_sha256=$content_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the opaque OCI output as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/platform-image.oci.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  verify-image:
    name: Verify and promote preview OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - build
      - prefetch-bases
    if: needs.build.result == 'success' && needs.prefetch-bases.result == 'success'
    permissions:
      actions: read
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.promote.outputs.content_sha256 }}
      image-digest: ${{ steps.promote.outputs.published_index_digest }}
      runnable-digest: ${{ steps.promote.outputs.runnable_manifest_digest }}
      sbom-content-digest: ${{ steps.promote.outputs.sbom_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-promoter-policy"
          repository="$RUNNER_TEMP/platform-promoter-repository"
          git_home="$RUNNER_TEMP/platform-promoter-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools/ci | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Bind both exact source artifacts to this run
        env:
          BASE_ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          BASE_ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          BUILT_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          BUILT_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for value in "$BASE_ARTIFACT_DIGEST" "$BUILT_ARTIFACT_DIGEST"; do [[ "$value" =~ ^[0-9a-f]{64}$ ]]; done
          for value in "$BASE_ARTIFACT_ID" "$BUILT_ARTIFACT_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]]; done
          verify_artifact() {
            local id="$1" digest="$2" name="$3" max="$4"
            local response="$RUNNER_TEMP/artifact-${id}.json"
            gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$response"
            jq -e --arg id "$id" --arg digest "sha256:${digest}" --arg name "$name" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson max "$max" --argjson repo "$EXPECTED_REPOSITORY_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
              (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
              .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
              (.size_in_bytes > 0 and .size_in_bytes <= $max)
            ' "$response" >/dev/null
          }
          verify_artifact "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_DIGEST" "platform-preview-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1611661312
          verify_artifact "$BUILT_ARTIFACT_ID" "$BUILT_ARTIFACT_DIGEST" platform-image.oci.tar 1073741824

      - name: Download only the exact opaque image artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-image-download
          digest-mismatch: error
          skip-decompress: true

      - name: Download only the exact reviewed base artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-promoter-bases
          digest-mismatch: error
          skip-decompress: true

      - name: Validate, scan, and promote in a fresh credentialless job
        id: promote
        env:
          ARTIFACT_KIND: preview
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-promoter-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          BUILT_CONTENT_SHA256: ${{ needs.build.outputs.content-sha256 }}
          BUILT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-image-download
          EXPECTED_EVENT_NAME: pull_request_target
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" promote

      - name: Upload the promoted image as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.promote.outputs.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  canary:
    name: Prove exact preview WIF trust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    environment: preview-cloud
    permissions:
      id-token: write # Exchange only for the no-role exact-WIF canary identity.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted canary configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648" ;;
            711292980) project_id="runsetta"; project_number="601124730704" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview deployment." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Exchange a token through the no-role canary
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

  publish-canary:
    name: Prove exact preview publisher WIF trust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.ref == 'refs/heads/main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    environment: preview-publish
    permissions:
      id-token: write # Exchange only for the no-role exact-WIF canary identity.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted publisher-canary configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648" ;;
            711292980) project_id="runsetta"; project_number="601124730704" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview publication." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Exchange a preview-publish token through the no-role canary
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

  publish:
    name: Publish verified preview OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - canary
      - prefetch-bases
      - publish-canary
      - verify-image
    if: >-
      always() &&
      needs.canary.result == 'success' &&
      needs.prefetch-bases.result == 'success' &&
      needs.publish-canary.result == 'success' &&
      needs.verify-image.result == 'success'
    environment: preview-publish
    permissions:
      actions: read # Read only the exact promoted artifact id from this run.
      id-token: write # Exchange only for the exact-SHA publisher identity.
    outputs:
      image-digest: ${{ steps.copy.outputs.digest }}
      image-name: ${{ steps.app.outputs.image_name }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source before OIDC
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-publisher-policy"
          repository="$RUNNER_TEMP/platform-publisher-repository"
          git_home="$RUNNER_TEMP/platform-publisher-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools/ci | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Resolve trusted application configuration
        id: app
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648"; service_name="cdbentley"; repository="site-preview" ;;
            711292980) project_id="runsetta"; project_number="601124730704"; service_name="runsetta"; repository="api-preview" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510"; service_name="medlock"; repository="site-preview" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513"; service_name="critical-history"; repository="site-preview" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview publication." >&2; exit 1 ;;
          esac
          image_name="us-east4-docker.pkg.dev/${project_id}/${repository}/${service_name}"
          {
            echo "project_id=$project_id"
            echo "image_name=$image_name"
            echo "remote_image=${image_name}:pr-${PR_NUMBER}-${{ github.event.pull_request.head.sha }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "publisher_service_account=gha-preview-publish@${project_id}.iam.gserviceaccount.com"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Bind the exact promoted artifact metadata before OIDC
        env:
          ARTIFACT_DIGEST: ${{ needs.verify-image.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.verify-image.outputs.artifact-id }}
          BASE_ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          BASE_ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for value in "$ARTIFACT_ID" "$BASE_ARTIFACT_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]]; done
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BASE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          verify_artifact() {
            local id="$1" digest="$2" name="$3" max="$4"
            local response="$RUNNER_TEMP/publisher-artifact-${id}.json"
            gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$response"
            jq -e --arg digest "sha256:${digest}" --arg id "$id" --arg name "$name" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson max "$max" --argjson repo "$EXPECTED_REPOSITORY_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
              (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
              .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
              (.size_in_bytes > 0 and .size_in_bytes <= $max)
            ' "$response" >/dev/null
          }
          verify_artifact "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "platform-preview-promoted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1074790400
          verify_artifact "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_DIGEST" "platform-preview-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1611661312

      - name: Download only the exact promoted artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-promoted-download
          digest-mismatch: error
          skip-decompress: true

      - name: Download the exact trusted base artifact independently
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-publisher-bases
          digest-mismatch: error
          skip-decompress: true

      - name: Revalidate the promoted artifact without extracting layers
        id: artifact
        env:
          ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-promoted-download
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-publisher-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          EXPECTED_CONTENT_SHA256: ${{ needs.verify-image.outputs.content-sha256 }}
          EXPECTED_EVENT_NAME: pull_request_target
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PUBLISHED_INDEX_DIGEST: ${{ needs.verify-image.outputs.image-digest }}
          EXPECTED_RUNNABLE_MANIFEST_DIGEST: ${{ needs.verify-image.outputs.runnable-digest }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" validate-promoted

      - name: Prepare the checksum-pinned streaming publisher before OIDC
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" prepare-publisher

      - name: Prove exact preview publisher workflow-SHA WIF trust
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate preview publisher
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.publisher_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Stream the verified OCI graph into the fixed Artifact Registry repository
        id: copy
        env:
          AR_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPECTED_PUBLISHED_INDEX_DIGEST: ${{ needs.verify-image.outputs.image-digest }}
          IMAGE_ARCHIVE: ${{ steps.artifact.outputs.image_archive }}
          REMOTE_IMAGE: ${{ steps.app.outputs.remote_image }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" publish

      - name: Verify publisher credentials were retired
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/platform-publisher-auth"
          test ! -L "$RUNNER_TEMP/platform-publisher-auth"

  attest:
    name: Attest preview image and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - publish
      - verify-image
    if: needs.publish.result == 'success'
    environment: supply-chain
    permissions:
      actions: read # Download the SBOM artifact from this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Obtain the GitHub artifact-attestation signing identity.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Download the exact promoted image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-attest-download
          digest-mismatch: error
          skip-decompress: true

      - name: Extract and verify only the exact SBOM bytes
        env:
          EXPECTED_CONTENT_SHA256: ${{ needs.verify-image.outputs.content-sha256 }}
          EXPECTED_SBOM_DIGEST: ${{ needs.verify-image.outputs.sbom-content-digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CONTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SBOM_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t files < <(find "$RUNNER_TEMP/platform-attest-download" -mindepth 1 -maxdepth 1 -type f -print)
          test "${#files[@]}" -eq 1
          printf '%s  %s\n' "$EXPECTED_CONTENT_SHA256" "${files[0]}" | sha256sum --check --strict
          test "$(sort -u < <(tar -tf "${files[0]}") | tr '\n' ' ')" = "./ ./dhi-runtime.manifest.json ./image.oci.tar ./manifest.json ./sbom.spdx.json "
          mkdir -p platform-build
          tar -xOf "${files[0]}" ./sbom.spdx.json > platform-build/sbom.spdx.json
          printf '%s  %s\n' "$EXPECTED_SBOM_DIGEST" platform-build/sbom.spdx.json | sha256sum --check --strict

      - name: Require a valid JSON SBOM
        run: jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array")' platform-build/sbom.spdx.json >/dev/null

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.publish.outputs.image-name }}
          subject-digest: ${{ needs.publish.outputs.image-digest }}

      - name: Attest the SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.publish.outputs.image-name }}
          subject-digest: ${{ needs.publish.outputs.image-digest }}
          sbom-path: platform-build/sbom.spdx.json

  deploy:
    name: Deploy isolated preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - attest
      - publish
    if: >-
      needs.attest.result == 'success' &&
      needs.publish.result == 'success'
    environment: preview-cloud
    permissions:
      contents: read
      id-token: write # Exchange only for the service-scoped preview deploy identity.
      pull-requests: write # Post the validated tagged preview URL on its pull request.
    outputs:
      deployed-revision: ${{ steps.deploy.outputs.revision }}
      lifecycle-keep: ${{ steps.lifecycle.outputs.keep }}
    concurrency:
      group: preview-cloud-${{ github.event.repository.id }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted application configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648"; service_name="cdbentley"; preview_ingress="all"; stable_preview_domain="" ;;
            711292980) project_id="runsetta"; project_number="601124730704"; service_name="runsetta"; preview_ingress="all"; stable_preview_domain="" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510"; service_name="medlock"; preview_ingress="all"; stable_preview_domain="" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513"; service_name="critical-history"; preview_ingress="internal-and-cloud-load-balancing"; stable_preview_domain="preview.ycriticalhistory.org" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview deployment." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "preview_ingress=$preview_ingress"
            echo "region=us-east4"
            echo "project_number=$project_number"
            echo "service_name=$service_name"
            echo "stable_preview_domain=$stable_preview_domain"
            echo "preview_service=${service_name}-preview"
            echo "runtime_service_account=cloud-run-preview@${project_id}.iam.gserviceaccount.com"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "deploy_service_account=gha-preview-deploy@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Install checksum-pinned Google Cloud CLI
        env:
          GCLOUD_SHA256: deffdbe82ca6e3d19ffb291d063a651488e04e1b33799b5a238e4b5c6784e3c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/google-cloud-cli-581.0.0-linux-x86_64.tar.gz"
          sdk_root="$RUNNER_TEMP/google-cloud-cli"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            'https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-581.0.0-linux-x86_64.tar.gz?generation=1787059661116797'
          echo "${GCLOUD_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$sdk_root"
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          export CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          export CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
          "$sdk_root/bin/gcloud" version --format=json \
            | jq -e '.["Google Cloud SDK"] == "581.0.0"' >/dev/null
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true"
            echo "CLOUDSDK_CORE_DISABLE_PROMPTS=1"
            echo "CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true"
          } >> "$GITHUB_ENV"

      - name: Authenticate preview deployer
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.deploy_service_account }}

      - name: Confirm the pull request is still deployable
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg head "$EXPECTED_HEAD_SHA" --arg repository "$EXPECTED_REPOSITORY" --arg repository_id "$EXPECTED_REPOSITORY_ID" '
            .state == "open" and .draft == false and .head.sha == $head and
            (.head.repo.id | tostring) == $repository_id and .head.repo.full_name == $repository and
            .base.ref == "main"
          ' <<< "$pr_json" >/dev/null || {
            echo "Refusing stale or retargeted preview deploy." >&2
            exit 1
          }

      - name: Deploy preview to Cloud Run
        id: deploy
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          IMAGE_NAME: ${{ needs.publish.outputs.image-name }}
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
          PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PREVIEW_INGRESS: ${{ steps.app.outputs.preview_ingress }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.runtime_service_account }}
          STABLE_PREVIEW_DOMAIN: ${{ steps.app.outputs.stable_preview_domain }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]] ||
             [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$PLATFORM_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [[ ! "$PROJECT_NUMBER" =~ ^[0-9]+$ ]] ||
             [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request, commit, workflow-run, or image identity." >&2
            exit 1
          fi
          case "$REPOSITORY_ID" in
            280932482)
              if [ "$PREVIEW_INGRESS" != "internal-and-cloud-load-balancing" ] ||
                 [ "$STABLE_PREVIEW_DOMAIN" != "preview.ycriticalhistory.org" ]; then
                echo "Critical History preview exposure policy drifted." >&2
                exit 1
              fi
              ;;
            1255553151|711292980|1025243085)
              if [ "$PREVIEW_INGRESS" != "all" ] || [ -n "$STABLE_PREVIEW_DOMAIN" ]; then
                echo "Unexpected stable preview exposure for repository $REPOSITORY_ID." >&2
                exit 1
              fi
              ;;
            *)
              echo "Repository id $REPOSITORY_ID has no trusted preview exposure policy." >&2
              exit 1
              ;;
          esac

          run_tail="${GITHUB_RUN_ID: -6}"
          revision_suffix="p${PR_NUMBER}-${EXPECTED_HEAD_SHA:0:12}-r${run_tail}a${GITHUB_RUN_ATTEMPT}"
          expected_revision="${PREVIEW_SERVICE}-${revision_suffix}"
          if [[ ! "$expected_revision" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || [ "${#expected_revision}" -gt 63 ]; then
            echo "Derived Cloud Run revision identity is invalid: $expected_revision" >&2
            exit 1
          fi
          tag="pr-${PR_NUMBER}"

          umask 077
          env_file="$RUNNER_TEMP/preview-env.json"
          response="$RUNNER_TEMP/cloud-run-preview-deploy.json"
          revision_response="$RUNNER_TEMP/cloud-run-preview-revision.json"
          health_body="$RUNNER_TEMP/preview-health.json"
          rollback_response="$RUNNER_TEMP/cloud-run-preview-rollback.json"
          rollback_tag=false
          cleanup() {
            exit_status=$?
            set +e
            if [ "$rollback_tag" = "true" ]; then
              if gcloud run services describe "$PREVIEW_SERVICE" \
                --region="$REGION" \
                --project="$PROJECT_ID" \
                --format=json > "$rollback_response" 2>/dev/null; then
                current_revision="$(jq -er --arg tag "$tag" \
                  '[.status.traffic[]? | select(.tag == $tag) | .revisionName] | if length == 1 then .[0] else "__unsafe__" end' \
                  "$rollback_response" 2>/dev/null)"
                if [ "$current_revision" = "$expected_revision" ]; then
                  if gcloud run services update-traffic "$PREVIEW_SERVICE" \
                    --region="$REGION" \
                    --project="$PROJECT_ID" \
                    --remove-tags="$tag" \
                    --quiet >/dev/null 2>&1; then
                    echo "Removed failed preview tag $tag from $expected_revision."
                    if [ "$REPOSITORY_ID" = "280932482" ]; then
                      stable_gone=false
                      for attempt in $(seq 1 30); do
                        if status="$(curl --silent --show-error \
                          --output /dev/null \
                          --write-out '%{http_code}' \
                          --max-time 10 \
                          --proto '=https' \
                          "https://pr-${PR_NUMBER}.preview.ycriticalhistory.org")" &&
                           [ "$status" = "404" ]; then
                          stable_gone=true
                          break
                        fi
                        if [ "$attempt" -lt 30 ]; then
                          sleep 5
                        fi
                      done
                      if [ "$stable_gone" != "true" ]; then
                        echo "Failed preview remained routable after tag rollback." >&2
                      fi
                    fi
                  else
                    echo "Failed to remove invalid preview tag $tag; reconciliation is required." >&2
                  fi
                else
                  echo "Preserving $tag because it no longer targets this run's revision." >&2
                fi
              else
                echo "Could not inspect $tag during failed-deploy rollback; reconciliation is required." >&2
              fi
            fi
            rm -f "$env_file" "${env_file}.next" "$response" "$revision_response" "$health_body" "$rollback_response"
            trap - EXIT
            exit "$exit_status"
          }
          trap cleanup EXIT
          preview_nonce="$(openssl rand -hex 32)"
          if [[ ! "$preview_nonce" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to generate a valid preview deployment nonce." >&2
            exit 1
          fi
          jq -n \
            --arg deploy_nonce "$preview_nonce" \
            --arg preview_number "$PR_NUMBER" \
            '{
              PLATFORM_DEPLOY_ENVIRONMENT: "preview",
              PLATFORM_DEPLOY_NONCE: $deploy_nonce,
              PLATFORM_PREVIEW_NUMBER: $preview_number
            }' > "$env_file"
          case "$REPOSITORY_ID" in
            1255553151)
              # cdbentley has no product-specific preview configuration.
              ;;
            711292980)
              # Runsetta is intentionally offline. Preview code must never gain
              # live OpenAI or Spotify configuration.
              jq '. + {
                RUNSETTA_OFFLINE: "1",
                RUNSETTA_TTS_MODEL: "gpt-4o-mini-tts",
                RUNSETTA_TTS_VOICE: "marin"
              }' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            1025243085)
              # Medlock previews use an in-memory waitlist and have no data-plane
              # identity or Firestore coordinates.
              waitlist_identity_keyset="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
              if [[ ! "$waitlist_identity_keyset" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
                echo "Failed to generate the Medlock preview waitlist signing key." >&2
                exit 1
              fi
              jq --arg waitlist_identity_keyset "$waitlist_identity_keyset" '. + {
                ALLOWED_HOSTS: "medlock.ai,www.medlock.ai,mcp.medlock.ai,healthmcp.ai,www.healthmcp.ai,healthmcp.app,www.healthmcp.app,*.run.app",
                ALLOWED_ORIGINS: "https://medlock.ai,https://www.medlock.ai,https://mcp.medlock.ai,https://chat.openai.com,https://claude.ai,https://*.run.app",
                CANONICAL_HOST: "medlock.ai",
                LEGACY_HOSTS: "healthmcp.ai,www.healthmcp.ai,healthmcp.app,www.healthmcp.app",
                MEDLOCK_VERSION: "0.2.0",
                WAITLIST_IDENTITY_KEYSET: $waitlist_identity_keyset,
                WAITLIST_BACKEND: "memory"
              }' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            280932482)
              if [[ ! "$MAPBOX_PUBLIC_TOKEN" =~ ^pk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
                echo "Critical History requires a protected MAPBOX_PUBLIC_TOKEN in public pk format." >&2
                exit 1
              fi
              jq --arg token "$MAPBOX_PUBLIC_TOKEN" \
                '. + {MAPBOX_PUBLIC_TOKEN: $token}' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            *)
              echo "Repository id $REPOSITORY_ID has no trusted preview runtime configuration." >&2
              exit 1
              ;;
          esac

          rollback_tag=true
          gcloud run deploy "$PREVIEW_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --revision-suffix="$revision_suffix" \
            --tag="$tag" \
            --no-traffic \
            --env-vars-file="$env_file" \
            --clear-secrets \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --ingress="$PREVIEW_INGRESS" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=300s \
            --labels="managed-by=github-actions,environment=preview,git-head-sha=${EXPECTED_HEAD_SHA},github-repository-id=${REPOSITORY_ID},github-pr=${PR_NUMBER},github-run-id=${GITHUB_RUN_ID},github-run-attempt=${GITHUB_RUN_ATTEMPT},platform-workflow-sha=${PLATFORM_WORKFLOW_SHA}" \
            --quiet \
            --format=json > "$response"
          preview_record="$(jq -cer --arg tag "$tag" \
            '[.status.traffic[]? | select(.tag == $tag) | {url, revisionName}] | if length == 1 then .[0] else error("expected exactly one tagged preview record") end' \
            "$response")"
          preview_url="$(jq -er '.url | select(type == "string" and startswith("https://"))' <<< "$preview_record")"
          preview_revision="$(jq -er '.revisionName | select(type == "string")' <<< "$preview_record")"
          if [ "$preview_revision" != "$expected_revision" ]; then
            echo "Cloud Run tagged an unexpected revision: $preview_revision" >&2
            exit 1
          fi
          gcloud run revisions describe "$preview_revision" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json > "$revision_response"
          jq -e \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg head "$EXPECTED_HEAD_SHA" \
            --arg name "$preview_revision" \
            --arg pr "$PR_NUMBER" \
            --arg repository_id "$REPOSITORY_ID" \
            --arg run "$GITHUB_RUN_ID" \
            --arg workflow_sha "$PLATFORM_WORKFLOW_SHA" '
            .metadata.name == $name and
            .metadata.labels["git-head-sha"] == $head and
            .metadata.labels["github-repository-id"] == $repository_id and
            .metadata.labels["github-pr"] == $pr and
            .metadata.labels["github-run-id"] == $run and
            .metadata.labels["github-run-attempt"] == $attempt and
            .metadata.labels["managed-by"] == "github-actions" and
            .metadata.labels.environment == "preview" and
            .metadata.labels["platform-workflow-sha"] == $workflow_sha
          ' "$revision_response" >/dev/null || {
            echo "Cloud Run revision provenance labels do not match this exact source and run." >&2
            exit 1
          }
          deterministic_url="https://pr-${PR_NUMBER}---${PREVIEW_SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app"
          if [ "$preview_url" != "$deterministic_url" ] &&
             [[ ! "$preview_url" =~ ^https://pr-${PR_NUMBER}---${PREVIEW_SERVICE}-[a-z0-9.-]+\.run\.app$ ]]; then
            echo "Cloud Run returned an unexpected tagged preview origin." >&2
            exit 1
          fi

          public_preview_url="$preview_url"
          if [ "$REPOSITORY_ID" = "280932482" ]; then
            public_preview_url="https://pr-${PR_NUMBER}.${STABLE_PREVIEW_DOMAIN}"
          fi

          healthy=false
          for attempt in $(seq 1 30); do
            if health_status="$(curl --silent --show-error \
              --output "$health_body" \
              --write-out '%{http_code}' \
              --max-filesize 1024 \
              --max-time 10 \
              "${public_preview_url}/livez")"; then
              if [ "$health_status" = "200" ] &&
                 jq -e -s --arg nonce "$preview_nonce" \
                   'length == 1 and .[0] == {deployment: $nonce, ok: true}' \
                   "$health_body" >/dev/null 2>&1; then
                healthy=true
                break
              fi
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 5
            fi
          done
          if [ "$healthy" != "true" ]; then
            echo "Preview health endpoint did not return the exact approved response." >&2
            exit 1
          fi

          rollback_tag=false
          echo "url=$public_preview_url" >> "$GITHUB_OUTPUT"
          echo "revision=$preview_revision" >> "$GITHUB_OUTPUT"

      - name: Recheck pull request state after deployment
        id: lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json="$RUNNER_TEMP/post-deploy-pr.json"
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "$pr_json"; then
            echo "keep=false" >> "$GITHUB_OUTPUT"
            echo "Current pull request state could not be proven; the exact deployed revision will be invalidated." >&2
            exit 0
          fi
          if jq -e --arg head "$EXPECTED_HEAD_SHA" --arg repository "$EXPECTED_REPOSITORY" --arg repository_id "$EXPECTED_REPOSITORY_ID" '
            .state == "open" and .draft == false and .head.sha == $head and
            (.head.repo.id | tostring) == $repository_id and .head.repo.full_name == $repository and
            .base.ref == "main"
          ' "$pr_json" >/dev/null; then
            echo "keep=true" >> "$GITHUB_OUTPUT"
          else
            echo "keep=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment preview URL
        if: steps.lifecycle.outputs.keep == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_REVISION: ${{ steps.deploy.outputs.revision }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Preview for commit ${EXPECTED_HEAD_SHA} deployed at ${PREVIEW_URL} (revision ${PREVIEW_REVISION})."

  invalidate:
    name: Invalidate stale preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: deploy
    if: >-
      always() &&
      needs.deploy.outputs.deployed-revision != '' &&
      needs.deploy.outputs.lifecycle-keep != 'true'
    environment: preview-operations
    permissions:
      id-token: write # Exchange only for the exact-SHA preview-operations path.
    concurrency:
      group: preview-cloud-${{ github.event.repository.id }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted application configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648"; service_name="cdbentley" ;;
            711292980) project_id="runsetta"; project_number="601124730704"; service_name="runsetta" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510"; service_name="medlock" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513"; service_name="critical-history" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview invalidation." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "region=us-east4"
            echo "preview_service=${service_name}-preview"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "deploy_service_account=gha-preview-deploy@${project_id}.iam.gserviceaccount.com"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Install checksum-pinned Google Cloud CLI
        env:
          GCLOUD_SHA256: deffdbe82ca6e3d19ffb291d063a651488e04e1b33799b5a238e4b5c6784e3c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/google-cloud-cli-581.0.0-linux-x86_64.tar.gz"
          sdk_root="$RUNNER_TEMP/google-cloud-cli"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            'https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-581.0.0-linux-x86_64.tar.gz?generation=1787059661116797'
          echo "${GCLOUD_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$sdk_root"
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          export CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          export CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
          "$sdk_root/bin/gcloud" version --format=json \
            | jq -e '.["Google Cloud SDK"] == "581.0.0"' >/dev/null
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true"
            echo "CLOUDSDK_CORE_DISABLE_PROMPTS=1"
            echo "CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true"
          } >> "$GITHUB_ENV"

      - name: Prove exact preview operator workflow-SHA WIF trust
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate trusted preview deployer for stale-tag invalidation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.deploy_service_account }}

      - name: Remove a tag deployed after its pull request changed
        env:
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REVISION: ${{ needs.deploy.outputs.deployed-revision }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]] ||
             [[ ! "$REPOSITORY_ID" =~ ^(1255553151|711292980|1025243085|280932482)$ ]] ||
             [[ ! "$EXPECTED_REVISION" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
            echo "Refusing invalid preview tag or revision identity." >&2
            exit 1
          fi

          tag="pr-${PR_NUMBER}"
          service_json="$(mktemp)"
          describe_error="$(mktemp)"
          trap 'rm -f "$service_json" "$describe_error"' EXIT

          verify_stable_preview_absent() {
            if [ "$REPOSITORY_ID" != "280932482" ]; then
              return 0
            fi
            stable_url="https://pr-${PR_NUMBER}.preview.ycriticalhistory.org"
            for attempt in $(seq 1 30); do
              if status="$(curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 10 \
                --proto '=https' \
                "$stable_url")" && [ "$status" = "404" ]; then
                return 0
              fi
              if [ "$attempt" -lt 30 ]; then
                sleep 5
              fi
            done
            echo "Stable preview URL remained routable after removing $tag." >&2
            return 1
          }
          if ! gcloud run services describe "$PREVIEW_SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format=json > "$service_json" 2> "$describe_error"; then
            cat "$describe_error" >&2
            exit 1
          fi

          current_revision="$(jq -er --arg tag "$tag" \
            '[.status.traffic[]? | select(.tag == $tag) | .revisionName] | if length == 0 then "__absent__" elif length == 1 then .[0] else error("duplicate preview traffic tag") end' \
            "$service_json")"
          if [ "$current_revision" = "__absent__" ]; then
            echo "Preview tag $tag is already absent; nothing to invalidate."
            verify_stable_preview_absent
            exit 0
          fi
          if [[ ! "$current_revision" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
            echo "Cloud Run returned an invalid current revision identity; preserving $tag." >&2
            exit 1
          fi
          if [ "$current_revision" != "$EXPECTED_REVISION" ]; then
            echo "Preserving $tag at $current_revision because this run deployed $EXPECTED_REVISION."
            exit 0
          fi

          gcloud run services update-traffic "$PREVIEW_SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --remove-tags="$tag" \
            --quiet
          verify_stable_preview_absent
