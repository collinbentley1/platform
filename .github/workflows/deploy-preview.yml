name: Deploy preview

on:
  workflow_call:

permissions: {}

jobs:
  rerun-guard:
    name: Reject privileged workflow reruns
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

  prefetch-bases:
    name: Prefetch exact public DHI bases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: >-
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    # This fresh environment must allow only the selected protected main branch. It
    # contains one read-public-only DHI token and is never entered by PR code.
    environment: dhi-base-prefetch-20260822-098dca9280b3
    permissions: {}
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.bundle.outputs.content_sha256 }}
      manifest-sha256: ${{ steps.bundle.outputs.manifest_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source before secret use
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-prefetch-policy"
          git_home="$RUNNER_TEMP/platform-prefetch-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          test ! -e "$git_home" && test ! -L "$git_home"
          install -d -m 0700 "$destination" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          unset GIT_CONFIG_SYSTEM GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          git_safe() {
            /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= \
              -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false \
              -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"
          }
          git_safe -C "$destination" init --quiet
          git_safe -C "$destination" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$destination" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          git_safe -C "$destination" checkout --quiet --detach FETCH_HEAD
          test "$(git_safe -C "$destination" rev-parse --verify HEAD^{commit})" = "$WORKFLOW_SHA"
          test "$(git_safe -C "$destination" status --porcelain=v1 --untracked-files=all)" = ""
          helper="$destination/tools/ci/container-artifact-contract.sh"
          test -f "$helper" && test ! -L "$helper"
          expected="$(git_safe -C "$destination" rev-parse "$WORKFLOW_SHA:tools/ci/container-artifact-contract.sh")"
          test "$(git_safe -C "$destination" hash-object --no-filters "$helper")" = "$expected"
          rm -rf -- "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Fetch, verify, and close the exact public base graph
        id: bundle
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_KIND: preview
          DHI_PUBLIC_READ_TOKEN: ${{ secrets.DHI_PUBLIC_READ_TOKEN_20260822_098DCA9280B3 }}
          DHI_USERNAME: ${{ vars.DHI_USERNAME }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" prefetch

      - name: Verify DHI credentials were retired before artifact publication
        if: always() && github.run_attempt == '1'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          auth_root="$RUNNER_TEMP/platform-regctl-auth"
          artifact="${{ steps.bundle.outputs.artifact }}"
          if [ -e "$auth_root" ] || [ -L "$auth_root" ]; then
            echo "DHI registry credentials survived prefetch." >&2
            rm -rf -- "$auth_root" "$RUNNER_TEMP/platform-base-bundle" "$artifact"
            exit 1
          fi
          if [ ! -f "$artifact" ] || [ -L "$artifact" ]; then
            echo "Base-image artifact was not produced safely." >&2
            exit 1
          fi

      - name: Upload the one-day public base closure as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Pinned v7 raw mode derives the artifact name from this file's basename.
          path: ${{ steps.bundle.outputs.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build untrusted preview without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prefetch-bases
    if: >-
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      needs.prefetch-bases.result == 'success'
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.oci.outputs.content_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-build-policy"
          repository="$RUNNER_TEMP/platform-build-repository"
          git_home="$RUNNER_TEMP/platform-build-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools templates | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Download only the exact base artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-base-download
          digest-mismatch: error
          skip-decompress: true

      - name: Validate and extract the closed base artifact
        id: base_images
        env:
          ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-base-download
          EXPECTED_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" verify-base

      - name: Resolve fixed build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha='${{ github.event.pull_request.head.sha }}'
          base_sha='${{ github.event.pull_request.base.sha }}'
          pr_number='${{ github.event.pull_request.number }}'
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          test "$base_sha" = "$GITHUB_SHA"
          pr="$RUNNER_TEMP/current-pr.json"
          main="$RUNNER_TEMP/current-main.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "$pr"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$main"
          jq -e --arg head "$head_sha" --arg base "$base_sha" --arg repository "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and .head.sha == $head and
            .head.repo.full_name == $repository and .base.ref == "main" and .base.sha == $base
          ' "$pr" >/dev/null
          test "$(jq -er '.object.sha' "$main")" = "$base_sha"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify the exact checked-out pull request head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse --verify 'HEAD^{commit}')" = "$EXPECTED_HEAD_SHA"
          test "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)" = ""

      - name: Install checksum-pinned Bun 1.4.0 for structural policy checks
        env:
          BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          echo "${BUN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          echo "$destination/bun-linux-x64" >> "$GITHUB_PATH"
          (
            cd "${{ steps.policy.outputs.root }}/tools/ci"
            "$destination/bun-linux-x64/bun" --no-env-file --no-orphans \
              -e 'if (Bun.version !== "1.4.0") process.exit(1)'
          )

      - name: Enforce the trusted application and container contract
        run: |
          set -euo pipefail
          (
            cd "${{ steps.policy.outputs.root }}/tools/ci"
            bun --no-env-file --no-orphans ./enforce-app-contract.ts \
              "$GITHUB_WORKSPACE" \
              "${{ steps.policy.outputs.root }}/templates/app" \
              "${{ github.event.repository.id }}" \
              "${{ job.workflow_sha }}"
          )

      - name: Scan the resolved lock with the public Socket policy
        run: |
          set -euo pipefail
          print_untrusted_output() {
            local stop_marker
            stop_marker="$(cat /proc/sys/kernel/random/uuid)"
            printf '::stop-commands::%s\n' "$stop_marker"
            printf '%s\n' "$1"
            printf '::%s::\n' "$stop_marker"
          }
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "Committed node_modules content is forbidden before the public Socket scan." >&2
            exit 1
          fi
          before="$(sha256sum package.json bun.lock)"
          unset SOCKET_API_TOKEN SOCKET_API_KEY
          unset BUN_CONFIG_SKIP_LOAD_LOCKFILE BUN_FEATURE_FLAG_DISABLE_IGNORE_SCRIPTS BUN_CONFIG_REGISTRY NPM_CONFIG_REGISTRY
          if ! scan_output="$(bun --no-env-file --config="${{ steps.policy.outputs.root }}/tools/ci/bunfig.toml" pm scan 2>&1)"; then
            print_untrusted_output "$scan_output"
            exit 1
          fi
          print_untrusted_output "$scan_output"
          if ! grep -Fq 'Socket Security Scanner free mode' <<< "$scan_output"; then
            echo "The preview lock scan must remain credential-free." >&2
            exit 1
          fi
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "bun pm scan must not create node_modules." >&2
            exit 1
          fi
          if [[ "$(sha256sum package.json bun.lock)" != "$before" ]]; then
            echo "bun pm scan must not mutate package.json or bun.lock." >&2
            exit 1
          fi

      - name: Install checksum-pinned Docker Buildx and create pinned BuildKit
        id: buildx
        env:
          BUILDX_SHA256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/platform-docker"
          plugin="$docker_config/cli-plugins/docker-buildx"
          builder="platform-builder"
          mkdir -p "$(dirname "$plugin")"
          curl --fail --show-error --silent --location \
            --output "$plugin" \
            https://github.com/docker/buildx/releases/download/v0.36.1/buildx-v0.36.1.linux-amd64
          echo "${BUILDX_SHA256}  ${plugin}" | sha256sum --check --strict
          chmod 0755 "$plugin"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$docker_config" docker buildx version | grep -F 'v0.36.1'
          DOCKER_CONFIG="$docker_config" docker buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 \
            --use
          DOCKER_CONFIG="$docker_config" docker buildx inspect "$builder" --bootstrap
          echo "name=$builder" >> "$GITHUB_OUTPUT"

      - name: Disable workflow commands for untrusted build output
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/platform-build-command-token"
          if [ -e "$token_file" ] || [ -L "$token_file" ]; then
            echo "The workflow-command token file already exists." >&2
            exit 1
          fi
          token="$(cat /proc/sys/kernel/random/uuid)"
          [[ "$token" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          (umask 077; printf '%s\n' "$token" > "$token_file")
          printf '::stop-commands::%s\n' "$token"

      - name: Build untrusted preview image into a local OCI archive
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_CHECKS_ANNOTATIONS: "false"
        with:
          builder: ${{ steps.buildx.outputs.name }}
          github-token: ""
          build-contexts: |
            platform.invalid/bun-release=oci-layout://${{ steps.base_images.outputs.oven_layout }}@${{ steps.base_images.outputs.oven_child_digest }}
            platform.invalid/dhi-bun-dev=oci-layout://${{ steps.base_images.outputs.dhi_dev_layout }}@${{ steps.base_images.outputs.dhi_dev_child_digest }}
            platform.invalid/dhi-bun-runtime=oci-layout://${{ steps.base_images.outputs.dhi_runtime_layout }}@${{ steps.base_images.outputs.dhi_runtime_child_digest }}
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: false
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/platform-image.oci.tar,oci-mediatypes=true,oci-artifact=true
          provenance: mode=max,version=v1
          tags: platform-preview:${{ steps.metadata.outputs.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Restore workflow commands after untrusted build output
        if: always() && github.run_attempt == '1'
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/platform-build-command-token"
          if [ ! -f "$token_file" ] || [ -L "$token_file" ]; then
            echo "The workflow-command token file is missing or invalid." >&2
            exit 1
          fi
          token="$(cat "$token_file")"
          [[ "$token" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          unlink "$token_file"
          printf '::%s::\n' "$token"

      - name: Destroy BuildKit and runner-local bases
        if: always() && github.run_attempt == '1'
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          if [ -n "$BUILDER_NAME" ] && docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            docker buildx rm "$BUILDER_NAME"
          fi
          if [ -n "$BUILDER_NAME" ] && docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            echo "BuildKit builder still exists after removal." >&2
            exit 1
          fi
          rm -rf -- "${{ steps.base_images.outputs.base_root }}"
          if [ -e "${{ steps.base_images.outputs.base_root }}" ] ||
             [ -L "${{ steps.base_images.outputs.base_root }}" ]; then
            echo "Runner-local base-image layouts survived the build." >&2
            exit 1
          fi

      - name: Hash the opaque untrusted OCI output
        id: oci
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/platform-image.oci.tar"
          test -f "$image" && test ! -L "$image"
          test "$(stat -c %s "$image")" -le 1073741824
          content_sha256="$(sha256sum "$image" | cut -d ' ' -f 1)"
          echo "content_sha256=$content_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the opaque OCI output as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Pinned v7 raw mode derives the artifact name from this file's basename.
          path: ${{ runner.temp }}/platform-image.oci.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  verify-image:
    name: Verify and promote preview OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - build
      - prefetch-bases
    if: needs.build.result == 'success' && needs.prefetch-bases.result == 'success'
    permissions:
      actions: read
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.promote.outputs.content_sha256 }}
      image-digest: ${{ steps.promote.outputs.published_index_digest }}
      runnable-digest: ${{ steps.promote.outputs.runnable_manifest_digest }}
      sbom-content-digest: ${{ steps.promote.outputs.sbom_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-promoter-policy"
          repository="$RUNNER_TEMP/platform-promoter-repository"
          git_home="$RUNNER_TEMP/platform-promoter-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools/ci | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Bind both exact source artifacts to this run
        env:
          BASE_ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          BASE_ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          BUILT_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          BUILT_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for value in "$BASE_ARTIFACT_DIGEST" "$BUILT_ARTIFACT_DIGEST"; do [[ "$value" =~ ^[0-9a-f]{64}$ ]]; done
          for value in "$BASE_ARTIFACT_ID" "$BUILT_ARTIFACT_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]]; done
          verify_artifact() {
            local id="$1" digest="$2" name="$3" max="$4"
            local response="$RUNNER_TEMP/artifact-${id}.json"
            gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$response"
            jq -e --arg id "$id" --arg digest "sha256:${digest}" --arg name "$name" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson max "$max" --argjson repo "$EXPECTED_REPOSITORY_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
              (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
              .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
              (.size_in_bytes > 0 and .size_in_bytes <= $max)
            ' "$response" >/dev/null
          }
          verify_artifact "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_DIGEST" "platform-preview-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1611661312
          verify_artifact "$BUILT_ARTIFACT_ID" "$BUILT_ARTIFACT_DIGEST" platform-image.oci.tar 1073741824

      - name: Download only the exact opaque image artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-image-download
          digest-mismatch: error
          skip-decompress: true

      - name: Download only the exact reviewed base artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-promoter-bases
          digest-mismatch: error
          skip-decompress: true

      - name: Validate, scan, and promote in a fresh credentialless job
        id: promote
        env:
          ARTIFACT_KIND: preview
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-promoter-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          BUILT_CONTENT_SHA256: ${{ needs.build.outputs.content-sha256 }}
          BUILT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-image-download
          EXPECTED_EVENT_NAME: pull_request_target
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" promote

      - name: Upload the promoted image as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Pinned v7 raw mode derives the artifact name from this file's basename.
          path: ${{ steps.promote.outputs.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  canary:
    name: Prove exact preview WIF trust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' &&
      github.ref == 'refs/heads/main' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    environment: preview-cloud-canary
    permissions:
      id-token: write # Exchange only for the no-role exact-WIF canary identity.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted canary configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648" ;;
            711292980) project_id="runsetta"; project_number="601124730704" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview deployment." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "project_number=$project_number"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Exchange a token through the no-role canary
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
          access_token_lifetime: 300s

  publish-canary:
    name: Prove exact preview publisher WIF trust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' &&
      github.base_ref == 'main' &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.ref == 'refs/heads/main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type == 'User' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    environment: preview-publish-canary
    permissions:
      id-token: write # Exchange only for the no-role exact-WIF canary identity.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted publisher-canary configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648" ;;
            711292980) project_id="runsetta"; project_number="601124730704" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview publication." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Exchange a preview-publish token through the no-role canary
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
          access_token_lifetime: 300s

  publish:
    name: Publish verified preview OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - canary
      - prefetch-bases
      - publish-canary
      - verify-image
    if: >-
      always() &&
      needs.canary.result == 'success' &&
      needs.prefetch-bases.result == 'success' &&
      needs.publish-canary.result == 'success' &&
      needs.verify-image.result == 'success'
    environment: preview-publish
    permissions:
      actions: read # Read only the exact promoted artifact id from this run.
      id-token: write # Exchange only for the exact-SHA publisher identity.
    outputs:
      image-digest: ${{ steps.copy.outputs.digest }}
      image-name: ${{ steps.app.outputs.image_name }}
      runnable-digest: ${{ needs.verify-image.outputs.runnable-digest }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source before OIDC
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-publisher-policy"
          repository="$RUNNER_TEMP/platform-publisher-repository"
          git_home="$RUNNER_TEMP/platform-publisher-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools/ci | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Resolve trusted application configuration
        id: app
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648"; service_name="cdbentley"; repository="site-preview" ;;
            711292980) project_id="runsetta"; project_number="601124730704"; service_name="runsetta"; repository="api-preview" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510"; service_name="medlock"; repository="site-preview" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513"; service_name="critical-history"; repository="site-preview" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview publication." >&2; exit 1 ;;
          esac
          image_name="us-east4-docker.pkg.dev/${project_id}/${repository}/${service_name}"
          {
            echo "project_id=$project_id"
            echo "image_name=$image_name"
            echo "remote_image=${image_name}:pr-${PR_NUMBER}-${{ github.event.pull_request.head.sha }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "publisher_service_account=gha-preview-publish@${project_id}.iam.gserviceaccount.com"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Bind the exact promoted artifact metadata before OIDC
        env:
          ARTIFACT_DIGEST: ${{ needs.verify-image.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.verify-image.outputs.artifact-id }}
          BASE_ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          BASE_ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for value in "$ARTIFACT_ID" "$BASE_ARTIFACT_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]]; done
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BASE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          verify_artifact() {
            local id="$1" digest="$2" name="$3" max="$4"
            local response="$RUNNER_TEMP/publisher-artifact-${id}.json"
            gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$response"
            jq -e --arg digest "sha256:${digest}" --arg id "$id" --arg name "$name" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson max "$max" --argjson repo "$EXPECTED_REPOSITORY_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
              (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
              .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
              (.size_in_bytes > 0 and .size_in_bytes <= $max)
            ' "$response" >/dev/null
          }
          verify_artifact "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "platform-preview-promoted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1074790400
          verify_artifact "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_DIGEST" "platform-preview-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1611661312

      - name: Download only the exact promoted artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-promoted-download
          digest-mismatch: error
          skip-decompress: true

      - name: Download the exact trusted base artifact independently
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-publisher-bases
          digest-mismatch: error
          skip-decompress: true

      - name: Revalidate the promoted artifact without extracting layers
        id: artifact
        env:
          ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-promoted-download
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-publisher-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          EXPECTED_CONTENT_SHA256: ${{ needs.verify-image.outputs.content-sha256 }}
          EXPECTED_EVENT_NAME: pull_request_target
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PUBLISHED_INDEX_DIGEST: ${{ needs.verify-image.outputs.image-digest }}
          EXPECTED_RUNNABLE_MANIFEST_DIGEST: ${{ needs.verify-image.outputs.runnable-digest }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" validate-promoted

      - name: Prepare the checksum-pinned streaming publisher before OIDC
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" prepare-publisher

      - name: Prove exact preview publisher workflow-SHA WIF trust
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
          access_token_lifetime: 300s

      - name: Authenticate preview publisher
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.publisher_service_account }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Stream the verified OCI graph into the fixed Artifact Registry repository
        id: copy
        env:
          AR_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPECTED_PUBLISHED_INDEX_DIGEST: ${{ needs.verify-image.outputs.image-digest }}
          IMAGE_ARCHIVE: ${{ steps.artifact.outputs.image_archive }}
          REMOTE_IMAGE: ${{ steps.app.outputs.remote_image }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" publish

      - name: Verify publisher credentials were retired
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/platform-publisher-auth"
          test ! -L "$RUNNER_TEMP/platform-publisher-auth"

  attest:
    name: Attest preview image and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - publish
      - verify-image
    if: needs.publish.result == 'success'
    environment: supply-chain
    permissions:
      actions: read # Download the SBOM artifact from this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Obtain the GitHub artifact-attestation signing identity.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Download the exact promoted image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-attest-download
          digest-mismatch: error
          skip-decompress: true

      - name: Extract and verify only the exact SBOM bytes
        env:
          EXPECTED_CONTENT_SHA256: ${{ needs.verify-image.outputs.content-sha256 }}
          EXPECTED_SBOM_DIGEST: ${{ needs.verify-image.outputs.sbom-content-digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CONTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SBOM_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t files < <(find "$RUNNER_TEMP/platform-attest-download" -mindepth 1 -maxdepth 1 -type f -print)
          test "${#files[@]}" -eq 1
          printf '%s  %s\n' "$EXPECTED_CONTENT_SHA256" "${files[0]}" | sha256sum --check --strict
          test "$(sort -u < <(tar -tf "${files[0]}") | tr '\n' ' ')" = "./ ./dhi-runtime.manifest.json ./image.oci.tar ./manifest.json ./sbom.spdx.json "
          mkdir -p platform-build
          tar -xOf "${files[0]}" ./sbom.spdx.json > platform-build/sbom.spdx.json
          printf '%s  %s\n' "$EXPECTED_SBOM_DIGEST" platform-build/sbom.spdx.json | sha256sum --check --strict

      - name: Require a valid JSON SBOM
        run: jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array")' platform-build/sbom.spdx.json >/dev/null

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.publish.outputs.image-name }}
          subject-digest: ${{ needs.publish.outputs.image-digest }}

      - name: Attest the SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.publish.outputs.image-name }}
          subject-digest: ${{ needs.publish.outputs.image-digest }}
          sbom-path: platform-build/sbom.spdx.json

  deploy:
    name: Deploy isolated preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - attest
      - prefetch-bases
      - publish
    if: >-
      needs.attest.result == 'success' &&
      needs.prefetch-bases.result == 'success' &&
      needs.publish.result == 'success'
    environment: preview-cloud
    permissions:
      actions: read # Download only this run's exact DHI base closure before OIDC.
      contents: read
      id-token: write # Exchange only for the service-scoped preview deploy identity.
      pull-requests: write # Post the validated tagged preview URL on its pull request.
    outputs:
      admission-open: ${{ steps.traffic-commit.outcome }}
      deployed-revision: ${{ steps.deploy.outputs.revision }}
      lifecycle-keep: ${{ steps.traffic-commit.outputs.admitted }}
    concurrency:
      group: deployment-parity-${{ github.event.repository.id }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted application configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648"; service_name="cdbentley"; repository="site"; preview_ingress="all"; stable_preview_domain="" ;;
            711292980) project_id="runsetta"; project_number="601124730704"; service_name="runsetta"; repository="api"; preview_ingress="all"; stable_preview_domain="" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510"; service_name="medlock"; repository="site"; preview_ingress="all"; stable_preview_domain="" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513"; service_name="critical-history"; repository="site"; preview_ingress="internal-and-cloud-load-balancing"; stable_preview_domain="preview.ycriticalhistory.org" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview deployment." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "preview_ingress=$preview_ingress"
            echo "region=us-east4"
            echo "project_number=$project_number"
            echo "service_name=$service_name"
            echo "stable_preview_domain=$stable_preview_domain"
            echo "preview_service=${service_name}-preview"
            echo "production_image=us-east4-docker.pkg.dev/${project_id}/${repository}/${service_name}"
            echo "preview_image=us-east4-docker.pkg.dev/${project_id}/${repository}-preview/${service_name}"
            echo "runtime_service_account=cloud-run-preview@${project_id}.iam.gserviceaccount.com"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "deploy_service_account=gha-preview-deploy@${project_id}.iam.gserviceaccount.com"
            echo "commit_service_account=gha-preview-commit@${project_id}.iam.gserviceaccount.com"
            echo "iam_audit_service_account=gha-preview-operator@${project_id}.iam.gserviceaccount.com"
            echo "parity_service_account=gha-deploy-parity@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the exact reusable-workflow parity policy before OIDC
        id: parity-policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-live-parity-policy"
          repository="$RUNNER_TEMP/platform-live-parity-repository"
          git_home="$RUNNER_TEMP/platform-live-parity-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" \
            tools/ci/container-artifact-contract.sh \
            tools/ci/cloud-run-dhi-parity.sh \
            tools/ci/cloud-run-preview-controller.sh \
            tools/ci/cloud-run-preview-traffic.sh \
            tools/ci/deployment-parity-transition.sh \
            tools/ci/preview-runtime-iam-contract.sh | tar -x -C "$destination"
          for helper in container-artifact-contract.sh cloud-run-dhi-parity.sh cloud-run-preview-controller.sh cloud-run-preview-traffic.sh deployment-parity-transition.sh preview-runtime-iam-contract.sh; do
            test -f "$destination/tools/ci/$helper" && test ! -L "$destination/tools/ci/$helper"
          done
          test -x "$destination/tools/ci/deployment-parity-transition.sh"
          dhi_parity_id="$(/bin/bash "$destination/tools/ci/container-artifact-contract.sh" print-dhi-parity-id)"
          [[ "$dhi_parity_id" =~ ^[a-z0-9]{50}$ ]]
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"
          echo "dhi-parity-id=$dhi_parity_id" >> "$GITHUB_OUTPUT"

      - name: Bind the exact DHI base artifact before OIDC
        env:
          ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          response="$RUNNER_TEMP/live-parity-base-artifact.json"
          gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "$response"
          jq -e --arg digest "sha256:${ARTIFACT_DIGEST}" --arg id "$ARTIFACT_ID" \
            --arg name "platform-preview-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" \
            --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson repo "${{ github.event.repository.id }}" '
            (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
            (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
            .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
            (.size_in_bytes > 0 and .size_in_bytes <= 1611661312)
          ' "$response" >/dev/null

      - name: Download only the exact DHI base artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/platform-live-parity-bases
          skip-decompress: true

      - name: Install checksum-pinned Google Cloud CLI
        env:
          GCLOUD_SHA256: deffdbe82ca6e3d19ffb291d063a651488e04e1b33799b5a238e4b5c6784e3c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/google-cloud-cli-581.0.0-linux-x86_64.tar.gz"
          sdk_root="$RUNNER_TEMP/google-cloud-cli"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            'https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-581.0.0-linux-x86_64.tar.gz?generation=1787059661116797'
          echo "${GCLOUD_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$sdk_root"
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          export CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          export CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
          "$sdk_root/bin/gcloud" version --format=json \
            | jq -e '.["Google Cloud SDK"] == "581.0.0"' >/dev/null
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true"
            echo "CLOUDSDK_CORE_DISABLE_PROMPTS=1"
            echo "CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true"
          } >> "$GITHUB_ENV"

      - name: Authenticate the read-only deployment parity identity
        id: parity-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.parity_service_account }}
          create_credentials_file: true
          export_environment_variables: false
          access_token_lifetime: 300s

      - name: Prove exact live production DHI parity under the deployment lock
        id: parity
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-live-parity-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          EXPECTED_PRODUCTION_IMAGE_NAME: ${{ steps.app.outputs.production_image }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_SERVICE_NAME: ${{ steps.app.outputs.service_name }}
          PARITY_CREDENTIAL_FILE: ${{ steps.parity-auth.outputs.credentials_file_path }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          REGION: ${{ steps.app.outputs.region }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          token_file="$RUNNER_TEMP/deployment-parity-access-token"
          header_file="$RUNNER_TEMP/deployment-parity-rest-header"
          cleanup_parity_credentials() {
            rm -f -- "$token_file" "$header_file"
            if [[ "${PARITY_CREDENTIAL_FILE:-}" == "$GITHUB_WORKSPACE"/* ]] &&
               { [ -f "$PARITY_CREDENTIAL_FILE" ] || [ -L "$PARITY_CREDENTIAL_FILE" ]; }; then
              rm -f -- "$PARITY_CREDENTIAL_FILE"
            fi
          }
          trap cleanup_parity_credentials EXIT
          [[ "$PARITY_CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
          test -f "$PARITY_CREDENTIAL_FILE" && test ! -L "$PARITY_CREDENTIAL_FILE"
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$PARITY_CREDENTIAL_FILE" gcloud auth print-access-token > "$token_file"
          printf 'Authorization: Bearer %s\n' "$(<"$token_file")" > "$header_file"
          service_json="$RUNNER_TEMP/live-production-service.json"
          revision_json="$RUNNER_TEMP/live-production-revision.json"
          gcloud --access-token-file="$token_file" run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$service_json"
          revision="$(jq -er '.status.latestReadyRevisionName | select(test("^[a-z][a-z0-9-]{0,62}$"))' "$service_json")"
          gcloud --access-token-file="$token_file" run revisions describe "$revision" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$revision_json"
          PARITY_SERVICE_JSON="$service_json" PARITY_REVISION_JSON="$revision_json" \
            /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/cloud-run-dhi-parity.sh" prove-production
          output_value() { sed -n "s/^$1=//p" "$2" | tail -n 1; }
          live_index_image="$(output_value live_production_index_image "$GITHUB_OUTPUT")"
          live_runnable_image="$(output_value live_production_runnable_image "$GITHUB_OUTPUT")"
          live_head="$(jq -er '.metadata.labels["git-head-sha"]' "$revision_json")"
          fetch_production_v2() {
            local service_out="$1" revision_out="$2" exact_revision="$3"
            curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
              --header "@$header_file" --output "$service_out" \
              "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}"
            curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
              --header "@$header_file" --output "$revision_out" \
              "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}/revisions/${exact_revision}"
          }
          validate_production_v2() {
            local service_v2="$1" revision_v2="$2" exact_revision="$3" index_image="$4" runnable_image="$5"
            jq -e --arg name "projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}" --arg revision "$exact_revision" '
              .name == $name and (.reconciling // false) == false and
              .ingress == "INGRESS_TRAFFIC_ALL" and .invokerIamDisabled == true and
              (.defaultUriDisabled // false) == false and
              .generation == .observedGeneration and
              .terminalCondition.type == "Ready" and .terminalCondition.state == "CONDITION_SUCCEEDED" and
              all(.template.containers[]?; ((.baseImageUri // "") == "")) and
              (.latestReadyRevision | split("/")[-1]) == $revision and
              (.traffic | length) == 1 and .traffic[0].type == "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST" and
              .traffic[0].percent == 100 and ((.traffic[0].tag // "") == "") and ((.traffic[0].revision // "") == "") and
              (.trafficStatuses | length) == 1 and .trafficStatuses[0].type == "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST" and
              .trafficStatuses[0].percent == 100 and ((.trafficStatuses[0].tag // "") == "") and
              ((.trafficStatuses[0].revision // "") == "")
            ' "$service_v2" >/dev/null
            jq -e --arg name "projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}/revisions/${exact_revision}" \
              --arg image "$runnable_image" --arg index "${index_image##*@}" --arg runnable "${runnable_image##*@}" '
              def exact_value($name):
                [.containers[0].env[]? | select(.name == $name and (keys | sort) == ["name","value"]) | .value]
                | if length == 1 then .[0] else error("missing or duplicate immutable image identity") end;
              .name == $name and (.reconciling // false) == false and
              (.containers | length) == 1 and .containers[0].image == $image and
              ((.containers[0].baseImageUri // "") == "") and
              exact_value("PLATFORM_IMAGE_INDEX_DIGEST") == $index and
              exact_value("PLATFORM_IMAGE_RUNNABLE_DIGEST") == $runnable and
              ([.conditions[]? | select(.type == "Ready" and .state == "CONDITION_SUCCEEDED")] | length) == 1
            ' "$revision_v2" >/dev/null
          }
          v2_service_before="$RUNNER_TEMP/live-production-v2-service.json"
          v2_revision_before="$RUNNER_TEMP/live-production-v2-revision.json"
          fetch_production_v2 "$v2_service_before" "$v2_revision_before" "$revision"
          validate_production_v2 "$v2_service_before" "$v2_revision_before" "$revision" "$live_index_image" "$live_runnable_image"
          v2_service_before_sha="$(jq -cS '{name,generation,observedGeneration,ingress,invokerIamDisabled,defaultUriDisabled,traffic,trafficStatuses,latestReadyRevision,reconciling,terminalCondition,urls,uri,etag,template}' "$v2_service_before" | sha256sum | cut -d ' ' -f 1)"
          v2_revision_before_sha="$(jq -cS '{name,generation,labels,serviceAccount,containers,reconciling,conditions,etag}' "$v2_revision_before" | sha256sum | cut -d ' ' -f 1)"
          AR_ACCESS_TOKEN="$(<"$token_file")" LIVE_PRODUCTION_INDEX_IMAGE="$live_index_image" \
            LIVE_PRODUCTION_RUNNABLE_IMAGE="$live_runnable_image" LIVE_PRODUCTION_HEAD_SHA="$live_head" \
            /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/container-artifact-contract.sh" verify-live-production
          service_after="$RUNNER_TEMP/live-production-service-after-oci.json"
          revision_after="$RUNNER_TEMP/live-production-revision-after-oci.json"
          after_outputs="$RUNNER_TEMP/live-production-after-oci.outputs"
          gcloud --access-token-file="$token_file" run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$service_after"
          revision_after_name="$(jq -er '.status.latestReadyRevisionName | select(test("^[a-z][a-z0-9-]{0,62}$"))' "$service_after")"
          gcloud --access-token-file="$token_file" run revisions describe "$revision_after_name" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$revision_after"
          GITHUB_OUTPUT="$after_outputs" PARITY_SERVICE_JSON="$service_after" PARITY_REVISION_JSON="$revision_after" \
            /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/cloud-run-dhi-parity.sh" prove-production
          v2_service_after="$RUNNER_TEMP/live-production-v2-service-after-oci.json"
          v2_revision_after="$RUNNER_TEMP/live-production-v2-revision-after-oci.json"
          fetch_production_v2 "$v2_service_after" "$v2_revision_after" "$revision_after_name"
          validate_production_v2 "$v2_service_after" "$v2_revision_after" "$revision_after_name" \
            "$(output_value live_production_index_image "$after_outputs")" \
            "$(output_value live_production_runnable_image "$after_outputs")"
          v2_service_after_sha="$(jq -cS '{name,generation,observedGeneration,ingress,invokerIamDisabled,defaultUriDisabled,traffic,trafficStatuses,latestReadyRevision,reconciling,terminalCondition,urls,uri,etag,template}' "$v2_service_after" | sha256sum | cut -d ' ' -f 1)"
          v2_revision_after_sha="$(jq -cS '{name,generation,labels,serviceAccount,containers,reconciling,conditions,etag}' "$v2_revision_after" | sha256sum | cut -d ' ' -f 1)"
          if [ "$v2_service_before_sha" != "$v2_service_after_sha" ] ||
             [ "$v2_revision_before_sha" != "$v2_revision_after_sha" ]; then
            echo "Production v2 service or revision changed while its remote OCI graph was being verified." >&2
            exit 1
          fi
          for key in live_production_head_sha live_production_index_digest live_production_index_image live_production_runnable_digest live_production_runnable_image production_revision revision_projection_sha256 service_projection_sha256; do
            test "$(output_value "$key" "$GITHUB_OUTPUT")" = "$(output_value "$key" "$after_outputs")" || {
              echo "Production changed while its remote OCI graph was being verified." >&2
              exit 1
            }
          done
          echo "v2_service_projection_sha256=$v2_service_after_sha" >> "$GITHUB_OUTPUT"
          echo "v2_revision_projection_sha256=$v2_revision_after_sha" >> "$GITHUB_OUTPUT"
          cleanup_parity_credentials
          trap - EXIT

      - name: Authenticate preview deployer
        id: deploy-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.deploy_service_account }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Confirm the pull request is still deployable
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg head "$EXPECTED_HEAD_SHA" --arg repository "$EXPECTED_REPOSITORY" --arg repository_id "$EXPECTED_REPOSITORY_ID" '
            .state == "open" and .draft == false and .head.sha == $head and
            (.head.repo.id | tostring) == $repository_id and .head.repo.full_name == $repository and
            .base.ref == "main"
          ' <<< "$pr_json" >/dev/null || {
            echo "Refusing stale or retargeted preview deploy." >&2
            exit 1
          }

      - name: Deploy preview to Cloud Run
        id: deploy
        env:
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-live-parity-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          DHI_PARITY_ID: ${{ steps.parity.outputs.dhi_parity_id }}
          EXPECTED_PREVIEW_IMAGE_NAME: ${{ steps.app.outputs.preview_image }}
          EXPECTED_PRODUCTION_IMAGE_NAME: ${{ steps.app.outputs.production_image }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          IMAGE_NAME: ${{ needs.publish.outputs.image-name }}
          RUNNABLE_DIGEST: ${{ needs.publish.outputs.runnable-digest }}
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
          LIVE_PRODUCTION_HEAD_SHA: ${{ steps.parity.outputs.live_production_head_sha }}
          LIVE_PRODUCTION_INDEX_IMAGE: ${{ steps.parity.outputs.live_production_index_image }}
          LIVE_PRODUCTION_RUNNABLE_IMAGE: ${{ steps.parity.outputs.live_production_runnable_image }}
          PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PREVIEW_INGRESS: ${{ steps.app.outputs.preview_ingress }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.runtime_service_account }}
          STABLE_PREVIEW_DOMAIN: ${{ steps.app.outputs.stable_preview_domain }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]] ||
             [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$LIVE_PRODUCTION_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$LIVE_PRODUCTION_INDEX_IMAGE" != "${EXPECTED_PRODUCTION_IMAGE_NAME}@${LIVE_PRODUCTION_INDEX_IMAGE##*@}" ] ||
             [[ ! "$LIVE_PRODUCTION_INDEX_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] ||
             [ "$LIVE_PRODUCTION_RUNNABLE_IMAGE" != "${EXPECTED_PRODUCTION_IMAGE_NAME}@${LIVE_PRODUCTION_RUNNABLE_IMAGE##*@}" ] ||
             [[ ! "$LIVE_PRODUCTION_RUNNABLE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] ||
             [[ ! "$DHI_PARITY_ID" =~ ^[a-z0-9]{50}$ ]] ||
             [[ ! "$PLATFORM_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [[ ! "$RUNNABLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [ "$IMAGE_DIGEST" = "$RUNNABLE_DIGEST" ] ||
             [[ ! "$PROJECT_NUMBER" =~ ^[0-9]+$ ]] ||
             [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request, commit, workflow-run, or image identity." >&2
            exit 1
          fi

          case "$REPOSITORY_ID" in
            280932482)
              if [ "$PREVIEW_INGRESS" != "internal-and-cloud-load-balancing" ] ||
                 [ "$STABLE_PREVIEW_DOMAIN" != "preview.ycriticalhistory.org" ]; then
                echo "Critical History preview exposure policy drifted." >&2
                exit 1
              fi
              ;;
            1255553151|711292980|1025243085)
              if [ "$PREVIEW_INGRESS" != "all" ] || [ -n "$STABLE_PREVIEW_DOMAIN" ]; then
                echo "Unexpected stable preview exposure for repository $REPOSITORY_ID." >&2
                exit 1
              fi
              ;;
            *)
              echo "Repository id $REPOSITORY_ID has no trusted preview exposure policy." >&2
              exit 1
              ;;
          esac

          run_tail="${GITHUB_RUN_ID: -6}"
          revision_suffix="p${PR_NUMBER}-${EXPECTED_HEAD_SHA:0:12}-r${run_tail}a${GITHUB_RUN_ATTEMPT}"
          expected_revision="${PREVIEW_SERVICE}-${revision_suffix}"
          if [[ ! "$expected_revision" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || [ "${#expected_revision}" -gt 63 ]; then
            echo "Derived Cloud Run revision identity is invalid: $expected_revision" >&2
            exit 1
          fi
          umask 077
          env_file="$RUNNER_TEMP/preview-env.json"
          baseline_env_file="$RUNNER_TEMP/preview-baseline-env.json"
          baseline_response="$RUNNER_TEMP/cloud-run-preview-baseline.json"
          baseline_revision_response="$RUNNER_TEMP/cloud-run-preview-baseline-revision.json"
          response="$RUNNER_TEMP/cloud-run-preview-deploy.json"
          revision_response="$RUNNER_TEMP/cloud-run-preview-revision.json"
          health_body="$RUNNER_TEMP/preview-health.json"
          rollback_response="$RUNNER_TEMP/cloud-run-preview-rollback.json"
          route_service="$RUNNER_TEMP/cloud-run-preview-routes.json"
          route_revisions="$RUNNER_TEMP/cloud-run-preview-route-revisions"
          route_v2_revisions="$RUNNER_TEMP/cloud-run-preview-route-v2-revisions"
          route_token="$RUNNER_TEMP/cloud-run-preview-route-token"
          rest_token="$RUNNER_TEMP/cloud-run-preview-rest-token"
          rest_header="$RUNNER_TEMP/cloud-run-preview-rest-header"
          preseal_service="$RUNNER_TEMP/cloud-run-preview-preseal.json"
          sealed_v2_service="$RUNNER_TEMP/cloud-run-preview-sealed-v2.json"
          graph_outputs=""
          image_set=""
          routes_after=""
          routes_before=""
          routes_public=""
          routes_sealed=""
          cleanup() {
            exit_status=$?
            set +e
            rm -f "$env_file" "${env_file}.next" "$baseline_env_file" "$baseline_response" "$baseline_revision_response" "$response" "$revision_response" "$health_body" "$rollback_response" "$route_service" "$route_token" "$rest_token" "$rest_header" "$preseal_service" "$sealed_v2_service"
            for artifact in "$graph_outputs" "$image_set" "$routes_after" "$routes_before" "$routes_public" "$routes_sealed"; do
              [ -z "$artifact" ] || rm -f -- "$artifact"
            done
            find "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type f -name 'preview-route-*-service.json' -delete
            if [ -d "$route_revisions" ] && [ ! -L "$route_revisions" ]; then
              find "$route_revisions" -depth -delete
            fi
            if [ -d "$route_v2_revisions" ] && [ ! -L "$route_v2_revisions" ]; then
              find "$route_v2_revisions" -depth -delete
            fi
            trap - EXIT
            exit "$exit_status"
          }
          trap cleanup EXIT
          gcloud auth print-access-token > "$rest_token"
          printf 'Authorization: Bearer %s\n' "$(<"$rest_token")" > "$rest_header"
          fetch_preview_v2_service() {
            local destination="$1"
            curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
              --header "@$rest_header" --output "$destination" \
              "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${PREVIEW_SERVICE}"
          }
          assert_preview_sealed() {
            local service_v2="$1"
            jq -e --arg name "projects/${PROJECT_ID}/locations/${REGION}/services/${PREVIEW_SERVICE}" '
              .name == $name and (.reconciling // false) == false and
              .ingress == "INGRESS_TRAFFIC_INTERNAL_ONLY" and (.invokerIamDisabled // false) == false and
              (.defaultUriDisabled // false) == false and
              .generation == .observedGeneration and
              .terminalCondition.type == "Ready" and .terminalCondition.state == "CONDITION_SUCCEEDED" and
              all(.template.containers[]?; ((.baseImageUri // "") == ""))
            ' "$service_v2" >/dev/null
          }
          assert_preview_open() {
            local service_v2="$1" expected_ingress
            case "$PREVIEW_INGRESS" in
              all) expected_ingress="INGRESS_TRAFFIC_ALL" ;;
              internal-and-cloud-load-balancing) expected_ingress="INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER" ;;
              *) return 1 ;;
            esac
            jq -e --arg name "projects/${PROJECT_ID}/locations/${REGION}/services/${PREVIEW_SERVICE}" --arg ingress "$expected_ingress" '
              .name == $name and (.reconciling // false) == false and
              .ingress == $ingress and .invokerIamDisabled == true and
              (.defaultUriDisabled // false) == false and
              .generation == .observedGeneration and
              .terminalCondition.type == "Ready" and .terminalCondition.state == "CONDITION_SUCCEEDED" and
              all(.template.containers[]?; ((.baseImageUri // "") == ""))
            ' "$service_v2" >/dev/null
          }
          jq -n \
            --arg index "${LIVE_PRODUCTION_INDEX_IMAGE##*@}" \
            --arg runnable "${LIVE_PRODUCTION_RUNNABLE_IMAGE##*@}" \
            '{
              PLATFORM_DEPLOY_ENVIRONMENT:"preview-baseline",
              PLATFORM_IMAGE_INDEX_DIGEST:$index,
              PLATFORM_IMAGE_RUNNABLE_DIGEST:$runnable
            }' > "$baseline_env_file"
          preview_nonce="$(openssl rand -hex 32)"
          if [[ ! "$preview_nonce" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to generate a valid preview deployment nonce." >&2
            exit 1
          fi
          jq -n \
            --arg deploy_nonce "$preview_nonce" \
            --arg index "$IMAGE_DIGEST" \
            --arg preview_number "$PR_NUMBER" \
            --arg runnable "$RUNNABLE_DIGEST" \
            '{
              PLATFORM_DEPLOY_ENVIRONMENT: "preview",
              PLATFORM_DEPLOY_NONCE: $deploy_nonce,
              PLATFORM_IMAGE_INDEX_DIGEST: $index,
              PLATFORM_IMAGE_RUNNABLE_DIGEST: $runnable,
              PLATFORM_PREVIEW_NUMBER: $preview_number
            }' > "$env_file"
          case "$REPOSITORY_ID" in
            1255553151)
              # cdbentley has no product-specific preview configuration.
              ;;
            711292980)
              # Runsetta is intentionally offline. Preview code must never gain
              # live OpenAI or Spotify configuration.
              jq '. + {
                RUNSETTA_OFFLINE: "1",
                RUNSETTA_TTS_MODEL: "gpt-4o-mini-tts",
                RUNSETTA_TTS_VOICE: "marin"
              }' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            1025243085)
              # Medlock previews use an in-memory waitlist and have no data-plane
              # identity or Firestore coordinates.
              waitlist_identity_keyset="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
              if [[ ! "$waitlist_identity_keyset" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
                echo "Failed to generate the Medlock preview waitlist signing key." >&2
                exit 1
              fi
              jq --arg waitlist_identity_keyset "$waitlist_identity_keyset" '. + {
                ALLOWED_HOSTS: "medlock.ai,www.medlock.ai,mcp.medlock.ai,healthmcp.ai,www.healthmcp.ai,healthmcp.app,www.healthmcp.app,*.run.app",
                ALLOWED_ORIGINS: "https://medlock.ai,https://www.medlock.ai,https://mcp.medlock.ai,https://chat.openai.com,https://claude.ai,https://*.run.app",
                CANONICAL_HOST: "medlock.ai",
                LEGACY_HOSTS: "healthmcp.ai,www.healthmcp.ai,healthmcp.app,www.healthmcp.app",
                MEDLOCK_VERSION: "0.2.0",
                WAITLIST_IDENTITY_KEYSET: $waitlist_identity_keyset,
                WAITLIST_BACKEND: "memory"
              }' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            280932482)
              if [[ ! "$MAPBOX_PUBLIC_TOKEN" =~ ^pk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
                echo "Critical History requires a protected MAPBOX_PUBLIC_TOKEN in public pk format." >&2
                exit 1
              fi
              jq --arg token "$MAPBOX_PUBLIC_TOKEN" \
                '. + {MAPBOX_PUBLIC_TOKEN: $token}' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            *)
              echo "Repository id $REPOSITORY_ID has no trusted preview runtime configuration." >&2
              exit 1
              ;;
          esac

          # Classify exposure before the first Cloud Run mutation. A local,
          # credential, configuration, or read failure before this point must
          # leave a previously admitted service byte-for-byte untouched.
          gcloud run services describe "$PREVIEW_SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$preseal_service"
          fetch_preview_v2_service "$sealed_v2_service"
          if assert_preview_open "$sealed_v2_service"; then
            initial_exposure=open
          elif assert_preview_sealed "$sealed_v2_service"; then
            initial_exposure=sealed
          else
            echo "Preview service has an unknown exposure state; refusing to stage a revision." >&2
            exit 1
          fi
          echo "initial-exposure=$initial_exposure" >> "$GITHUB_OUTPUT"

          # Both deploys are deliberately unrouted. Their failures must not
          # rewrite traffic or exposure; the etag-bound transaction below is
          # the only admission mutation and owns its own exact rollback trap.

          baseline_digest="${LIVE_PRODUCTION_INDEX_IMAGE##*@sha256:}"
          baseline_suffix="b${LIVE_PRODUCTION_HEAD_SHA:0:10}-${baseline_digest:0:10}-r${run_tail}a${GITHUB_RUN_ATTEMPT}"
          baseline_revision="${PREVIEW_SERVICE}-${baseline_suffix}"
          if [[ ! "$baseline_revision" =~ ^[a-z][a-z0-9-]{0,62}$ ]] || [ "${#baseline_revision}" -gt 63 ]; then
            echo "Derived preview baseline revision identity is invalid: $baseline_revision" >&2
            exit 1
          fi
          gcloud run deploy "$PREVIEW_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$LIVE_PRODUCTION_INDEX_IMAGE" \
            --clear-base-image \
            --revision-suffix="$baseline_suffix" \
            --no-traffic \
            --env-vars-file="$baseline_env_file" \
            --clear-secrets \
            --command=bun \
            '--args=^~^-e~Bun.serve({port:+process.env.PORT,fetch(){return new Response(null,{status:404})}})' \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=300s \
            --labels="managed-by=github-actions,environment=preview,preview-role=baseline,dhi-parity-id=${DHI_PARITY_ID},git-head-sha=${LIVE_PRODUCTION_HEAD_SHA},github-repository-id=${REPOSITORY_ID},github-run-id=${GITHUB_RUN_ID},github-run-attempt=${GITHUB_RUN_ATTEMPT},platform-workflow-sha=${PLATFORM_WORKFLOW_SHA}" \
            --quiet \
            --format=json > "$baseline_response"
          gcloud run revisions describe "$baseline_revision" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$baseline_revision_response"
          jq -e --arg image "$LIVE_PRODUCTION_RUNNABLE_IMAGE" --arg head "$LIVE_PRODUCTION_HEAD_SHA" \
            --arg index "${LIVE_PRODUCTION_INDEX_IMAGE##*@}" --arg runnable "${LIVE_PRODUCTION_RUNNABLE_IMAGE##*@}" \
            --arg name "$baseline_revision" --arg parity "$DHI_PARITY_ID" --arg repository_id "$REPOSITORY_ID" '
            def exact_value($name):
              [.spec.containers[0].env[]? | select(.name == $name and (keys | sort) == ["name","value"]) | .value]
              | if length == 1 then .[0] else error("missing or duplicate immutable image identity") end;
            .metadata.name == $name and
            .metadata.labels["preview-role"] == "baseline" and
            .metadata.labels.environment == "preview" and
            .metadata.labels["managed-by"] == "github-actions" and
            .metadata.labels["dhi-parity-id"] == $parity and
            .metadata.labels["git-head-sha"] == $head and
            .metadata.labels["github-repository-id"] == $repository_id and
            (.metadata.labels | has("github-pr") | not) and
            ([.metadata.annotations // {} | keys[] | select(test("(^|/)(base-images|build-base-image|build-enable-automatic-updates|enable-automatic-updates|base-image-update)$"))] | length) == 0 and
            ((.spec.runtimeClassName // "") == "") and
            .spec.containers[0].image == $image and .status.imageDigest == $image and
            exact_value("PLATFORM_IMAGE_INDEX_DIGEST") == $index and
            exact_value("PLATFORM_IMAGE_RUNNABLE_DIGEST") == $runnable and
            .spec.containers[0].command == ["bun"] and
            .spec.containers[0].args == ["-e","Bun.serve({port:+process.env.PORT,fetch(){return new Response(null,{status:404})}})"]
          ' "$baseline_revision_response" >/dev/null || {
            echo "Preview baseline did not retain its exact image, 404 command, or provenance." >&2
            exit 1
          }
          echo "baseline-revision=$baseline_revision" >> "$GITHUB_OUTPUT"

          gcloud run deploy "$PREVIEW_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --clear-base-image \
            --revision-suffix="$revision_suffix" \
            --no-traffic \
            --env-vars-file="$env_file" \
            --clear-secrets \
            --command="" \
            --args="" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=300s \
            --labels="managed-by=github-actions,environment=preview,preview-role=pr,dhi-parity-id=${DHI_PARITY_ID},git-head-sha=${EXPECTED_HEAD_SHA},github-repository-id=${REPOSITORY_ID},github-pr=${PR_NUMBER},github-run-id=${GITHUB_RUN_ID},github-run-attempt=${GITHUB_RUN_ATTEMPT},platform-workflow-sha=${PLATFORM_WORKFLOW_SHA}" \
            --quiet \
            --format=json > "$response"
          preview_revision="$expected_revision"
          deterministic_url="https://pr-${PR_NUMBER}---${PREVIEW_SERVICE}-${PROJECT_NUMBER}.${REGION}.run.app"
          preview_url="$deterministic_url"
          public_preview_url="$preview_url"
          if [ "$REPOSITORY_ID" = "280932482" ]; then
            public_preview_url="https://pr-${PR_NUMBER}.${STABLE_PREVIEW_DOMAIN}"
          fi
          # The candidate has no tag and no traffic until the later etag-bound
          # commit step. An older pr-N tag may exist, but it must never serve
          # this run's fresh nonce before the atomic traffic PATCH.
          sealed_candidate_body="$RUNNER_TEMP/preview-sealed-candidate-health.json"
          sealed_candidate_status="$(curl --silent --show-error --output "$sealed_candidate_body" --write-out '%{http_code}' \
            --max-filesize 1024 --max-time 10 --proto '=https' "${public_preview_url}/livez" 2>/dev/null || true)"
          if [ "$sealed_candidate_status" = 200 ] &&
             jq -e -s --arg nonce "$preview_nonce" 'length == 1 and .[0] == {deployment:$nonce,ok:true}' "$sealed_candidate_body" >/dev/null 2>&1; then
            echo "New preview candidate was externally invokable before OCI admission." >&2
            exit 1
          fi
          rm -f -- "$sealed_candidate_body"
          gcloud run revisions describe "$preview_revision" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json > "$revision_response"
          jq -e \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg dhi_parity_id "$DHI_PARITY_ID" \
            --arg head "$EXPECTED_HEAD_SHA" \
            --arg image "${IMAGE_NAME}@${RUNNABLE_DIGEST}" \
            --arg index "$IMAGE_DIGEST" --arg runnable "$RUNNABLE_DIGEST" \
            --arg name "$preview_revision" \
            --arg pr "$PR_NUMBER" \
            --arg repository_id "$REPOSITORY_ID" \
            --arg run "$GITHUB_RUN_ID" \
            --arg workflow_sha "$PLATFORM_WORKFLOW_SHA" '
            .metadata.name == $name and
            .metadata.labels["git-head-sha"] == $head and
            .metadata.labels["github-repository-id"] == $repository_id and
            .metadata.labels["github-pr"] == $pr and
            .metadata.labels["github-run-id"] == $run and
            .metadata.labels["github-run-attempt"] == $attempt and
            .metadata.labels["dhi-parity-id"] == $dhi_parity_id and
            .metadata.labels["managed-by"] == "github-actions" and
            .metadata.labels.environment == "preview" and
            .metadata.labels["preview-role"] == "pr" and
            .metadata.labels["platform-workflow-sha"] == $workflow_sha and
            ([.metadata.annotations // {} | keys[] | select(test("(^|/)(base-images|build-base-image|build-enable-automatic-updates|enable-automatic-updates|base-image-update)$"))] | length) == 0 and
            ((.spec.runtimeClassName // "") == "") and
            (.spec.containers | length) == 1 and
            .spec.containers[0].image == $image and
            .status.imageDigest == $image and
            ([.spec.containers[0].env[]? | select(.name == "PLATFORM_IMAGE_INDEX_DIGEST" and .value == $index)] | length) == 1 and
            ([.spec.containers[0].env[]? | select(.name == "PLATFORM_IMAGE_RUNNABLE_DIGEST" and .value == $runnable)] | length) == 1 and
            ((.spec.containers[0].command // []) | length) == 0 and
            ((.spec.containers[0].args // []) | length) == 0
          ' "$revision_response" >/dev/null || {
            echo "Cloud Run revision provenance labels do not match this exact source and run." >&2
            exit 1
          }
          echo "revision=$preview_revision" >> "$GITHUB_OUTPUT"
          echo "url=$public_preview_url" >> "$GITHUB_OUTPUT"
          # The two newly created revisions are deliberately unrouted. Traffic
          # is committed only after a second production proof and a fresh
          # lifecycle/OCI proof in the etag-bound transaction below.

      - name: Retire preview deploy credentials before production reproof
        if: steps.deploy.outcome == 'success'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CREDENTIAL_FILE: ${{ steps.deploy-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          [[ "$CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
          test -f "$CREDENTIAL_FILE" && test ! -L "$CREDENTIAL_FILE"
          rm -f -- "$CREDENTIAL_FILE"
          test ! -e "$CREDENTIAL_FILE" && test ! -L "$CREDENTIAL_FILE"
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Re-authenticate the read-only parity identity before traffic commit
        if: steps.deploy.outcome == 'success'
        id: post-parity-auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.parity_service_account }}
          create_credentials_file: true
          export_environment_variables: false
          access_token_lifetime: 300s

      - name: Re-prove unchanged production and its OCI graph before traffic commit
        if: steps.deploy.outcome == 'success' && steps.post-parity-auth.outcome == 'success'
        id: post-parity
        continue-on-error: true
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-live-parity-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          EXPECTED_LIVE_PRODUCTION_HEAD_SHA: ${{ steps.parity.outputs.live_production_head_sha }}
          EXPECTED_LIVE_PRODUCTION_INDEX_IMAGE: ${{ steps.parity.outputs.live_production_index_image }}
          EXPECTED_LIVE_PRODUCTION_RUNNABLE_IMAGE: ${{ steps.parity.outputs.live_production_runnable_image }}
          EXPECTED_PRODUCTION_IMAGE_NAME: ${{ steps.app.outputs.production_image }}
          EXPECTED_PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REVISION_PROJECTION_SHA256: ${{ steps.parity.outputs.revision_projection_sha256 }}
          EXPECTED_SERVICE_NAME: ${{ steps.app.outputs.service_name }}
          EXPECTED_SERVICE_PROJECTION_SHA256: ${{ steps.parity.outputs.service_projection_sha256 }}
          EXPECTED_V2_REVISION_PROJECTION_SHA256: ${{ steps.parity.outputs.v2_revision_projection_sha256 }}
          EXPECTED_V2_SERVICE_PROJECTION_SHA256: ${{ steps.parity.outputs.v2_service_projection_sha256 }}
          PARITY_CREDENTIAL_FILE: ${{ steps.post-parity-auth.outputs.credentials_file_path }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          token_file="$RUNNER_TEMP/post-preview-parity-access-token"
          header_file="$RUNNER_TEMP/post-preview-parity-rest-header"
          cleanup_parity_credentials() {
            rm -f -- "$token_file" "$header_file"
            if [[ "${PARITY_CREDENTIAL_FILE:-}" == "$GITHUB_WORKSPACE"/* ]] &&
               { [ -f "$PARITY_CREDENTIAL_FILE" ] || [ -L "$PARITY_CREDENTIAL_FILE" ]; }; then
              rm -f -- "$PARITY_CREDENTIAL_FILE"
            fi
          }
          trap cleanup_parity_credentials EXIT
          [[ "$PARITY_CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
          test -f "$PARITY_CREDENTIAL_FILE" && test ! -L "$PARITY_CREDENTIAL_FILE"
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$PARITY_CREDENTIAL_FILE" gcloud auth print-access-token > "$token_file"
          printf 'Authorization: Bearer %s\n' "$(<"$token_file")" > "$header_file"
          service_json="$RUNNER_TEMP/post-preview-production-service.json"
          revision_json="$RUNNER_TEMP/post-preview-production-revision.json"
          outputs="$RUNNER_TEMP/post-preview-production.outputs"
          gcloud --access-token-file="$token_file" run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$service_json"
          revision="$(jq -er '.status.latestReadyRevisionName | select(test("^[a-z][a-z0-9-]{0,62}$"))' "$service_json")"
          gcloud --access-token-file="$token_file" run revisions describe "$revision" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$revision_json"
          GITHUB_OUTPUT="$outputs" PARITY_SERVICE_JSON="$service_json" PARITY_REVISION_JSON="$revision_json" \
            /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/cloud-run-dhi-parity.sh" prove-production
          actual_service="$(sed -n 's/^service_projection_sha256=//p' "$outputs" | tail -n 1)"
          actual_revision="$(sed -n 's/^revision_projection_sha256=//p' "$outputs" | tail -n 1)"
          if [ "$actual_service" != "$EXPECTED_SERVICE_PROJECTION_SHA256" ] ||
             [ "$actual_revision" != "$EXPECTED_REVISION_PROJECTION_SHA256" ]; then
            echo "Production changed before the admitted preview completed health validation." >&2
            exit 1
          fi
          production_v2="$RUNNER_TEMP/post-preview-production-v2-service.json"
          revision_v2="$RUNNER_TEMP/post-preview-production-v2-revision.json"
          curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            --header "@$header_file" --output "$production_v2" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}"
          curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            --header "@$header_file" --output "$revision_v2" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}/revisions/${revision}"
          actual_v2_service="$(jq -cS '{name,generation,observedGeneration,ingress,invokerIamDisabled,defaultUriDisabled,traffic,trafficStatuses,latestReadyRevision,reconciling,terminalCondition,urls,uri,etag,template}' "$production_v2" | sha256sum | cut -d ' ' -f 1)"
          actual_v2_revision="$(jq -cS '{name,generation,labels,serviceAccount,containers,reconciling,conditions,etag}' "$revision_v2" | sha256sum | cut -d ' ' -f 1)"
          if [ "$actual_v2_service" != "$EXPECTED_V2_SERVICE_PROJECTION_SHA256" ] ||
             [ "$actual_v2_revision" != "$EXPECTED_V2_REVISION_PROJECTION_SHA256" ]; then
            echo "Production v2 service or revision changed before final preview admission." >&2
            exit 1
          fi
          actual_head="$(jq -er '.metadata.labels["git-head-sha"]' "$revision_json")"
          actual_index="$(sed -n 's/^live_production_index_image=//p' "$outputs" | tail -n 1)"
          actual_runnable="$(sed -n 's/^live_production_runnable_image=//p' "$outputs" | tail -n 1)"
          if [ "$actual_head" != "$EXPECTED_LIVE_PRODUCTION_HEAD_SHA" ] ||
             [ "$actual_index" != "$EXPECTED_LIVE_PRODUCTION_INDEX_IMAGE" ] ||
             [ "$actual_runnable" != "$EXPECTED_LIVE_PRODUCTION_RUNNABLE_IMAGE" ]; then
            echo "Production immutable image identity changed before preview traffic commit." >&2
            exit 1
          fi
          AR_ACCESS_TOKEN="$(<"$token_file")" LIVE_PRODUCTION_HEAD_SHA="$actual_head" \
            LIVE_PRODUCTION_INDEX_IMAGE="$actual_index" LIVE_PRODUCTION_RUNNABLE_IMAGE="$actual_runnable" \
            /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/container-artifact-contract.sh" verify-live-production
          cleanup_parity_credentials
          trap - EXIT

      - name: Retire post-health parity credentials before any rollback identity
        if: steps.deploy.outcome == 'success'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CREDENTIAL_FILE: ${{ steps.post-parity-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [ -n "$CREDENTIAL_FILE" ]; then
            [[ "$CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
            test ! -L "$CREDENTIAL_FILE"
            rm -f -- "$CREDENTIAL_FILE"
            test ! -e "$CREDENTIAL_FILE" && test ! -L "$CREDENTIAL_FILE"
          fi
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Prove the read-only identity is absent before traffic mutation
        if: >-
          steps.deploy.outcome == 'success' &&
          steps.post-parity-auth.outcome == 'success' &&
          steps.post-parity.outcome == 'success'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          READ_CREDENTIAL_FILE: ${{ steps.post-parity-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          [[ "$READ_CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
          test ! -e "$READ_CREDENTIAL_FILE" && test ! -L "$READ_CREDENTIAL_FILE"
          test -z "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          test -z "${GOOGLE_GHA_CREDS_PATH:-}"

      - name: Authenticate the dedicated preview runtime IAM auditor
        if: >-
          steps.deploy.outcome == 'success' &&
          steps.post-parity-auth.outcome == 'success' &&
          steps.post-parity.outcome == 'success'
        id: iam-audit-auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.iam_audit_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
          access_token_lifetime: 300s

      - name: Prove every preview runtime remains access-free before traffic mutation
        id: iam-audit
        if: steps.iam-audit-auth.outcome == 'success'
        continue-on-error: true
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ACCESS_TOKEN: ${{ steps.iam-audit-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/preview-runtime-iam-contract.sh" verify
          echo "admitted=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate the dedicated preview transaction committer
        if: steps.deploy.outcome == 'success'
        id: commit-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.commit_service_account }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Prove current routes and atomically commit candidate traffic
        if: >-
          steps.commit-auth.outcome == 'success' &&
          steps.post-parity-auth.outcome == 'success' &&
          steps.post-parity.outcome == 'success' &&
          steps.iam-audit.outputs.admitted == 'true'
        id: traffic-commit
        continue-on-error: true
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-live-parity-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          BASELINE_REVISION: ${{ steps.deploy.outputs.baseline-revision }}
          DHI_PARITY_ID: ${{ steps.parity.outputs.dhi_parity_id }}
          EXPECTED_BASELINE_PRODUCTION_HEAD_SHA: ${{ steps.parity.outputs.live_production_head_sha }}
          EXPECTED_BASELINE_PRODUCTION_INDEX_IMAGE: ${{ steps.parity.outputs.live_production_index_image }}
          EXPECTED_BASELINE_PRODUCTION_RUNNABLE_IMAGE: ${{ steps.parity.outputs.live_production_runnable_image }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_PREVIEW_IMAGE_NAME: ${{ steps.app.outputs.preview_image }}
          EXPECTED_PREVIEW_RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.runtime_service_account }}
          EXPECTED_PRODUCTION_IMAGE_NAME: ${{ steps.app.outputs.production_image }}
          EXPECTED_PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REVISION: ${{ steps.deploy.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
          INITIAL_EXPOSURE: ${{ steps.deploy.outputs.initial-exposure }}
          PARITY_POLICY_ROOT: ${{ steps.parity-policy.outputs.root }}
          PREVIEW_INGRESS: ${{ steps.app.outputs.preview_ingress }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
          STABLE_PREVIEW_DOMAIN: ${{ steps.app.outputs.stable_preview_domain }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "${PARITY_POLICY_ROOT}/tools/ci/cloud-run-preview-traffic.sh" commit

      - name: Seal preview exposure when admission evidence is unavailable
        id: fail-closed-seal
        if: >-
          steps.commit-auth.outcome == 'success' &&
          (steps.post-parity-auth.outcome != 'success' ||
           steps.post-parity.outcome != 'success' ||
           steps.iam-audit.outputs.admitted != 'true' ||
           steps.traffic-commit.outcome == 'failure')
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ACCESS_TOKEN: ${{ steps.commit-auth.outputs.access_token }}
          DHI_PARITY_ID: ${{ steps.parity-policy.outputs.dhi-parity-id }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PARITY_POLICY_ROOT: ${{ steps.parity-policy.outputs.root }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "$PARITY_POLICY_ROOT/tools/ci/cloud-run-preview-controller.sh" seal

      - name: Retire traffic-commit credentials
        if: always() && github.run_attempt == '1'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CREDENTIAL_FILE: ${{ steps.commit-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [ -n "$CREDENTIAL_FILE" ]; then
            [[ "$CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
            test ! -L "$CREDENTIAL_FILE"
            rm -f -- "$CREDENTIAL_FILE"
            test ! -e "$CREDENTIAL_FILE" && test ! -L "$CREDENTIAL_FILE"
          fi
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Report fail-closed preview admission failure
        if: steps.fail-closed-seal.outputs.admitted == 'true'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          echo "Preview exposure was sealed because production, runtime IAM, or transaction evidence was unavailable." >&2
          exit 1
      - name: Comment preview URL only after final admission
        if: steps.traffic-commit.outputs.admitted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_REVISION: ${{ steps.deploy.outputs.revision }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Preview for commit ${EXPECTED_HEAD_SHA} deployed at ${PREVIEW_URL} (revision ${PREVIEW_REVISION})."

  invalidate:
    name: Invalidate stale preview
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - deploy
      - prefetch-bases
    if: >-
      always() &&
      needs.deploy.outputs.deployed-revision != '' &&
      (needs.deploy.outputs.lifecycle-keep != 'true' || needs.deploy.outputs.admission-open != 'success')
    environment: preview-operations
    permissions:
      actions: read # Download only this run's exact DHI base closure.
      id-token: write # Exchange only for exact-SHA read and transaction identities.
      pull-requests: read # Re-prove every surviving tag before mutation.
    concurrency:
      group: deployment-parity-${{ github.event.repository.id }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted application configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648"; service_name="cdbentley"; repository="site"; preview_ingress="all"; stable_preview_domain="" ;;
            711292980) project_id="runsetta"; project_number="601124730704"; service_name="runsetta"; repository="api"; preview_ingress="all"; stable_preview_domain="" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510"; service_name="medlock"; repository="site"; preview_ingress="all"; stable_preview_domain="" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513"; service_name="critical-history"; repository="site"; preview_ingress="internal-and-cloud-load-balancing"; stable_preview_domain="preview.ycriticalhistory.org" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for preview invalidation." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "project_number=$project_number"
            echo "region=us-east4"
            echo "service_name=$service_name"
            echo "preview_service=${service_name}-preview"
            echo "preview_ingress=$preview_ingress"
            echo "stable_preview_domain=$stable_preview_domain"
            echo "production_image=us-east4-docker.pkg.dev/${project_id}/${repository}/${service_name}"
            echo "preview_image=us-east4-docker.pkg.dev/${project_id}/${repository}-preview/${service_name}"
            echo "runtime_service_account=cloud-run-preview@${project_id}.iam.gserviceaccount.com"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "commit_service_account=gha-preview-commit@${project_id}.iam.gserviceaccount.com"
            echo "iam_audit_service_account=gha-preview-operator@${project_id}.iam.gserviceaccount.com"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch exact preview controller policy before OIDC
        id: parity-policy
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-invalidate-parity-policy"
          repository="$RUNNER_TEMP/platform-invalidate-parity-repository"
          git_home="$RUNNER_TEMP/platform-invalidate-parity-git-home"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse 'FETCH_HEAD^{commit}')" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" \
            tools/ci/cloud-run-dhi-parity.sh \
            tools/ci/cloud-run-preview-controller.sh \
            tools/ci/container-artifact-contract.sh \
            tools/ci/deployment-parity-transition.sh \
            tools/ci/preview-runtime-iam-contract.sh | tar -x -C "$destination"
          for helper in cloud-run-dhi-parity.sh cloud-run-preview-controller.sh container-artifact-contract.sh deployment-parity-transition.sh preview-runtime-iam-contract.sh; do
            test -f "$destination/tools/ci/$helper" && test ! -L "$destination/tools/ci/$helper"
          done
          test -x "$destination/tools/ci/deployment-parity-transition.sh"
          dhi_parity_id="$(/bin/bash "$destination/tools/ci/container-artifact-contract.sh" print-dhi-parity-id)"
          [[ "$dhi_parity_id" =~ ^[a-z0-9]{50}$ ]]
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"
          echo "dhi-parity-id=$dhi_parity_id" >> "$GITHUB_OUTPUT"

      - name: Bind the exact DHI base artifact before OIDC
        id: artifact-bind
        if: needs.prefetch-bases.result == 'success'
        continue-on-error: true
        env:
          ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          response="$RUNNER_TEMP/invalidate-base-artifact.json"
          gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "$response"
          jq -e --arg digest "sha256:${ARTIFACT_DIGEST}" --arg id "$ARTIFACT_ID" \
            --arg name "platform-preview-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" \
            --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson repo "${{ github.event.repository.id }}" '
            (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
            (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
            .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
            (.size_in_bytes > 0 and .size_in_bytes <= 1611661312)
          ' "$response" >/dev/null

      - name: Download only the exact DHI base artifact id
        id: artifact-download
        if: needs.prefetch-bases.result == 'success' && steps.artifact-bind.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/platform-invalidate-bases
          skip-decompress: true

      - name: Install checksum-pinned Google Cloud CLI
        id: gcloud
        continue-on-error: true
        env:
          GCLOUD_SHA256: deffdbe82ca6e3d19ffb291d063a651488e04e1b33799b5a238e4b5c6784e3c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/google-cloud-cli-581.0.0-linux-x86_64.tar.gz"
          sdk_root="$RUNNER_TEMP/google-cloud-cli"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            'https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-581.0.0-linux-x86_64.tar.gz?generation=1787059661116797'
          echo "${GCLOUD_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$sdk_root"
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          export CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          export CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
          "$sdk_root/bin/gcloud" version --format=json | jq -e '.["Google Cloud SDK"] == "581.0.0"' >/dev/null
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true"
            echo "CLOUDSDK_CORE_DISABLE_PROMPTS=1"
            echo "CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true"
          } >> "$GITHUB_ENV"

      - name: Prove exact preview operator workflow-SHA WIF trust
        id: wif-canary
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
          access_token_lifetime: 300s

      - name: Authenticate the dedicated preview runtime IAM auditor for invalidation
        id: iam-audit-auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.iam_audit_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
          access_token_lifetime: 300s

      - name: Prove every preview runtime remains access-free before invalidation
        id: iam-audit
        if: steps.iam-audit-auth.outcome == 'success'
        continue-on-error: true
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ACCESS_TOKEN: ${{ steps.iam-audit-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/preview-runtime-iam-contract.sh" verify
          echo "admitted=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate the dedicated preview transaction committer for invalidation
        id: commit-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.commit_service_account }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Remove only the failed run's exact tag with one proven etag transaction
        id: maintenance
        continue-on-error: true
        if: >-
          needs.prefetch-bases.result == 'success' &&
          steps.artifact-bind.outcome == 'success' &&
          steps.artifact-download.outcome == 'success' &&
          steps.gcloud.outcome == 'success' &&
          steps.wif-canary.outcome == 'success' &&
          steps.iam-audit.outputs.admitted == 'true' &&
          steps.commit-auth.outcome == 'success'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-invalidate-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          DHI_PARITY_ID: ${{ steps.parity-policy.outputs.dhi-parity-id }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_PREVIEW_IMAGE_NAME: ${{ steps.app.outputs.preview_image }}
          EXPECTED_PREVIEW_RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.runtime_service_account }}
          EXPECTED_PRODUCTION_IMAGE_NAME: ${{ steps.app.outputs.production_image }}
          EXPECTED_PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_TARGET_REVISION: ${{ needs.deploy.outputs.deployed-revision }}
          GH_TOKEN: ${{ github.token }}
          PARITY_POLICY_ROOT: ${{ steps.parity-policy.outputs.root }}
          PREVIEW_INGRESS: ${{ steps.app.outputs.preview_ingress }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
          STABLE_PREVIEW_DOMAIN: ${{ steps.app.outputs.stable_preview_domain }}
          TARGET_TAG: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "$PARITY_POLICY_ROOT/tools/ci/cloud-run-preview-controller.sh" remove

      - name: Seal preview exposure when invalidation evidence is unavailable
        id: fail-closed-seal
        if: >-
          steps.commit-auth.outcome == 'success' &&
          (needs.prefetch-bases.result != 'success' ||
           steps.artifact-bind.outcome != 'success' ||
           steps.artifact-download.outcome != 'success' ||
           steps.gcloud.outcome != 'success' ||
           steps.wif-canary.outcome != 'success' ||
           steps.iam-audit.outputs.admitted != 'true' ||
           steps.maintenance.outcome == 'failure')
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ACCESS_TOKEN: ${{ steps.commit-auth.outputs.access_token }}
          DHI_PARITY_ID: ${{ steps.parity-policy.outputs.dhi-parity-id }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PARITY_POLICY_ROOT: ${{ steps.parity-policy.outputs.root }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "$PARITY_POLICY_ROOT/tools/ci/cloud-run-preview-controller.sh" seal

      - name: Retire invalidation transaction credentials
        if: always() && github.run_attempt == '1'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CREDENTIAL_FILE: ${{ steps.commit-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [ -n "$CREDENTIAL_FILE" ]; then
            [[ "$CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
            test ! -L "$CREDENTIAL_FILE"
            rm -f -- "$CREDENTIAL_FILE"
            test ! -e "$CREDENTIAL_FILE" && test ! -L "$CREDENTIAL_FILE"
          fi
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Report fail-closed invalidation evidence failure
        if: steps.fail-closed-seal.outputs.admitted == 'true'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          echo "Preview exposure was sealed because invalidation evidence was unavailable." >&2
          exit 1
