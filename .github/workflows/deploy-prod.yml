name: Deploy production

on:
  workflow_call:

permissions: {}

jobs:
  rerun-guard:
    name: Reject privileged workflow reruns
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

  prefetch-bases:
    name: Prefetch exact public DHI bases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # This fresh environment must allow only the selected protected main branch. It
    # contains one read-public-only DHI token and is never entered by PR code.
    environment: dhi-base-prefetch-20260822-098dca9280b3
    permissions: {}
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.bundle.outputs.content_sha256 }}
      manifest-sha256: ${{ steps.bundle.outputs.manifest_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source before secret use
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-prefetch-policy"
          git_home="$RUNNER_TEMP/platform-prefetch-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          test ! -e "$git_home" && test ! -L "$git_home"
          install -d -m 0700 "$destination" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          unset GIT_CONFIG_SYSTEM GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          git_safe() {
            /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= \
              -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false \
              -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"
          }
          git_safe -C "$destination" init --quiet
          git_safe -C "$destination" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$destination" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          git_safe -C "$destination" checkout --quiet --detach FETCH_HEAD
          test "$(git_safe -C "$destination" rev-parse --verify HEAD^{commit})" = "$WORKFLOW_SHA"
          test "$(git_safe -C "$destination" status --porcelain=v1 --untracked-files=all)" = ""
          helper="$destination/tools/ci/container-artifact-contract.sh"
          test -f "$helper" && test ! -L "$helper"
          expected="$(git_safe -C "$destination" rev-parse "$WORKFLOW_SHA:tools/ci/container-artifact-contract.sh")"
          test "$(git_safe -C "$destination" hash-object --no-filters "$helper")" = "$expected"
          rm -rf -- "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Fetch, verify, and close the exact public base graph
        id: bundle
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_KIND: production
          DHI_PUBLIC_READ_TOKEN: ${{ secrets.DHI_PUBLIC_READ_TOKEN_20260822_098DCA9280B3 }}
          DHI_USERNAME: ${{ vars.DHI_USERNAME }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" prefetch

      - name: Verify DHI credentials were retired before artifact publication
        if: always() && github.run_attempt == '1'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          auth_root="$RUNNER_TEMP/platform-regctl-auth"
          artifact="${{ steps.bundle.outputs.artifact }}"
          if [ -e "$auth_root" ] || [ -L "$auth_root" ]; then
            echo "DHI registry credentials survived prefetch." >&2
            rm -rf -- "$auth_root" "$RUNNER_TEMP/platform-base-bundle" "$artifact"
            exit 1
          fi
          if [ ! -f "$artifact" ] || [ -L "$artifact" ]; then
            echo "Base-image artifact was not produced safely." >&2
            exit 1
          fi

      - name: Upload the one-day public base closure as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Pinned v7 raw mode derives the artifact name from this file's basename.
          path: ${{ steps.bundle.outputs.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build production image without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prefetch-bases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prefetch-bases.result == 'success'
    permissions:
      actions: read
      contents: read
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.oci.outputs.content_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-build-policy"
          repository="$RUNNER_TEMP/platform-build-repository"
          git_home="$RUNNER_TEMP/platform-build-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools templates | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Download only the exact base artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-base-download
          digest-mismatch: error
          skip-decompress: true

      - name: Validate and extract the closed base artifact
        id: base_images
        env:
          ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-base-download
          EXPECTED_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" verify-base

      - name: Resolve fixed build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha='${{ github.sha }}'
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          main="$RUNNER_TEMP/current-main.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$main"
          test "$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$main")" = "$head_sha"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify the exact checked-out main commit
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(/usr/bin/git rev-parse --verify 'HEAD^{commit}')" = "$EXPECTED_HEAD_SHA"
          test "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)" = ""

      - name: Install checksum-pinned Bun 1.4.0 for structural policy checks
        env:
          BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          echo "${BUN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          echo "$destination/bun-linux-x64" >> "$GITHUB_PATH"
          (
            cd "${{ steps.policy.outputs.root }}/tools/ci"
            "$destination/bun-linux-x64/bun" --no-env-file --no-orphans \
              -e 'if (Bun.version !== "1.4.0") process.exit(1)'
          )

      - name: Enforce the trusted application and container contract
        run: |
          set -euo pipefail
          (
            cd "${{ steps.policy.outputs.root }}/tools/ci"
            bun --no-env-file --no-orphans ./enforce-app-contract.ts \
              "$GITHUB_WORKSPACE" \
              "${{ steps.policy.outputs.root }}/templates/app" \
              "${{ github.event.repository.id }}" \
              "${{ job.workflow_sha }}"
          )

      - name: Scan the production lock with the public Socket policy
        run: |
          set -euo pipefail
          print_untrusted_output() {
            local stop_marker
            stop_marker="$(cat /proc/sys/kernel/random/uuid)"
            printf '::stop-commands::%s\n' "$stop_marker"
            printf '%s\n' "$1"
            printf '::%s::\n' "$stop_marker"
          }
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "Committed node_modules content is forbidden before the public Socket scan." >&2
            exit 1
          fi
          before="$(sha256sum package.json bun.lock)"
          unset SOCKET_API_TOKEN SOCKET_API_KEY
          unset BUN_CONFIG_SKIP_LOAD_LOCKFILE BUN_FEATURE_FLAG_DISABLE_IGNORE_SCRIPTS BUN_CONFIG_REGISTRY NPM_CONFIG_REGISTRY
          if ! scan_output="$(bun --no-env-file --config="${{ steps.policy.outputs.root }}/tools/ci/bunfig.toml" pm scan 2>&1)"; then
            print_untrusted_output "$scan_output"
            exit 1
          fi
          print_untrusted_output "$scan_output"
          if ! grep -Fq 'Socket Security Scanner free mode' <<< "$scan_output"; then
            echo "The production lock scan must remain credential-free." >&2
            exit 1
          fi
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "bun pm scan must not create node_modules." >&2
            exit 1
          fi
          if [[ "$(sha256sum package.json bun.lock)" != "$before" ]]; then
            echo "bun pm scan must not mutate package.json or bun.lock." >&2
            exit 1
          fi

      - name: Install checksum-pinned Docker Buildx and create pinned BuildKit
        id: buildx
        env:
          BUILDX_SHA256: 48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/platform-docker"
          plugin="$docker_config/cli-plugins/docker-buildx"
          builder="platform-builder"
          mkdir -p "$(dirname "$plugin")"
          curl --fail --show-error --silent --location \
            --output "$plugin" \
            https://github.com/docker/buildx/releases/download/v0.36.1/buildx-v0.36.1.linux-amd64
          echo "${BUILDX_SHA256}  ${plugin}" | sha256sum --check --strict
          chmod 0755 "$plugin"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          DOCKER_CONFIG="$docker_config" docker buildx version | grep -F 'v0.36.1'
          DOCKER_CONFIG="$docker_config" docker buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8 \
            --use
          DOCKER_CONFIG="$docker_config" docker buildx inspect "$builder" --bootstrap
          echo "name=$builder" >> "$GITHUB_OUTPUT"

      - name: Disable workflow commands for untrusted build output
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/platform-build-command-token"
          if [ -e "$token_file" ] || [ -L "$token_file" ]; then
            echo "The workflow-command token file already exists." >&2
            exit 1
          fi
          token="$(cat /proc/sys/kernel/random/uuid)"
          [[ "$token" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          (umask 077; printf '%s\n' "$token" > "$token_file")
          printf '::stop-commands::%s\n' "$token"

      - name: Build production image into a local OCI archive
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_CHECKS_ANNOTATIONS: "false"
        with:
          builder: ${{ steps.buildx.outputs.name }}
          github-token: ""
          build-contexts: |
            platform.invalid/bun-release=oci-layout://${{ steps.base_images.outputs.oven_layout }}@${{ steps.base_images.outputs.oven_child_digest }}
            platform.invalid/dhi-bun-dev=oci-layout://${{ steps.base_images.outputs.dhi_dev_layout }}@${{ steps.base_images.outputs.dhi_dev_child_digest }}
            platform.invalid/dhi-bun-runtime=oci-layout://${{ steps.base_images.outputs.dhi_runtime_layout }}@${{ steps.base_images.outputs.dhi_runtime_child_digest }}
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: false
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/platform-image.oci.tar,oci-mediatypes=true,oci-artifact=true
          provenance: mode=max,version=v1
          tags: platform-production:${{ steps.metadata.outputs.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Restore workflow commands after untrusted build output
        if: always() && github.run_attempt == '1'
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/platform-build-command-token"
          if [ ! -f "$token_file" ] || [ -L "$token_file" ]; then
            echo "The workflow-command token file is missing or invalid." >&2
            exit 1
          fi
          token="$(cat "$token_file")"
          [[ "$token" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          unlink "$token_file"
          printf '::%s::\n' "$token"

      - name: Destroy BuildKit and runner-local bases
        if: always() && github.run_attempt == '1'
        env:
          BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          if [ -n "$BUILDER_NAME" ] && docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            docker buildx rm "$BUILDER_NAME"
          fi
          if [ -n "$BUILDER_NAME" ] && docker buildx inspect "$BUILDER_NAME" >/dev/null 2>&1; then
            echo "BuildKit builder still exists after removal." >&2
            exit 1
          fi
          rm -rf -- "${{ steps.base_images.outputs.base_root }}"
          if [ -e "${{ steps.base_images.outputs.base_root }}" ] ||
             [ -L "${{ steps.base_images.outputs.base_root }}" ]; then
            echo "Runner-local base-image layouts survived the build." >&2
            exit 1
          fi

      - name: Hash the opaque untrusted OCI output
        id: oci
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/platform-image.oci.tar"
          test -f "$image" && test ! -L "$image"
          test "$(stat -c %s "$image")" -le 1073741824
          content_sha256="$(sha256sum "$image" | cut -d ' ' -f 1)"
          echo "content_sha256=$content_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the opaque OCI output as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Pinned v7 raw mode derives the artifact name from this file's basename.
          path: ${{ runner.temp }}/platform-image.oci.tar
          archive: false
          if-no-files-found: error
          retention-days: 1

  verify-image:
    name: Verify and promote production OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - build
      - prefetch-bases
    if: needs.build.result == 'success' && needs.prefetch-bases.result == 'success'
    permissions:
      actions: read
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      content-sha256: ${{ steps.promote.outputs.content_sha256 }}
      image-digest: ${{ steps.promote.outputs.published_index_digest }}
      runnable-digest: ${{ steps.promote.outputs.runnable_manifest_digest }}
      sbom-content-digest: ${{ steps.promote.outputs.sbom_sha256 }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Fetch the exact reusable-workflow policy source
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-promoter-policy"
          repository="$RUNNER_TEMP/platform-promoter-repository"
          git_home="$RUNNER_TEMP/platform-promoter-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools/ci | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Bind both exact source artifacts to this run
        env:
          BASE_ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          BASE_ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          BUILT_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          BUILT_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for value in "$BASE_ARTIFACT_DIGEST" "$BUILT_ARTIFACT_DIGEST"; do [[ "$value" =~ ^[0-9a-f]{64}$ ]]; done
          for value in "$BASE_ARTIFACT_ID" "$BUILT_ARTIFACT_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]]; done
          verify_artifact() {
            local id="$1" digest="$2" name="$3" max="$4"
            local response="$RUNNER_TEMP/artifact-${id}.json"
            gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$response"
            jq -e --arg id "$id" --arg digest "sha256:${digest}" --arg name "$name" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson max "$max" --argjson repo "$EXPECTED_REPOSITORY_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
              (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
              .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
              (.size_in_bytes > 0 and .size_in_bytes <= $max)
            ' "$response" >/dev/null
          }
          verify_artifact "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_DIGEST" "platform-production-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1611661312
          verify_artifact "$BUILT_ARTIFACT_ID" "$BUILT_ARTIFACT_DIGEST" platform-image.oci.tar 1073741824

      - name: Download only the exact opaque image artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-image-download
          digest-mismatch: error
          skip-decompress: true

      - name: Download only the exact reviewed base artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-promoter-bases
          digest-mismatch: error
          skip-decompress: true

      - name: Validate, scan, and promote in a fresh credentialless job
        id: promote
        env:
          ARTIFACT_KIND: production
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-promoter-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          BUILT_CONTENT_SHA256: ${{ needs.build.outputs.content-sha256 }}
          BUILT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-image-download
          EXPECTED_EVENT_NAME: push
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" promote

      - name: Upload the promoted image as one raw artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Pinned v7 raw mode derives the artifact name from this file's basename.
          path: ${{ steps.promote.outputs.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  canary:
    name: Prove exact production WIF trust
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    environment: production
    permissions:
      id-token: write # Exchange only for the no-role exact-WIF canary identity.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted canary configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648" ;;
            711292980) project_id="runsetta"; project_number="601124730704" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for production deployment." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Exchange a token through the no-role canary
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

  publish:
    name: Publish verified production OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - canary
      - prefetch-bases
      - verify-image
    if: >-
      always() &&
      needs.canary.result == 'success' &&
      needs.prefetch-bases.result == 'success' &&
      needs.verify-image.result == 'success'
    environment: production-publish
    permissions:
      actions: read # Read only the exact promoted artifact id from this run.
      contents: read # Confirm the run still targets current main.
      id-token: write # Exchange only for the exact-SHA publisher identity.
    outputs:
      image-digest: ${{ steps.copy.outputs.digest }}
      image-name: ${{ steps.app.outputs.image_name }}
      runnable-digest: ${{ needs.verify-image.outputs.runnable-digest }}

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Reject a stale main-branch run before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/main-ref.json"
          gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$response"
          test "$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$response")" = "$GITHUB_SHA"

      - name: Fetch the exact reusable-workflow policy source before OIDC
        id: policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-publisher-policy"
          repository="$RUNNER_TEMP/platform-publisher-repository"
          git_home="$RUNNER_TEMP/platform-publisher-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" tools/ci | tar -x -C "$destination"
          test -f "$destination/tools/ci/container-artifact-contract.sh" && test ! -L "$destination/tools/ci/container-artifact-contract.sh"
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"

      - name: Resolve trusted application configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648"; service_name="cdbentley"; repository="site" ;;
            711292980) project_id="runsetta"; project_number="601124730704"; service_name="runsetta"; repository="api" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510"; service_name="medlock"; repository="site" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513"; service_name="critical-history"; repository="site" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for production publication." >&2; exit 1 ;;
          esac
          image_name="us-east4-docker.pkg.dev/${project_id}/${repository}/${service_name}"
          {
            echo "project_id=$project_id"
            echo "image_name=$image_name"
            echo "remote_image=${image_name}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "publisher_service_account=gha-prod-publish@${project_id}.iam.gserviceaccount.com"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Bind the exact promoted artifact metadata before OIDC
        env:
          ARTIFACT_DIGEST: ${{ needs.verify-image.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.verify-image.outputs.artifact-id }}
          BASE_ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          BASE_ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for value in "$ARTIFACT_ID" "$BASE_ARTIFACT_ID"; do [[ "$value" =~ ^[1-9][0-9]*$ ]]; done
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$BASE_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          verify_artifact() {
            local id="$1" digest="$2" name="$3" max="$4"
            local response="$RUNNER_TEMP/publisher-artifact-${id}.json"
            gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" > "$response"
            jq -e --arg digest "sha256:${digest}" --arg id "$id" --arg name "$name" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson max "$max" --argjson repo "$EXPECTED_REPOSITORY_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
              (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
              .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
              (.size_in_bytes > 0 and .size_in_bytes <= $max)
            ' "$response" >/dev/null
          }
          verify_artifact "$ARTIFACT_ID" "$ARTIFACT_DIGEST" "platform-production-promoted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1074790400
          verify_artifact "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_DIGEST" "platform-production-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" 1611661312

      - name: Download only the exact promoted artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-promoted-download
          digest-mismatch: error
          skip-decompress: true

      - name: Download the exact trusted base artifact independently
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-publisher-bases
          digest-mismatch: error
          skip-decompress: true

      - name: Revalidate the promoted artifact without extracting layers
        id: artifact
        env:
          ARTIFACT_DOWNLOAD_DIR: ${{ runner.temp }}/platform-promoted-download
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-publisher-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          EXPECTED_CONTENT_SHA256: ${{ needs.verify-image.outputs.content-sha256 }}
          EXPECTED_EVENT_NAME: push
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          EXPECTED_PUBLISHED_INDEX_DIGEST: ${{ needs.verify-image.outputs.image-digest }}
          EXPECTED_RUNNABLE_MANIFEST_DIGEST: ${{ needs.verify-image.outputs.runnable-digest }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" validate-promoted

      - name: Prepare the checksum-pinned streaming publisher before OIDC
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" prepare-publisher

      - name: Prove exact production publisher workflow-SHA WIF trust
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate production publisher
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.publisher_service_account }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Stream the verified OCI graph into the fixed Artifact Registry repository
        id: copy
        env:
          AR_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPECTED_PUBLISHED_INDEX_DIGEST: ${{ needs.verify-image.outputs.image-digest }}
          IMAGE_ARCHIVE: ${{ steps.artifact.outputs.image_archive }}
          REMOTE_IMAGE: ${{ steps.app.outputs.remote_image }}
        run: |
          set -euo pipefail
          /bin/bash "${{ steps.policy.outputs.root }}/tools/ci/container-artifact-contract.sh" publish

      - name: Verify publisher credentials were retired
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/platform-publisher-auth"
          test ! -L "$RUNNER_TEMP/platform-publisher-auth"

  attest:
    name: Attest production image and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - publish
      - verify-image
    if: needs.publish.result == 'success'
    environment: supply-chain
    permissions:
      actions: read # Download the SBOM artifact from this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Obtain the GitHub artifact-attestation signing identity.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Download the exact promoted image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/platform-attest-download
          digest-mismatch: error
          skip-decompress: true

      - name: Extract and verify only the exact SBOM bytes
        env:
          EXPECTED_CONTENT_SHA256: ${{ needs.verify-image.outputs.content-sha256 }}
          EXPECTED_SBOM_DIGEST: ${{ needs.verify-image.outputs.sbom-content-digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CONTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SBOM_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t files < <(find "$RUNNER_TEMP/platform-attest-download" -mindepth 1 -maxdepth 1 -type f -print)
          test "${#files[@]}" -eq 1
          printf '%s  %s\n' "$EXPECTED_CONTENT_SHA256" "${files[0]}" | sha256sum --check --strict
          test "$(sort -u < <(tar -tf "${files[0]}") | tr '\n' ' ')" = "./ ./dhi-runtime.manifest.json ./image.oci.tar ./manifest.json ./sbom.spdx.json "
          mkdir -p platform-build
          tar -xOf "${files[0]}" ./sbom.spdx.json > platform-build/sbom.spdx.json
          printf '%s  %s\n' "$EXPECTED_SBOM_DIGEST" platform-build/sbom.spdx.json | sha256sum --check --strict

      - name: Require a valid JSON SBOM
        run: jq -e '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array")' platform-build/sbom.spdx.json >/dev/null

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.publish.outputs.image-name }}
          subject-digest: ${{ needs.publish.outputs.image-digest }}

      - name: Attest the SPDX SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.publish.outputs.image-name }}
          subject-digest: ${{ needs.publish.outputs.image-digest }}
          sbom-path: platform-build/sbom.spdx.json

  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs:
      - attest
      - prefetch-bases
      - publish
    if: >-
      needs.attest.result == 'success' &&
      needs.prefetch-bases.result == 'success' &&
      needs.publish.result == 'success'
    environment: production
    concurrency:
      group: deployment-parity-${{ github.event.repository.id }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read # Download only this run's exact DHI base closure before OIDC.
      contents: read
      id-token: write # Exchange only for the service-scoped production deploy identity.
      pull-requests: read # Prove every live preview tag still maps to an active exact PR head.

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Reject a stale main-branch run after acquiring the production lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/main-ref.json"
          curl --fail-with-body --show-error --silent --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main"
          head_sha="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' "$response")"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Refusing stale production deploy for ${GITHUB_SHA}; main is ${head_sha}." >&2
            exit 1
          fi

      - name: Resolve trusted application configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151) project_id="cdbentley"; project_number="882468538648"; service_name="cdbentley"; repository="site" ;;
            711292980) project_id="runsetta"; project_number="601124730704"; service_name="runsetta"; repository="api" ;;
            1025243085) project_id="medlock-1025243085"; project_number="229383559510"; service_name="medlock"; repository="site" ;;
            280932482) project_id="critical-history-16823277"; project_number="422714632513"; service_name="critical-history"; repository="site" ;;
            *) echo "Repository id $REPOSITORY_ID is not registered for production deployment." >&2; exit 1 ;;
          esac
          {
            echo "project_id=$project_id"
            echo "project_number=$project_number"
            echo "region=us-east4"
            echo "service_name=$service_name"
            echo "preview_service=${service_name}-preview"
            echo "preview_image=us-east4-docker.pkg.dev/${project_id}/${repository}-preview/${service_name}"
            echo "production_image=us-east4-docker.pkg.dev/${project_id}/${repository}/${service_name}"
            echo "preview_runtime_service_account=cloud-run-preview@${project_id}.iam.gserviceaccount.com"
            echo "runtime_service_account=cloud-run-runtime@${project_id}.iam.gserviceaccount.com"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "deploy_service_account=gha-prod-deploy@${project_id}.iam.gserviceaccount.com"
            echo "parity_service_account=gha-deploy-parity@${project_id}.iam.gserviceaccount.com"
            echo "preview_deploy_service_account=gha-preview-deploy@${project_id}.iam.gserviceaccount.com"
            echo "preview_commit_service_account=gha-preview-commit@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the exact reusable-workflow parity policy before OIDC
        id: parity-policy
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          destination="$RUNNER_TEMP/platform-preview-parity-policy"
          repository="$RUNNER_TEMP/platform-preview-parity-repository"
          git_home="$RUNNER_TEMP/platform-preview-parity-git-home"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination" "$repository" "$git_home"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null XDG_CONFIG_HOME="$git_home" PATH=/usr/bin:/bin
          git_safe() { /usr/bin/git -c core.fsmonitor=false -c core.hooksPath=/dev/null -c credential.helper= -c diff.external= -c filter.lfs.process= -c filter.lfs.required=false -c protocol.ext.allow=never -c protocol.file.allow=never -c submodule.recurse=false "$@"; }
          git_safe -C "$repository" init --quiet
          git_safe -C "$repository" remote add origin "https://github.com/${WORKFLOW_REPOSITORY}.git"
          git_safe -C "$repository" fetch --quiet --depth=1 --no-tags origin "$WORKFLOW_SHA"
          test "$(git_safe -C "$repository" rev-parse FETCH_HEAD^{commit})" = "$WORKFLOW_SHA"
          git_safe -C "$repository" archive "$WORKFLOW_SHA" \
            tools/ci/container-artifact-contract.sh \
            tools/ci/cloud-run-dhi-parity.sh \
            tools/ci/cloud-run-prod-dhi-transition.sh \
            tools/ci/deployment-parity-transition.sh | tar -x -C "$destination"
          for helper in container-artifact-contract.sh cloud-run-dhi-parity.sh cloud-run-prod-dhi-transition.sh deployment-parity-transition.sh; do
            test -f "$destination/tools/ci/$helper" && test ! -L "$destination/tools/ci/$helper"
          done
          test -x "$destination/tools/ci/cloud-run-prod-dhi-transition.sh"
          test -x "$destination/tools/ci/deployment-parity-transition.sh"
          dhi_parity_id="$(/bin/bash "$destination/tools/ci/container-artifact-contract.sh" print-dhi-parity-id)"
          [[ "$dhi_parity_id" =~ ^[a-z0-9]{50}$ ]]
          rm -rf -- "$repository" "$git_home"
          echo "root=$destination" >> "$GITHUB_OUTPUT"
          echo "dhi-parity-id=$dhi_parity_id" >> "$GITHUB_OUTPUT"

      - name: Bind the exact DHI base artifact before OIDC
        env:
          ARTIFACT_DIGEST: ${{ needs.prefetch-bases.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ needs.prefetch-bases.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          response="$RUNNER_TEMP/production-parity-base-artifact.json"
          gh api --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > "$response"
          jq -e --arg digest "sha256:${ARTIFACT_DIGEST}" --arg id "$ARTIFACT_ID" \
            --arg name "platform-production-bases-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar" \
            --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --argjson repo "${{ github.event.repository.id }}" '
            (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest and
            (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha and
            .workflow_run.repository_id == $repo and .workflow_run.head_repository_id == $repo and
            (.size_in_bytes > 0 and .size_in_bytes <= 1611661312)
          ' "$response" >/dev/null

      - name: Download only the exact DHI base artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prefetch-bases.outputs.artifact-id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/platform-production-parity-bases
          skip-decompress: true

      - name: Install checksum-pinned Google Cloud CLI
        env:
          GCLOUD_SHA256: deffdbe82ca6e3d19ffb291d063a651488e04e1b33799b5a238e4b5c6784e3c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/google-cloud-cli-581.0.0-linux-x86_64.tar.gz"
          sdk_root="$RUNNER_TEMP/google-cloud-cli"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            'https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-581.0.0-linux-x86_64.tar.gz?generation=1787059661116797'
          echo "${GCLOUD_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$sdk_root"
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          export CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          export CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
          "$sdk_root/bin/gcloud" version --format=json \
            | jq -e '.["Google Cloud SDK"] == "581.0.0"' >/dev/null
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true"
            echo "CLOUDSDK_CORE_DISABLE_PROMPTS=1"
            echo "CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true"
          } >> "$GITHUB_ENV"

      - name: Authenticate the read-only deployment parity identity
        id: parity-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.parity_service_account }}
          create_credentials_file: true
          export_environment_variables: false

      - name: Refuse production if any live preview has different or unknown DHI lineage
        id: parity
        continue-on-error: true
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-production-parity-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          EXPECTED_PREVIEW_IMAGE_NAME: ${{ steps.app.outputs.preview_image }}
          EXPECTED_PREVIEW_SERVICE_NAME: ${{ steps.app.outputs.preview_service }}
          EXPECTED_PREVIEW_RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.preview_runtime_service_account }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_PRODUCTION_IMAGE_NAME: ${{ steps.app.outputs.production_image }}
          EXPECTED_PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PARITY_CREDENTIAL_FILE: ${{ steps.parity-auth.outputs.credentials_file_path }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          token_file="$RUNNER_TEMP/deployment-parity-access-token"
          header_file="$RUNNER_TEMP/deployment-parity-rest-header"
          cleanup_parity_credentials() {
            rm -f -- "$token_file" "$header_file"
            if [[ "${PARITY_CREDENTIAL_FILE:-}" == "$GITHUB_WORKSPACE"/* ]] &&
               { [ -f "$PARITY_CREDENTIAL_FILE" ] || [ -L "$PARITY_CREDENTIAL_FILE" ]; }; then
              rm -f -- "$PARITY_CREDENTIAL_FILE"
            fi
          }
          trap cleanup_parity_credentials EXIT
          [[ "$PARITY_CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
          test -f "$PARITY_CREDENTIAL_FILE" && test ! -L "$PARITY_CREDENTIAL_FILE"
          CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$PARITY_CREDENTIAL_FILE" gcloud auth print-access-token > "$token_file"
          printf 'Authorization: Bearer %s\n' "$(<"$token_file")" > "$header_file"
          capture_preview_routes() {
            local suffix="$1" mode="$2" outputs="$3" service_json service_v2 revision_dir revision_v2_dir revision
            service_json="$RUNNER_TEMP/preview-parity-${suffix}-service.json"
            service_v2="$RUNNER_TEMP/preview-parity-${suffix}-v2-service.json"
            revision_dir="$RUNNER_TEMP/preview-parity-${suffix}-revisions"
            revision_v2_dir="$RUNNER_TEMP/preview-parity-${suffix}-v2-revisions"
            install -d -m 0700 "$revision_dir" "$revision_v2_dir"
            gcloud --access-token-file="$token_file" run services describe "$PREVIEW_SERVICE" \
              --project="$PROJECT_ID" --region="$REGION" --format=json > "$service_json"
            curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
              --header "@$header_file" --output "$service_v2" \
              "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${PREVIEW_SERVICE}"
            v1_ingress="$(jq -er '.metadata.annotations["run.googleapis.com/ingress"]' "$service_json")"
            v1_invoker="$(jq -er '.metadata.annotations["run.googleapis.com/invoker-iam-disabled"] // "false"' "$service_json")"
            case "$v1_ingress:$v1_invoker" in
              all:true) expected_v2_ingress=INGRESS_TRAFFIC_ALL; expected_v2_invoker=true ;;
              internal-and-cloud-load-balancing:true) expected_v2_ingress=INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER; expected_v2_invoker=true ;;
              internal:false) expected_v2_ingress=INGRESS_TRAFFIC_INTERNAL_ONLY; expected_v2_invoker=false ;;
              *) echo "Preview v1 exposure is outside the exact reviewed open/sealed states." >&2; return 1 ;;
            esac
            jq -e --arg ingress "$expected_v2_ingress" --argjson invoker "$expected_v2_invoker" '
              (.reconciling // false) == false and .ingress == $ingress and (.invokerIamDisabled // false) == $invoker and
              (.defaultUriDisabled // false) == false and
              .generation == .observedGeneration and
              .terminalCondition.type == "Ready" and .terminalCondition.state == "CONDITION_SUCCEEDED" and
              all(.template.containers[]?; ((.baseImageUri // "") == ""))
            ' "$service_v2" >/dev/null
            while IFS= read -r revision; do
              [ -n "$revision" ] || continue
              [[ "$revision" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
              gcloud --access-token-file="$token_file" run revisions describe "$revision" \
                --project="$PROJECT_ID" --region="$REGION" --format=json > "$revision_dir/${revision}.json"
              curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
                --header "@$header_file" --output "$revision_v2_dir/${revision}.json" \
                "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${PREVIEW_SERVICE}/revisions/${revision}"
              jq -e --arg name "projects/${PROJECT_ID}/locations/${REGION}/services/${PREVIEW_SERVICE}/revisions/${revision}" \
                --arg runtime "$EXPECTED_PREVIEW_RUNTIME_SERVICE_ACCOUNT" --slurpfile v1 "$revision_dir/${revision}.json" '
                .name == $name and (.reconciling // false) == false and .serviceAccount == $runtime and
                ((.volumes // []) | length) == 0 and ((.vpcAccess // {}) == {}) and
                (.containers | length) == 1 and ((.containers[0].volumeMounts // []) | length) == 0 and
                ((.containers[0].baseImageUri // "") == "") and
                all(.containers[0].env[]?; (keys | sort) == ["name","value"]) and
                .containers[0].image == $v1[0].spec.containers[0].image and
                ((.containers[0].command // []) == ($v1[0].spec.containers[0].command // [])) and
                ((.containers[0].args // []) == ($v1[0].spec.containers[0].args // [])) and
                ([.containers[0].env[]? | {name,value}] | sort_by(.name)) ==
                  ([$v1[0].spec.containers[0].env[]? | {name,value}] | sort_by(.name)) and
                ([.conditions[]? | select(.type == "Ready" and .state == "CONDITION_SUCCEEDED")] | length) == 1
              ' "$revision_v2_dir/${revision}.json" >/dev/null
            done < <(jq -r '.status.traffic[]?.revisionName' "$service_json" | sort -u)
            jq -cS '[.status.traffic[]? | {percent,revisionName,tag:(.tag // null)}] | sort_by(.tag // "")' "$service_json" > "$RUNNER_TEMP/preview-parity-${suffix}-v1-traffic.json"
            jq -e '
              all(.trafficStatuses[]?;
                ((.type == "TRAFFIC_TARGET_ALLOCATION_TYPE_REVISION") and
                  (.revision | type == "string") and (.revision | length > 0)) or
                ((.type == "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST") and
                  (.trafficStatuses | length) == 1 and .percent == 100 and
                  ((.tag // "") == "") and ((.revision // "") == "") and
                  (.latestReadyRevision | type == "string") and (.latestReadyRevision | length > 0)))
            ' "$service_v2" >/dev/null
            jq -cS '
              .latestReadyRevision as $latest |
              [.trafficStatuses[]? | {
                percent,
                revisionName:((if ((.revision // "") == "") then $latest else .revision end) | split("/")[-1]),
                tag:(.tag // null)
              }] | sort_by(.tag // "")
            ' "$service_v2" > "$RUNNER_TEMP/preview-parity-${suffix}-v2-traffic.json"
            cmp "$RUNNER_TEMP/preview-parity-${suffix}-v1-traffic.json" "$RUNNER_TEMP/preview-parity-${suffix}-v2-traffic.json" >/dev/null
            GITHUB_OUTPUT="$outputs" PARITY_SERVICE_JSON="$service_json" PARITY_REVISION_DIR="$revision_dir" \
              /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/cloud-run-dhi-parity.sh" "$mode"
            mapfile -d '' -t revision_v2_files < <(find "$revision_v2_dir" -mindepth 1 -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
            jq -cS '{name,generation,observedGeneration,ingress,invokerIamDisabled,defaultUriDisabled,traffic,trafficStatuses,latestReadyRevision,reconciling,terminalCondition,urls,uri,etag,template}' "$service_v2" > "$RUNNER_TEMP/preview-parity-${suffix}-v2-service-projection.json"
            jq -scS 'sort_by(.name)' "${revision_v2_files[@]}" > "$RUNNER_TEMP/preview-parity-${suffix}-v2-revisions-projection.json"
            {
              sha256sum "$RUNNER_TEMP/preview-parity-${suffix}-v2-service-projection.json" | cut -d ' ' -f 1
              sha256sum "$RUNNER_TEMP/preview-parity-${suffix}-v2-revisions-projection.json" | cut -d ' ' -f 1
            } | sha256sum | cut -d ' ' -f 1 | sed 's/^/v2_projection_sha256=/' >> "$outputs"
          }
          before="$RUNNER_TEMP/preview-parity-before.outputs"
          after="$RUNNER_TEMP/preview-parity-after.outputs"
          capture_preview_routes before inspect-preview-routes "$before"
          output_value() { sed -n "s/^$1=//p" "$2" | tail -n 1; }
          active_preview_count="$(sed -n 's/^active_preview_count=//p' "$before" | tail -n 1)"
          [[ "$active_preview_count" =~ ^[0-9]+$ ]]
          if [ "$(output_value all_routes_candidate_parity "$before")" = true ]; then
            strict_before="$RUNNER_TEMP/preview-parity-before-strict.outputs"
            GITHUB_OUTPUT="$strict_before" \
              PARITY_SERVICE_JSON="$RUNNER_TEMP/preview-parity-before-service.json" \
              PARITY_REVISION_DIR="$RUNNER_TEMP/preview-parity-before-revisions" \
              /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/cloud-run-dhi-parity.sh" prove-preview-routes
            revision_dir="$RUNNER_TEMP/preview-parity-before-revisions"
            image_set="$RUNNER_TEMP/live-preview-image-set.json"
            mapfile -d '' -t revision_files < <(find "$revision_dir" -mindepth 1 -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
            test "${#revision_files[@]}" -gt 0
            jq -s --arg preview "$EXPECTED_PREVIEW_IMAGE_NAME" --arg production "$EXPECTED_PRODUCTION_IMAGE_NAME" '[.[] | {
              head:.metadata.labels["git-head-sha"],
              index:((if .metadata.labels["preview-role"] == "baseline" then $production else $preview end) + "@" +
                ([.spec.containers[0].env[]? | select(.name == "PLATFORM_IMAGE_INDEX_DIGEST") | .value] | if length == 1 then .[0] else error("invalid index binding") end)),
              kind:(if .metadata.labels["preview-role"] == "baseline" then "production" else "preview" end),
              name:(if .metadata.labels["preview-role"] == "baseline" then $production else $preview end),
              runnable:.spec.containers[0].image
            }]' "${revision_files[@]}" > "$image_set"
            graph_outputs="$RUNNER_TEMP/live-preview-image-graphs.outputs"
            GITHUB_OUTPUT="$graph_outputs" \
              AR_ACCESS_TOKEN="$(<"$token_file")" \
              LIVE_IMAGE_SET_FILE="$image_set" \
              /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/container-artifact-contract.sh" verify-live-images
            test "$(sed -n 's/^dhi_parity_id=//p' "$graph_outputs" | tail -n 1)" = \
              "$(sed -n 's/^candidate_dhi_parity_id=//p' "$before" | tail -n 1)"
            while IFS=$'\t' read -r live_pr live_revision; do
              [[ "$live_pr" =~ ^[1-9][0-9]*$ ]]
              [[ "$live_revision" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
              live_head="$(jq -er '.metadata.labels["git-head-sha"]' "$revision_dir/${live_revision}.json")"
              pr_state="$RUNNER_TEMP/production-preview-pr-${live_pr}.json"
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${live_pr}" > "$pr_state"
              jq -e --arg head "$live_head" --arg repository "$EXPECTED_REPOSITORY" --arg repository_id "$EXPECTED_REPOSITORY_ID" '
                .state == "open" and .draft == false and .head.sha == $head and
                (.head.repo.id | tostring) == $repository_id and .head.repo.full_name == $repository and
                .base.ref == "main"
              ' "$pr_state" >/dev/null || {
                echo "A live preview tag no longer maps to an exact deployable pull request head." >&2
                exit 1
              }
            done < <(jq -r '.status.traffic[]? | select((.tag // "") | test("^pr-[1-9][0-9]*$")) | [(.tag | sub("^pr-"; "")), .revisionName] | @tsv' "$RUNNER_TEMP/preview-parity-before-service.json")
          else
            [ "$active_preview_count" -eq 0 ] || {
              echo "A different or unknown DHI lineage still has live pull request tags." >&2
              exit 1
            }
            if [ "$(output_value sealed_bootstrap "$before")" != true ] &&
               [ "$(output_value sealed_baseline "$before")" != true ]; then
              echo "Zero-tag preview state is neither the exact sealed bootstrap nor a sanitized sealed baseline." >&2
              exit 1
            fi
            v2_preview="$RUNNER_TEMP/preview-parity-sealed-v2.json"
            curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
              --header "@$header_file" --output "$v2_preview" \
              "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${PREVIEW_SERVICE}"
            jq -e --arg name "projects/${PROJECT_ID}/locations/${REGION}/services/${PREVIEW_SERVICE}" '
              .name == $name and (.reconciling // false) == false and
              .ingress == "INGRESS_TRAFFIC_INTERNAL_ONLY" and (.invokerIamDisabled // false) == false and
              (.defaultUriDisabled // false) == false and
              ([.trafficStatuses[]? | select(.percent == 100 and ((.tag // "") == ""))] | length) == 1 and
              ([.trafficStatuses[]? | select((.tag // "") != "")] | length) == 0
            ' "$v2_preview" >/dev/null || {
              echo "Zero-tag preview transition is not sealed in the authoritative Cloud Run v2 API." >&2
              exit 1
            }
          fi
          capture_preview_routes after inspect-preview-routes "$after"
          if [ "$(output_value all_routes_candidate_parity "$before")" = true ]; then
            strict_after="$RUNNER_TEMP/preview-parity-after-strict.outputs"
            GITHUB_OUTPUT="$strict_after" \
              PARITY_SERVICE_JSON="$RUNNER_TEMP/preview-parity-after-service.json" \
              PARITY_REVISION_DIR="$RUNNER_TEMP/preview-parity-after-revisions" \
              /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/cloud-run-dhi-parity.sh" prove-preview-routes
          fi
          for key in active_preview_count all_routes_candidate_parity baseline_head_sha baseline_index_image baseline_runnable_image baseline_revision candidate_dhi_parity_id dhi_parity_id ingress invoker_iam_disabled preview_projection_sha256 revision_projection_sha256 route_revision_count sealed_baseline sealed_bootstrap v2_projection_sha256; do
            test "$(output_value "$key" "$before")" = "$(output_value "$key" "$after")" || {
              echo "Preview traffic changed while the production parity guard was evaluating it." >&2
              exit 1
            }
          done
          cat "$after" >> "$GITHUB_OUTPUT"
          echo "dhi_parity_id=$(output_value candidate_dhi_parity_id "$after")" >> "$GITHUB_OUTPUT"
          cleanup_parity_credentials
          trap - EXIT

      - name: Authenticate the active-SHA production epoch committer
        id: epoch-commit-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.preview_commit_service_account }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Use the same-DHI fast path or durably seal and prune the preview epoch
        id: epoch-prepare
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ACCESS_TOKEN: ${{ steps.epoch-commit-auth.outputs.access_token }}
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-production-parity-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          DHI_PARITY_ID: ${{ steps.parity-policy.outputs.dhi-parity-id }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_PREVIEW_IMAGE_NAME: ${{ steps.app.outputs.preview_image }}
          EXPECTED_PREVIEW_RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.preview_runtime_service_account }}
          EXPECTED_PRODUCTION_IMAGE_NAME: ${{ steps.app.outputs.production_image }}
          EXPECTED_PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          PARITY_POLICY_ROOT: ${{ steps.parity-policy.outputs.root }}
          PREVIEW_PARITY_ADMITTED: ${{ steps.parity.outcome == 'success' }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "$PARITY_POLICY_ROOT/tools/ci/cloud-run-prod-dhi-transition.sh" prepare

      - name: Authenticate production deployer
        id: production-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.deploy_service_account }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Deploy production to Cloud Run
        id: production-deploy
        env:
          DHI_PARITY_ID: ${{ steps.parity-policy.outputs.dhi-parity-id }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          IMAGE_NAME: ${{ needs.publish.outputs.image-name }}
          RUNNABLE_DIGEST: ${{ needs.publish.outputs.runnable-digest }}
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
          PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.runtime_service_account }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [[ ! "$RUNNABLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [ "$IMAGE_DIGEST" = "$RUNNABLE_DIGEST" ] ||
             [[ ! "$DHI_PARITY_ID" =~ ^[a-z0-9]{50}$ ]] ||
             [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$PLATFORM_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$REPOSITORY_ID" =~ ^[0-9]+$ ]] ||
             [[ ! "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] ||
             [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "Invalid production source, run, repository, or image identity." >&2
            exit 1
          fi

          umask 077
          env_file="$RUNNER_TEMP/production-env.json"
          service_snapshot="$RUNNER_TEMP/production-service.json"
          version_snapshot="$RUNNER_TEMP/waitlist-secret-version.json"
          versions_snapshot="$RUNNER_TEMP/waitlist-secret-versions.json"
          trap 'rm -f "$env_file" "${env_file}.next" "$service_snapshot" "$version_snapshot" "$versions_snapshot" "${deployed_revision_snapshot:-}" "${parity_outputs:-}" "${rest_token_file:-}" "${rest_header_file:-}" "${v2_service_snapshot:-}" "${v2_revision_snapshot:-}"' EXIT
          jq -n --arg index "$IMAGE_DIGEST" --arg runnable "$RUNNABLE_DIGEST" '{
            PLATFORM_IMAGE_INDEX_DIGEST: $index,
            PLATFORM_IMAGE_RUNNABLE_DIGEST: $runnable
          }' > "$env_file"
          labels="managed-by=github-actions,environment=production,dhi-parity-id=${DHI_PARITY_ID},git-head-sha=${GITHUB_SHA},github-repository-id=${REPOSITORY_ID},github-run-id=${GITHUB_RUN_ID},github-run-attempt=${GITHUB_RUN_ATTEMPT},platform-workflow-sha=${PLATFORM_WORKFLOW_SHA}"
          secret_args=(--clear-secrets)
          case "$REPOSITORY_ID" in
            1255553151)
              # cdbentley has no product-specific runtime configuration.
              ;;
            711292980)
              # Runsetta remains deliberately offline. Do not add Secret Manager
              # references until their exact numeric versions are reviewed in code.
              jq '. + {
                RUNSETTA_OFFLINE: "1",
                RUNSETTA_TTS_MODEL: "gpt-4o-mini-tts",
                RUNSETTA_TTS_VOICE: "marin"
              }' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            1025243085)
              gcloud run services describe "$SERVICE_NAME" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --format=json > "$service_snapshot"
              waitlist_entries="$(jq -ce '[
                .spec.template.spec.containers[0].env[]?
                | select(.name == "WAITLIST_IDENTITY_KEYSET")
              ]' "$service_snapshot")"
              waitlist_entry_count="$(jq -er 'length' <<< "$waitlist_entries")"
              if [ "$waitlist_entry_count" = "1" ]; then
                current_secret_version="$(jq -er '
                  .[0]
                  | select((keys | sort) == ["name", "valueFrom"])
                  | select(.name == "WAITLIST_IDENTITY_KEYSET")
                  | .valueFrom
                  | select((keys | sort) == ["secretKeyRef"])
                  | .secretKeyRef
                  | select((keys | sort) == ["key", "name"])
                  | select(.name == "waitlist-identity-keyset")
                  | .key
                  | select(type == "string" and test("^[1-9][0-9]*$"))
                ' <<< "$waitlist_entries")"
                secret_version="$current_secret_version"
              elif [ "$waitlist_entry_count" = "0" ]; then
                gcloud secrets versions list \
                  --secret=waitlist-identity-keyset \
                  --project="$PROJECT_ID" \
                  --filter='state=ENABLED' \
                  --format=json > "$versions_snapshot"
                if ! jq -e 'type == "array" and length == 0' "$versions_snapshot" >/dev/null; then
                  echo "Refusing to guess an unbound existing Medlock secret version." >&2
                  exit 1
                fi
                secret_version_resource="$(
                  openssl rand -base64 32 \
                    | tr -d '\n=' \
                    | tr '/+' '_-' \
                    | gcloud secrets versions add waitlist-identity-keyset \
                      --project="$PROJECT_ID" \
                      --data-file=- \
                      --format='value(name)'
                )"
                if [[ ! "$secret_version_resource" =~ ^projects/(229383559510|medlock-1025243085)/secrets/waitlist-identity-keyset/versions/([1-9][0-9]*)$ ]]; then
                  echo "Secret Manager did not return the exact Medlock secret version resource." >&2
                  exit 1
                fi
                secret_version="${BASH_REMATCH[2]}"
              else
                echo "Medlock has multiple WAITLIST_IDENTITY_KEYSET runtime entries." >&2
                exit 1
              fi
              gcloud secrets versions describe "$secret_version" \
                --secret=waitlist-identity-keyset \
                --project="$PROJECT_ID" \
                --format=json > "$version_snapshot"
              jq -e --arg version "$secret_version" '
                .state == "ENABLED" and
                (.name == ("projects/229383559510/secrets/waitlist-identity-keyset/versions/" + $version) or
                 .name == ("projects/medlock-1025243085/secrets/waitlist-identity-keyset/versions/" + $version))
              ' "$version_snapshot" >/dev/null
              labels="${labels},waitlist-secret-version=${secret_version}"
              secret_args=(--set-secrets="WAITLIST_IDENTITY_KEYSET=waitlist-identity-keyset:${secret_version}")
              jq '. + {
                ALLOWED_HOSTS: "medlock.ai,www.medlock.ai,mcp.medlock.ai,healthmcp.ai,www.healthmcp.ai,healthmcp.app,www.healthmcp.app,*.run.app",
                ALLOWED_ORIGINS: "https://medlock.ai,https://www.medlock.ai,https://mcp.medlock.ai,https://chat.openai.com,https://claude.ai,https://*.run.app",
                CANONICAL_HOST: "medlock.ai",
                FIRESTORE_COLLECTION: "waitlist",
                FIRESTORE_DATABASE_ID: "(default)",
                FIRESTORE_PROJECT_ID: "medlock-1025243085",
                LEGACY_HOSTS: "healthmcp.ai,www.healthmcp.ai,healthmcp.app,www.healthmcp.app",
                MEDLOCK_VERSION: "0.2.0",
                PLATFORM_DEPLOY_ENVIRONMENT: "production",
                WAITLIST_BACKEND: "firestore"
              }' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            280932482)
              if [[ ! "$MAPBOX_PUBLIC_TOKEN" =~ ^pk\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
                echo "Critical History requires a protected MAPBOX_PUBLIC_TOKEN in public pk format." >&2
                exit 1
              fi
              jq --arg token "$MAPBOX_PUBLIC_TOKEN" \
                '. + {MAPBOX_PUBLIC_TOKEN: $token}' "$env_file" > "${env_file}.next"
              mv "${env_file}.next" "$env_file"
              ;;
            *)
              echo "Repository id $REPOSITORY_ID has no trusted production runtime configuration." >&2
              exit 1
              ;;
          esac

          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --clear-base-image \
            --env-vars-file="$env_file" \
            "${secret_args[@]}" \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --ingress=all \
            --no-invoker-iam-check \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=300s \
            --labels="$labels" \
            --quiet
          gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$service_snapshot"
          deployed_revision="$(jq -er '.status.latestReadyRevisionName | select(test("^[a-z][a-z0-9-]{0,62}$"))' "$service_snapshot")"
          deployed_revision_snapshot="$RUNNER_TEMP/deployed-production-revision.json"
          gcloud run revisions describe "$deployed_revision" \
            --project="$PROJECT_ID" --region="$REGION" --format=json > "$deployed_revision_snapshot"
          rest_token_file="$RUNNER_TEMP/deployed-production-rest-token"
          rest_header_file="$RUNNER_TEMP/deployed-production-rest-header"
          v2_service_snapshot="$RUNNER_TEMP/deployed-production-v2-service.json"
          v2_revision_snapshot="$RUNNER_TEMP/deployed-production-v2-revision.json"
          gcloud auth print-access-token > "$rest_token_file"
          printf 'Authorization: Bearer %s\n' "$(<"$rest_token_file")" > "$rest_header_file"
          curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            --header "@$rest_header_file" --output "$v2_service_snapshot" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}"
          curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            --header "@$rest_header_file" --output "$v2_revision_snapshot" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}/revisions/${deployed_revision}"
          rm -f -- "$rest_token_file" "$rest_header_file"
          jq -e --arg name "projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}" --arg revision "$deployed_revision" '
            .name == $name and (.reconciling // false) == false and
            .ingress == "INGRESS_TRAFFIC_ALL" and .invokerIamDisabled == true and
            (.defaultUriDisabled // false) == false and
            (.uri | startswith("https://")) and
            (.urls | type == "array" and length > 0 and all(.[]; startswith("https://"))) and
            .generation == .observedGeneration and
            .terminalCondition.type == "Ready" and .terminalCondition.state == "CONDITION_SUCCEEDED" and
            all(.template.containers[]?; ((.baseImageUri // "") == "")) and
            (.latestReadyRevision | split("/")[-1]) == $revision and
            (.traffic | length) == 1 and .traffic[0].type == "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST" and
            .traffic[0].percent == 100 and ((.traffic[0].tag // "") == "") and ((.traffic[0].revision // "") == "") and
            (.trafficStatuses | length) == 1 and .trafficStatuses[0].type == "TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST" and
            .trafficStatuses[0].percent == 100 and ((.trafficStatuses[0].tag // "") == "") and
            ((.trafficStatuses[0].revision // "") == "")
          ' "$v2_service_snapshot" >/dev/null || {
            echo "Production v2 exposure or exact 100%-served revision readback drifted." >&2
            exit 1
          }
          jq -e --arg name "projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE_NAME}/revisions/${deployed_revision}" \
            --arg image "${IMAGE_NAME}@${RUNNABLE_DIGEST}" --arg index "$IMAGE_DIGEST" --arg runnable "$RUNNABLE_DIGEST" '
            def exact_value($name):
              [.containers[0].env[]? | select(.name == $name and (keys | sort) == ["name","value"]) | .value]
              | if length == 1 then .[0] else error("missing or duplicate immutable image identity") end;
            .name == $name and (.reconciling // false) == false and
            (.containers | length) == 1 and .containers[0].image == $image and
            ((.containers[0].baseImageUri // "") == "") and
            exact_value("PLATFORM_IMAGE_INDEX_DIGEST") == $index and
            exact_value("PLATFORM_IMAGE_RUNNABLE_DIGEST") == $runnable and
            ([.conditions[]? | select(.type == "Ready" and .state == "CONDITION_SUCCEEDED")] | length) == 1
          ' "$v2_revision_snapshot" >/dev/null || {
            echo "Production v2 revision did not bind the published OCI index to its Cloud Run runnable child." >&2
            exit 1
          }
          parity_outputs="$RUNNER_TEMP/deployed-production-parity.outputs"
          GITHUB_OUTPUT="$parity_outputs" \
            PARITY_SERVICE_JSON="$service_snapshot" \
            PARITY_REVISION_JSON="$deployed_revision_snapshot" \
            EXPECTED_SERVICE_NAME="$SERVICE_NAME" \
            EXPECTED_PROJECT_NUMBER="$PROJECT_NUMBER" \
            EXPECTED_REPOSITORY_ID="$REPOSITORY_ID" \
            EXPECTED_PRODUCTION_IMAGE_NAME="$IMAGE_NAME" \
            /bin/bash "${{ steps.parity-policy.outputs.root }}/tools/ci/cloud-run-dhi-parity.sh" prove-production
          {
            echo "revision=$deployed_revision"
            echo "head-sha=$GITHUB_SHA"
            echo "index-image=${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo "runnable-image=${IMAGE_NAME}@${RUNNABLE_DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Retire production deploy credentials before preview baseline staging
        if: always() && github.run_attempt == '1'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CREDENTIAL_FILE: ${{ steps.production-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [ -n "$CREDENTIAL_FILE" ]; then
            [[ "$CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
            test ! -L "$CREDENTIAL_FILE"
            rm -f -- "$CREDENTIAL_FILE"
            test ! -e "$CREDENTIAL_FILE" && test ! -L "$CREDENTIAL_FILE"
          fi

      - name: Authenticate the active-SHA preview baseline deployer after a DHI epoch
        id: epoch-baseline-auth
        if: steps.epoch-prepare.outputs.epoch-required == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.preview_deploy_service_account }}
          token_format: access_token
          access_token_lifetime: 300s

      - name: Stage a sanitized baseline from the newly served production image
        id: epoch-baseline
        if: steps.epoch-prepare.outputs.epoch-required == 'true'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          DHI_PARITY_ID: ${{ steps.parity-policy.outputs.dhi-parity-id }}
          LIVE_PRODUCTION_HEAD_SHA: ${{ steps.production-deploy.outputs.head-sha }}
          LIVE_PRODUCTION_INDEX_IMAGE: ${{ steps.production-deploy.outputs.index-image }}
          LIVE_PRODUCTION_RUNNABLE_IMAGE: ${{ steps.production-deploy.outputs.runnable-image }}
          PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.preview_runtime_service_account }}
        run: |
          set -euo pipefail
          [[ "$DHI_PARITY_ID" =~ ^[a-z0-9]{50}$ ]]
          [[ "$LIVE_PRODUCTION_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LIVE_PRODUCTION_INDEX_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$LIVE_PRODUCTION_RUNNABLE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          [[ "$PLATFORM_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_tail="${GITHUB_RUN_ID: -10}"
          index_digest="${LIVE_PRODUCTION_INDEX_IMAGE##*@sha256:}"
          suffix="b${LIVE_PRODUCTION_HEAD_SHA:0:10}-${index_digest:0:10}-e${run_tail}"
          revision="${PREVIEW_SERVICE}-${suffix}"
          [[ "$revision" =~ ^[a-z][a-z0-9-]{0,62}$ ]] && [ "${#revision}" -le 63 ]
          env_file="$RUNNER_TEMP/prod-epoch-baseline-env.json"
          response="$RUNNER_TEMP/prod-epoch-baseline-response.json"
          trap 'rm -f -- "$env_file" "$response"' EXIT
          jq -n --arg index "${LIVE_PRODUCTION_INDEX_IMAGE##*@}" \
            --arg runnable "${LIVE_PRODUCTION_RUNNABLE_IMAGE##*@}" '{
              PLATFORM_DEPLOY_ENVIRONMENT:"preview-baseline",
              PLATFORM_IMAGE_INDEX_DIGEST:$index,
              PLATFORM_IMAGE_RUNNABLE_DIGEST:$runnable
            }' > "$env_file"
          gcloud run deploy "$PREVIEW_SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$LIVE_PRODUCTION_INDEX_IMAGE" \
            --clear-base-image \
            --revision-suffix="$suffix" \
            --no-traffic \
            --env-vars-file="$env_file" \
            --clear-secrets \
            --clear-volumes \
            --clear-cloudsql-instances \
            --clear-vpc-connector \
            --clear-network \
            --command=bun \
            '--args=^~^-e~Bun.serve({port:+process.env.PORT,fetch(){return new Response(null,{status:404})}})' \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=300s \
            --labels="managed-by=github-actions,environment=preview,preview-role=baseline,dhi-parity-id=${DHI_PARITY_ID},git-head-sha=${LIVE_PRODUCTION_HEAD_SHA},github-repository-id=${REPOSITORY_ID},github-run-id=${GITHUB_RUN_ID},github-run-attempt=${GITHUB_RUN_ATTEMPT},platform-workflow-sha=${PLATFORM_WORKFLOW_SHA}" \
            --quiet \
            --format=json > "$response"
          gcloud run revisions describe "$revision" --project="$PROJECT_ID" --region="$REGION" --format=json \
            | jq -e --arg revision "$revision" --arg image "$LIVE_PRODUCTION_RUNNABLE_IMAGE" '
                .metadata.name == $revision and .spec.containers[0].image == $image and
                .status.imageDigest == $image and
                .spec.containers[0].command == ["bun"] and
                .spec.containers[0].args == ["-e","Bun.serve({port:+process.env.PORT,fetch(){return new Response(null,{status:404})}})"]
              ' >/dev/null
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Retire preview baseline deploy credentials before final parity proof
        if: always() && github.run_attempt == '1'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CREDENTIAL_FILE: ${{ steps.epoch-baseline-auth.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [ -n "$CREDENTIAL_FILE" ]; then
            [[ "$CREDENTIAL_FILE" == "$GITHUB_WORKSPACE"/* ]]
            test ! -L "$CREDENTIAL_FILE"
            rm -f -- "$CREDENTIAL_FILE"
            test ! -e "$CREDENTIAL_FILE" && test ! -L "$CREDENTIAL_FILE"
          fi

      - name: Reauthenticate the epoch committer for final proof and release
        id: epoch-final-auth
        if: steps.epoch-prepare.outputs.epoch-required == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.preview_commit_service_account }}
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Atomically install and prove the new-DHI baseline before releasing the epoch
        id: epoch-finalize
        if: steps.epoch-prepare.outputs.epoch-required == 'true'
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ACCESS_TOKEN: ${{ steps.epoch-final-auth.outputs.access_token }}
          BASE_CONTENT_SHA256: ${{ needs.prefetch-bases.outputs.content-sha256 }}
          BASE_DOWNLOAD_DIR: ${{ runner.temp }}/platform-production-parity-bases
          BASE_MANIFEST_SHA256: ${{ needs.prefetch-bases.outputs.manifest-sha256 }}
          BASELINE_REVISION: ${{ steps.epoch-baseline.outputs.revision }}
          DHI_PARITY_ID: ${{ steps.parity-policy.outputs.dhi-parity-id }}
          EXPECTED_BASELINE_PRODUCTION_HEAD_SHA: ${{ steps.production-deploy.outputs.head-sha }}
          EXPECTED_BASELINE_PRODUCTION_INDEX_IMAGE: ${{ steps.production-deploy.outputs.index-image }}
          EXPECTED_BASELINE_PRODUCTION_RUNNABLE_IMAGE: ${{ steps.production-deploy.outputs.runnable-image }}
          EXPECTED_PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          EXPECTED_PREVIEW_IMAGE_NAME: ${{ steps.app.outputs.preview_image }}
          EXPECTED_PREVIEW_RUNTIME_SERVICE_ACCOUNT: ${{ steps.app.outputs.preview_runtime_service_account }}
          EXPECTED_PRODUCTION_IMAGE_NAME: ${{ steps.app.outputs.production_image }}
          EXPECTED_PROJECT_NUMBER: ${{ steps.app.outputs.project_number }}
          PARITY_POLICY_ROOT: ${{ steps.parity-policy.outputs.root }}
          PREVIEW_SERVICE: ${{ steps.app.outputs.preview_service }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
        run: |
          set -euo pipefail
          set +x
          /bin/bash "$PARITY_POLICY_ROOT/tools/ci/cloud-run-prod-dhi-transition.sh" finalize

      - name: Require the selected production parity path to finish
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          EPOCH_REQUIRED: ${{ steps.epoch-prepare.outputs.epoch-required }}
          EPOCH_FINALIZED: ${{ steps.epoch-finalize.outputs.epoch-finalized }}
        run: |
          set -euo pipefail
          if [ "$EPOCH_REQUIRED" = true ]; then
            [ "$EPOCH_FINALIZED" = true ]
          else
            [ "$EPOCH_REQUIRED" = false ] && [ -z "$EPOCH_FINALIZED" ]
          fi
