name: Refresh Grype database

on:
  schedule:
    # Anchore republishes the v6 database once a day, observed between 06:00Z
    # and 09:30Z. Twice daily keeps the pin well inside the reviewed 48-hour
    # ceiling even when one proposal is not merged promptly; the ceiling itself
    # is deliberately unchanged.
    - cron: "40 10 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-grype-db-${{ github.event.repository.id }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Grype database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install checksum-pinned Bun 1.4.0
        env:
          BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          echo "${BUN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          echo "$destination/bun-linux-x64" >> "$GITHUB_PATH"
          "$destination/bun-linux-x64/bun" -e 'if (Bun.version !== "1.4.0") process.exit(1)'

      - name: Reconcile the reviewed snapshot against what Anchore publishes
        run: |
          set -euo pipefail
          bun run tools/ci/refresh-grype-db.ts

      - name: Refuse anything but the five reviewed pin locations
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          if [ -z "$changed" ]; then
            echo "pin already reconciled; nothing to propose"
            exit 0
          fi
          expected="platform-capabilities/preview-deployment-parity-v1.json tools/ci/container-artifact-contract.sh tools/ci/grype-db.json tools/lint.ts "
          if [ "$changed" != "$expected" ]; then
            echo "Refusing a refresh that touched files outside the reviewed pin: $changed" >&2
            exit 1
          fi

      - name: Prove the refreshed pin against the same gates a pull request runs
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun run typecheck
          bun test

      - name: Propose the refreshed pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          built="$(bun -e 'console.log(JSON.parse(await Bun.file("tools/ci/grype-db.json").text()).built)')"
          branch="chore/grype-db-$(printf '%s' "$built" | tr -d ':-')"
          # A pushed branch is not a proposal. If a previous run pushed and then
          # failed to open the pull request -- the repository disallowing
          # Actions-created PRs is the obvious way -- the branch alone would
          # silence every later run until Anchore published a different build.
          # Ask about pull requests, in any state, so a merged or deliberately
          # closed one is not re-proposed either.
          proposals="$(gh pr list --head "$branch" --state all --json number --jq 'length')"
          if [ "$proposals" != "0" ]; then
            echo "already proposed: $branch"
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            printf 'Automated reconciliation of the reviewed Grype database pin against the snapshot Anchore currently publishes.\n\n'
            printf 'The reviewed 48-hour freshness ceiling is unchanged; this only keeps the pin inside it.\n\n'
            printf 'Because this pull request is opened with GITHUB_TOKEN, GitHub deliberately does not trigger workflows on it, so it arrives without its own checks. The proposing run executed the same gates a pull request runs -- format:check, lint, typecheck and bun test -- and refused to open this if any failed, or if anything outside the five reviewed pin locations changed:\n\n'
            printf '%s\n\n' "$run_url"
            printf 'Review the diff and that run before merging.\n'
          } > "$RUNNER_TEMP/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add platform-capabilities/preview-deployment-parity-v1.json \
            tools/ci/container-artifact-contract.sh tools/ci/grype-db.json tools/lint.ts
          git commit -m "chore(security): refresh the pinned Grype database to ${built}"
          # --force is safe precisely because no pull request references this
          # branch: the guard above already returned when one did. It lets a run
          # recover a branch a previous run pushed before failing to propose it.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(security): refresh the pinned Grype database to ${built}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
