name: Refresh Grype database

on:
  schedule:
    - cron: "40 10 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-grype-db-${{ github.event.repository.id }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Grype database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the protected platform default branch
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = collinbentley1/platform
          test "$REPOSITORY_ID" = 1255856466
      - name: Checkout exact producer code without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Acquire and verify the database
        id: database
        uses: ./.github/actions/grype-database
      - name: Package the verified public snapshot
        id: bundle
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GRYPE_DATABASE_MANIFEST_SHA256: ${{ steps.database.outputs.manifest-sha256 }}
        run: /bin/bash tools/ci/container-artifact-contract.sh pack-grype-db
      - name: Retain the public snapshot for bounded outage recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.bundle.outputs.artifact }}
          archive: false
          retention-days: 2
          if-no-files-found: error
