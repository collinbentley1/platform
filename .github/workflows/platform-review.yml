name: Platform review admission
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]
permissions: {}
concurrency:
  group: review-${{ github.repository_id }}-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  review:
    if: vars.PLATFORM_REVIEW_GATE_READY == 'true' && (github.event.pull_request || github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - run: bash delivery/install-bun.sh
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bun delivery/review.ts "$PR_NUMBER"
