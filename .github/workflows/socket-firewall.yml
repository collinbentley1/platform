name: Socket Firewall

on:
  workflow_call:

permissions:
  checks: read
  contents: read

jobs:
  firewall:
    name: Socket Firewall
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve the exact reusable-workflow source
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REPOSITORY" = "collinbentley1/platform"
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ -e "$GITHUB_WORKSPACE/_platform_policy" ] || [ -L "$GITHUB_WORKSPACE/_platform_policy" ]; then
            echo "The reserved _platform_policy checkout path must not exist in the caller repository." >&2
            exit 1
          fi

      - name: Checkout the exact platform policy source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _platform_policy
          persist-credentials: false

      - name: Verify the checked-out platform policy commit
        env:
          EXPECTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/_platform_policy" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install checksum-pinned Bun 1.4.0
        env:
          BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          echo "${BUN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$destination"
          unzip -q "$archive" -d "$destination"
          echo "$destination/bun-linux-x64" >> "$GITHUB_PATH"
          (
            cd "$GITHUB_WORKSPACE/_platform_policy/tools/ci"
            "$destination/bun-linux-x64/bun" --no-env-file --no-orphans \
              -e 'if (Bun.version !== "1.4.0") process.exit(1)'
          )

      - name: Enforce trusted Bun scanner configuration
        run: |
          set -euo pipefail
          (
            cd "$GITHUB_WORKSPACE/_platform_policy/tools/ci"
            bun --no-env-file --no-orphans ./enforce-app-contract.ts \
              "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/_platform_policy/templates/app" \
              "${{ github.event.repository.id }}" \
              "${{ job.workflow_sha }}"
          )

      - name: Scan the resolved lock with the public Socket policy
        run: |
          set -euo pipefail
          print_untrusted_output() {
            local stop_marker
            stop_marker="$(cat /proc/sys/kernel/random/uuid)"
            printf '::stop-commands::%s\n' "$stop_marker"
            printf '%s\n' "$1"
            printf '::%s::\n' "$stop_marker"
          }
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "Committed node_modules content is forbidden before the Socket scan." >&2
            exit 1
          fi
          before="$(sha256sum package.json bun.lock)"
          unset SOCKET_API_TOKEN SOCKET_API_KEY
          unset BUN_CONFIG_SKIP_LOAD_LOCKFILE BUN_FEATURE_FLAG_DISABLE_IGNORE_SCRIPTS BUN_CONFIG_REGISTRY NPM_CONFIG_REGISTRY
          if ! scan_output="$(bun --no-env-file --config="$GITHUB_WORKSPACE/_platform_policy/tools/ci/bunfig.toml" pm scan 2>&1)"; then
            print_untrusted_output "$scan_output"
            exit 1
          fi
          print_untrusted_output "$scan_output"
          if ! grep -Fq 'Socket Security Scanner free mode' <<< "$scan_output"; then
            echo "The standalone Socket check must remain credential-free." >&2
            exit 1
          fi
          if find . -name node_modules -not -path './.git/*' -print -quit | grep -q .; then
            echo "bun pm scan must not create node_modules." >&2
            exit 1
          fi
          if [[ "$(sha256sum package.json bun.lock)" != "$before" ]]; then
            echo "bun pm scan must not mutate package.json or bun.lock." >&2
            exit 1
          fi

      - name: Require successful Socket GitHub App checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha="$GITHUB_SHA"
          expected='["Socket Security: Project Report"]'
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            target_sha="$(jq -er '.pull_request.head.sha | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")"
            expected='["Socket Security: Project Report","Socket Security: Pull Request Alerts"]'
          fi
          response="$RUNNER_TEMP/socket-check-runs.json"
          for _ in $(seq 1 60); do
            curl --fail-with-body --show-error --silent \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --output "$response" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${target_sha}/check-runs?filter=latest&per_page=100"
            if jq -e --argjson expected "$expected" '
              .check_runs as $runs
              | all($expected[] as $name;
                  ([$runs[] | select(.name == $name and .app.id == 156372)] | length) == 1 and
                  ([$runs[] | select(.name == $name and .app.id == 156372)][0]
                    | .status == "completed" and .conclusion == "success"))
            ' "$response" >/dev/null; then
              exit 0
            fi
            if jq -e --argjson expected "$expected" '
              any($expected[] as $name;
                any(.check_runs[];
                  .name == $name and .app.id == 156372 and
                  .status == "completed" and .conclusion != "success"))
            ' "$response" >/dev/null; then
              echo "A required Socket GitHub App check completed without success." >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the exact Socket GitHub App checks." >&2
          exit 1
