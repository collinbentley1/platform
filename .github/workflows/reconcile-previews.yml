name: Reconcile previews

on:
  workflow_call:

permissions: {}

jobs:
  rerun-guard:
    name: Reject privileged workflow reruns
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

  reconcile:
    name: Reconcile previews
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    environment: preview-operations
    permissions:
      id-token: write # Exchange only for the exact-SHA preview reconciliation identity.
      pull-requests: read # Authoritatively distinguish open and closed preview tags.
    concurrency:
      group: preview-cloud-${{ github.event.repository.id }}
      queue: max
      cancel-in-progress: false

    steps:
      - name: Reject workflow reruns before any privileged action
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Resolve trusted application configuration
        id: app
        env:
          REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          case "$REPOSITORY_ID" in
            1255553151)
              project_id="cdbentley"
              project_number="882468538648"
              service_name="cdbentley"
              ;;
            711292980)
              project_id="runsetta"
              project_number="601124730704"
              service_name="runsetta"
              ;;
            1025243085)
              project_id="medlock-1025243085"
              project_number="229383559510"
              service_name="medlock"
              ;;
            280932482)
              project_id="critical-history-16823277"
              project_number="422714632513"
              service_name="critical-history"
              ;;
            *)
              echo "Repository id $REPOSITORY_ID is not registered for preview reconciliation." >&2
              exit 1
              ;;
          esac

          {
            echo "project_id=$project_id"
            echo "region=us-east4"
            echo "service_name=$service_name"
            echo "workload_identity_provider=projects/${project_number}/locations/global/workloadIdentityPools/github-actions/providers/github"
            echo "deploy_service_account=gha-preview-deploy@${project_id}.iam.gserviceaccount.com"
            echo "canary_service_account=gha-wif-canary@${project_id}.iam.gserviceaccount.com"
          } >> "$GITHUB_OUTPUT"

      - name: Install checksum-pinned Google Cloud CLI
        env:
          GCLOUD_SHA256: deffdbe82ca6e3d19ffb291d063a651488e04e1b33799b5a238e4b5c6784e3c6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/google-cloud-cli-581.0.0-linux-x86_64.tar.gz"
          sdk_root="$RUNNER_TEMP/google-cloud-cli"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            'https://storage.googleapis.com/cloud-sdk-release/google-cloud-cli-581.0.0-linux-x86_64.tar.gz?generation=1787059661116797'
          echo "${GCLOUD_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$sdk_root"
          tar -xzf "$archive" -C "$sdk_root" --strip-components=1
          export CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true
          export CLOUDSDK_CORE_DISABLE_PROMPTS=1
          export CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true
          "$sdk_root/bin/gcloud" version --format=json \
            | jq -e '.["Google Cloud SDK"] == "581.0.0"' >/dev/null
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          {
            echo "CLOUDSDK_COMPONENT_MANAGER_DISABLE_UPDATE_CHECK=true"
            echo "CLOUDSDK_CORE_DISABLE_PROMPTS=1"
            echo "CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true"
          } >> "$GITHUB_ENV"

      - name: Prove exact workflow-SHA WIF trust
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.canary_service_account }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate trusted preview deployer for reconciliation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ steps.app.outputs.project_id }}
          workload_identity_provider: ${{ steps.app.outputs.workload_identity_provider }}
          service_account: ${{ steps.app.outputs.deploy_service_account }}

      - name: Remove traffic tags that do not match an active pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PROJECT_ID: ${{ steps.app.outputs.project_id }}
          REGION: ${{ steps.app.outputs.region }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          SERVICE_NAME: ${{ steps.app.outputs.service_name }}
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        run: |
          set -euo pipefail
          if [[ ! "$REPOSITORY_ID" =~ ^(1255553151|711292980|1025243085|280932482)$ ]] ||
             [[ ! "$PLATFORM_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing invalid preview reconciliation identity." >&2
            exit 1
          fi
          service="${SERVICE_NAME}-preview"
          service_json="$(mktemp)"
          describe_error="$(mktemp)"
          revision_json="$(mktemp)"
          revision_error="$(mktemp)"
          trap 'rm -f "$service_json" "$describe_error" "$revision_json" "$revision_error"' EXIT

          verify_stable_preview_absent() {
            local pr_number="$1"
            local preview_tag="$2"
            if [ "$REPOSITORY_ID" != "280932482" ]; then
              return 0
            fi
            stable_url="https://pr-${pr_number}.preview.ycriticalhistory.org"
            for attempt in $(seq 1 30); do
              if status="$(curl --silent --show-error \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 10 \
                --proto '=https' \
                "$stable_url")" && [ "$status" = "404" ]; then
                return 0
              fi
              if [ "$attempt" -lt 30 ]; then
                sleep 5
              fi
            done
            echo "Stable preview URL remained routable after removing $preview_tag." >&2
            return 1
          }

          if gcloud run services describe "$service" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json > "$service_json" 2> "$describe_error"; then
            while IFS=$'\t' read -r preview_tag revision_name; do
              if [[ ! "$preview_tag" =~ ^pr-([0-9]+)$ ]]; then
                echo "Refusing unexpected preview tag: $preview_tag" >&2
                exit 1
              fi
              pr_number="${BASH_REMATCH[1]}"

              if ! pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"; then
                echo "Could not authoritatively read pull request #$pr_number; preserving $preview_tag." >&2
                exit 1
              fi
              state="$(jq -r 'if (.state == "open" or .state == "closed") then .state else "invalid" end' <<< "$pr_json")"
              draft="$(jq -r 'if (.draft | type) == "boolean" then (.draft | tostring) else "invalid" end' <<< "$pr_json")"
              head_sha="$(jq -r 'if (.head.sha | type) == "string" then .head.sha else "" end' <<< "$pr_json")"
              head_repo_id="$(jq -r 'if (.head.repo.id | type) == "number" then (.head.repo.id | tostring) else "" end' <<< "$pr_json")"
              head_repo_name="$(jq -r 'if (.head.repo.full_name | type) == "string" then .head.repo.full_name else "" end' <<< "$pr_json")"
              base_ref="$(jq -r 'if (.base.ref | type) == "string" then .base.ref else "" end' <<< "$pr_json")"

              revision_identity_valid=false
              if [[ "$revision_name" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
                if ! gcloud run revisions describe "$revision_name" \
                  --project="$PROJECT_ID" \
                  --region="$REGION" \
                  --format=json > "$revision_json" 2> "$revision_error"; then
                  cat "$revision_error" >&2
                  echo "Could not authoritatively read tagged revision $revision_name; preserving all tags." >&2
                  exit 1
                fi
                if jq -e \
                  --arg head "$head_sha" \
                  --arg name "$revision_name" \
                  --arg pr "$pr_number" \
                  --arg repository_id "$REPOSITORY_ID" \
                  --arg workflow_sha "$PLATFORM_WORKFLOW_SHA" '
                  .metadata.name == $name and
                  .metadata.labels["git-head-sha"] == $head and
                  .metadata.labels["github-repository-id"] == $repository_id and
                  .metadata.labels["github-pr"] == $pr and
                  (.metadata.labels["github-run-id"] | type == "string" and test("^[0-9]+$")) and
                  .metadata.labels["github-run-attempt"] == "1" and
                  .metadata.labels["managed-by"] == "github-actions" and
                  .metadata.labels.environment == "preview" and
                  .metadata.labels["platform-workflow-sha"] == $workflow_sha
                ' "$revision_json" >/dev/null; then
                  revision_identity_valid=true
                fi
              fi
              if [ "$state" = "open" ] && [ "$draft" = "false" ] &&
                 [ "$head_repo_id" = "$REPOSITORY_ID" ] &&
                 [ "$head_repo_name" = "$GITHUB_REPOSITORY" ] &&
                 [ "$base_ref" = "main" ] &&
                 [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] &&
                 [ "$revision_identity_valid" = "true" ]; then
                echo "Keeping $preview_tag at $revision_name for pull request #$pr_number head $head_sha."
                continue
              fi

              echo "Removing invalid tag $preview_tag: state=$state draft=$draft head=$head_sha head_repo_id=$head_repo_id base=$base_ref revision=$revision_name."
              gcloud run services update-traffic "$service" \
                --project="$PROJECT_ID" \
                --region="$REGION" \
                --remove-tags="$preview_tag" \
                --quiet
              verify_stable_preview_absent "$pr_number" "$preview_tag"
            done < <(jq -r '.status.traffic[]? | select(.tag != null) | [.tag, (.revisionName // "")] | @tsv' "$service_json")
          else
            if grep -Eqi 'not[ _-]?found|could not be found|404' "$describe_error"; then
              echo "Shared preview service $service does not exist yet."
            else
              cat "$describe_error" >&2
              exit 1
            fi
          fi

          # Migration-only cleanup for the former one-service-per-PR design. The
          # list permission disappears when preview IAM is narrowed to the shared
          # service, so lack of list access is an expected steady state.
          legacy_json="$(mktemp)"
          list_error="$(mktemp)"
          trap 'rm -f "$service_json" "$describe_error" "$revision_json" "$revision_error" "$legacy_json" "$list_error"' EXIT
          if ! gcloud run services list \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json > "$legacy_json" 2> "$list_error"; then
            if grep -Eqi 'permission.denied|permission denied|forbidden|403' "$list_error"; then
              echo "Project-wide service listing is unavailable; scoped preview IAM is active."
              exit 0
            fi
            cat "$list_error" >&2
            exit 1
          fi

          while IFS=$'\t' read -r legacy_service pr_number; do
            if [[ ! "$pr_number" =~ ^[0-9]+$ ]] || [ "$legacy_service" != "${SERVICE_NAME}-pr-${pr_number}" ]; then
              echo "Refusing unexpected legacy preview: service=$legacy_service pr=$pr_number" >&2
              exit 1
            fi

            if ! state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .state)"; then
              echo "Could not authoritatively read pull request #$pr_number; preserving $legacy_service." >&2
              exit 1
            fi
            if [ "$state" != "open" ] && [ "$state" != "closed" ]; then
              echo "Unexpected pull request state for #$pr_number: $state" >&2
              exit 1
            fi

            echo "Deleting legacy preview $legacy_service for $state pull request #$pr_number; future previews use the shared tagged service."
            gcloud run services delete "$legacy_service" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --quiet
          done < <(
            jq -r \
              '.[] | select(.metadata.labels["managed-by"] == "github-actions" and .metadata.labels.environment == "preview" and .metadata.labels.pr != null) | [.metadata.name, .metadata.labels.pr] | @tsv' \
              "$legacy_json"
          )
