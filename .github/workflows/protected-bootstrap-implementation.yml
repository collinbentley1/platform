name: Protected owner Terraform bridge

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Consumer repository whose one Google Cloud project is in scope.
        required: true
        type: choice
        options:
          - cdbentley
          - runsetta
          - healthmcp
          - critical-history
      terraform_root:
        description: Exact root; exposure is Runsetta-only one-shot adoption and requires mode=plan.
        required: true
        type: choice
        options:
          - bootstrap
          - prod
          - exposure
      mode:
        description: Plan emits a digest; exposure plan is terminal adoption, while apply is bootstrap/prod only.
        required: true
        type: choice
        options:
          - plan
          - apply
      consumer_sha:
        description: Full reviewed consumer commit SHA to fetch without a branch or tag.
        required: true
        type: string
      legacy_compatibility_mode:
        description: Bootstrap initial adoption only; requires an empty transition SHA.
        required: true
        type: boolean
        default: false
      transition_workflow_sha:
        description: Bootstrap exact-SHA transition only; optional immediately previous reviewed platform SHA and incompatible with legacy mode.
        required: false
        type: string
      approved_manifest_sha256:
        description: Empty for plan; exact digest from the reviewed plan summary for apply.
        required: false
        type: string
      approved_plan_run_id:
        description: Empty for plan; fresh successful plan run whose immutable receipt is consumed once by apply.
        required: false
        type: string
      exposure_adoption_confirmation:
        description: Enter ADOPT_RUNSETTA_EXPOSURE_STATE only for the one-shot Runsetta exposure-state adoption; otherwise leave empty.
        required: false
        type: string
      exposure_adoption_run_id:
        description: Exact successful adoption-complete run required by Runsetta prod plan/apply; otherwise leave empty.
        required: false
        type: string

permissions: {}

concurrency:
  group: protected-owner-terraform-${{ inputs.target_repository }}
  cancel-in-progress: false

jobs:
  owner-terraform:
    name: ${{ inputs.target_repository }} ${{ inputs.terraform_root }} ${{ inputs.mode }}
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 41
    environment: protected-bootstrap-owner-token
    permissions:
      actions: read
      contents: read

    steps:
      - name: Reject every route except an owner dispatch from platform main
        if: ${{ success() && !cancelled() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
          APPROVED_PLAN_RUN_ID: ${{ inputs.approved_plan_run_id }}
          CONSUMER_SHA: ${{ inputs.consumer_sha }}
          EXECUTION_MODE: ${{ inputs.mode }}
          EXPOSURE_ADOPTION_CONFIRMATION: ${{ inputs.exposure_adoption_confirmation }}
          EXPOSURE_ADOPTION_RUN_ID: ${{ inputs.exposure_adoption_run_id }}
          GITHUB_ACTOR_ID_EXACT: ${{ github.actor_id }}
          GITHUB_EVENT_NAME_EXACT: ${{ github.event_name }}
          GITHUB_REF_EXACT: ${{ github.ref }}
          GITHUB_REPOSITORY_EXACT: ${{ github.repository }}
          GITHUB_REPOSITORY_ID_EXACT: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID_EXACT: ${{ github.repository_owner_id }}
          GITHUB_RUN_ATTEMPT_EXACT: ${{ github.run_attempt }}
          GITHUB_SHA_EXACT: ${{ github.sha }}
          GITHUB_WORKFLOW_REF_EXACT: ${{ github.workflow_ref }}
          LEGACY_COMPATIBILITY_MODE: ${{ inputs.legacy_compatibility_mode }}
          RUNNER_TEMP_EXACT: ${{ runner.temp }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TERRAFORM_ROOT: ${{ inputs.terraform_root }}
          TRANSITION_WORKFLOW_SHA: ${{ inputs.transition_workflow_sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP_EXACT" <<'PY'
          import os
          import re
          import stat
          import sys
          import time

          runner_temp = sys.argv[1]
          if (
              not os.path.isabs(runner_temp)
              or os.path.normpath(runner_temp) != runner_temp
              or "\x00" in runner_temp
          ):
              raise SystemExit("Runner temp escaped its normalized absolute path.")
          directory_metadata = os.lstat(runner_temp)
          if not stat.S_ISDIR(directory_metadata.st_mode) or stat.S_ISLNK(
              directory_metadata.st_mode
          ):
              raise SystemExit("Runner temp must be one real directory.")

          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          directory_fd = os.open(runner_temp, directory_flags)
          file_name = "protected-bootstrap-job-start.epoch"
          file_flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
          epoch = str(int(time.time())).encode("ascii")
          if re.fullmatch(rb"[1-9][0-9]*", epoch) is None:
              raise SystemExit("Job start epoch was not one positive integer.")
          try:
              file_fd = os.open(file_name, file_flags, 0o600, dir_fd=directory_fd)
              try:
                  os.fchmod(file_fd, 0o600)
                  if os.write(file_fd, epoch) != len(epoch):
                      raise SystemExit("Job start epoch was not written exactly.")
                  os.fsync(file_fd)
                  metadata = os.fstat(file_fd)
                  if (
                      not stat.S_ISREG(metadata.st_mode)
                      or stat.S_IMODE(metadata.st_mode) != 0o600
                      or metadata.st_nlink != 1
                      or metadata.st_size != len(epoch)
                  ):
                      raise SystemExit("Job start file escaped its private regular-file contract.")
              finally:
                  os.close(file_fd)
              read_fd = os.open(file_name, os.O_RDONLY | os.O_NOFOLLOW, dir_fd=directory_fd)
              try:
                  observed = os.read(read_fd, 32)
                  if observed != epoch or os.read(read_fd, 1) != b"":
                      raise SystemExit("Job start epoch did not read back exactly.")
              finally:
                  os.close(read_fd)
          finally:
              os.close(directory_fd)
          PY
          test "$GITHUB_EVENT_NAME_EXACT" = "workflow_dispatch"
          test "$GITHUB_REF_EXACT" = "refs/heads/main"
          test "$GITHUB_REPOSITORY_EXACT" = "collinbentley1/platform"
          test "$GITHUB_REPOSITORY_ID_EXACT" = "1255856466"
          test "$GITHUB_REPOSITORY_OWNER_ID_EXACT" = "16823277"
          test "$GITHUB_ACTOR_ID_EXACT" = "16823277"
          test "$GITHUB_RUN_ATTEMPT_EXACT" = "1"
          test "$GITHUB_WORKFLOW_REF_EXACT" = \
            "collinbentley1/platform/.github/workflows/protected-bootstrap-implementation.yml@refs/heads/main"
          case "$TARGET_REPOSITORY" in
            cdbentley|runsetta|healthmcp|critical-history) ;;
            *) exit 1 ;;
          esac
          case "$TERRAFORM_ROOT" in bootstrap|prod|exposure) ;; *) exit 1 ;; esac
          if [ "$TERRAFORM_ROOT" = "exposure" ]; then
            test "$TARGET_REPOSITORY" = "runsetta"
            test "$EXECUTION_MODE" = "plan"
            test "$EXPOSURE_ADOPTION_CONFIRMATION" = "ADOPT_RUNSETTA_EXPOSURE_STATE"
          else
            test -z "$EXPOSURE_ADOPTION_CONFIRMATION"
          fi
          if [ "$TARGET_REPOSITORY" = "runsetta" ] && [ "$TERRAFORM_ROOT" = "prod" ]; then
            [[ "$EXPOSURE_ADOPTION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          else
            test -z "$EXPOSURE_ADOPTION_RUN_ID"
          fi
          case "$EXECUTION_MODE" in plan|apply) ;; *) exit 1 ;; esac
          [[ "$CONSUMER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA_EXACT" =~ ^[0-9a-f]{40}$ ]]
          case "$LEGACY_COMPATIBILITY_MODE" in true|false) ;; *) exit 1 ;; esac
          if [ -n "$TRANSITION_WORKFLOW_SHA" ]; then
            [[ "$TRANSITION_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$TRANSITION_WORKFLOW_SHA" != "$GITHUB_SHA_EXACT"
            test "$LEGACY_COMPATIBILITY_MODE" = "false"
          fi
          if [ "$TERRAFORM_ROOT" != "bootstrap" ]; then
            test "$LEGACY_COMPATIBILITY_MODE" = "false"
            test -z "$TRANSITION_WORKFLOW_SHA"
          elif [ "$LEGACY_COMPATIBILITY_MODE" = "true" ]; then
            test -z "$TRANSITION_WORKFLOW_SHA"
          fi
          if [ "$EXECUTION_MODE" = "plan" ]; then
            test -z "$APPROVED_MANIFEST_SHA256"
            test -z "$APPROVED_PLAN_RUN_ID"
          else
            [[ "$APPROVED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [[ "$APPROVED_PLAN_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          fi

      - name: Fetch the exact public platform, consumer, and transition commits
        if: ${{ success() && !cancelled() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          CONSUMER_SHA: ${{ inputs.consumer_sha }}
          PLATFORM_SHA: ${{ github.sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TRANSITION_WORKFLOW_SHA: ${{ inputs.transition_workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$PLATFORM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONSUMER_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$TARGET_REPOSITORY" in
            cdbentley|runsetta|healthmcp|critical-history) ;;
            *) exit 1 ;;
          esac
          if [ -n "$TRANSITION_WORKFLOW_SHA" ]; then
            [[ "$TRANSITION_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi

          git_command=(/usr/bin/env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
            /usr/bin/git -c credential.helper= -c core.hooksPath=/dev/null
            -c core.fsmonitor=false -c diff.external= -c protocol.file.allow=never
            -c protocol.version=2)
          fetch_exact_public_commit() {
            local destination="$1" repository="$2" expected_sha="$3"
            test ! -e "$destination" && test ! -L "$destination"
            mkdir -m 0700 "$destination"
            "${git_command[@]}" -C "$destination" init --quiet
            "${git_command[@]}" -C "$destination" remote add origin \
              "https://github.com/collinbentley1/${repository}.git"
            "${git_command[@]}" -C "$destination" fetch --quiet --depth=1 --no-tags origin \
              "$expected_sha"
            test "$("${git_command[@]}" -C "$destination" rev-parse FETCH_HEAD)" = \
              "$expected_sha"
            "${git_command[@]}" -C "$destination" checkout --quiet --detach "$expected_sha"
            test "$("${git_command[@]}" -C "$destination" rev-parse HEAD)" = "$expected_sha"
            test -z "$("${git_command[@]}" -C "$destination" status \
              --porcelain=v1 --untracked-files=all)"
          }

          platform_root="$RUNNER_TEMP/platform"
          test ! -e "$platform_root" && test ! -L "$platform_root"
          mkdir -m 0700 "$platform_root"
          "${git_command[@]}" -C "$platform_root" init --quiet
          "${git_command[@]}" -C "$platform_root" remote add origin \
            https://github.com/collinbentley1/platform.git
          if [ -n "$TRANSITION_WORKFLOW_SHA" ]; then
            # Fetch both objects into one repository without a shallow boundary,
            # so the controller can independently prove transition ancestry.
            "${git_command[@]}" -C "$platform_root" fetch --quiet --no-tags origin \
              "$PLATFORM_SHA" "$TRANSITION_WORKFLOW_SHA"
          else
            "${git_command[@]}" -C "$platform_root" fetch --quiet --depth=1 --no-tags origin \
              "$PLATFORM_SHA"
          fi
          "${git_command[@]}" -C "$platform_root" checkout --quiet --detach "$PLATFORM_SHA"
          test "$("${git_command[@]}" -C "$platform_root" rev-parse HEAD)" = "$PLATFORM_SHA"
          test -z "$("${git_command[@]}" -C "$platform_root" status \
            --porcelain=v1 --untracked-files=all)"
          fetch_exact_public_commit "$RUNNER_TEMP/consumer" "$TARGET_REPOSITORY" "$CONSUMER_SHA"
          if [ -n "$TRANSITION_WORKFLOW_SHA" ]; then
            "${git_command[@]}" -C "$platform_root" merge-base --is-ancestor \
              "$TRANSITION_WORKFLOW_SHA" "$PLATFORM_SHA"
            transition_root="$RUNNER_TEMP/transition-platform"
            test ! -e "$transition_root" && test ! -L "$transition_root"
            "${git_command[@]}" -C "$platform_root" worktree add --quiet --detach \
              "$transition_root" "$TRANSITION_WORKFLOW_SHA"
            test "$("${git_command[@]}" -C "$transition_root" rev-parse HEAD)" = \
              "$TRANSITION_WORKFLOW_SHA"
            test -z "$("${git_command[@]}" -C "$transition_root" status \
              --porcelain=v1 --untracked-files=all)"
          fi

      - name: Install checksum-pinned Bun 1.4.0
        if: ${{ success() && !cancelled() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          echo "${BUN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -m 0700 "$destination"
          unzip -q "$archive" -d "$destination"
          test "$("$destination/bun-linux-x64/bun" --revision | cut -d+ -f1)" = "1.4.0"
          echo "$destination/bun-linux-x64" >> "$GITHUB_PATH"

      - name: Extract checksum-pinned Terraform 1.14.5 without host execution
        if: ${{ success() && !cancelled() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          TERRAFORM_SHA256: ac21c2b9dcd115711f540cbd27ead0596bb4288a917cb56dfa9b25edb3eb6280
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/terraform.zip"
          destination="$RUNNER_TEMP/terraform-bin"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://releases.hashicorp.com/terraform/1.14.5/terraform_1.14.5_linux_amd64.zip
          echo "${TERRAFORM_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -m 0700 "$destination"
          unzip -q "$archive" -d "$destination"
          test -f "$destination/terraform" && test ! -L "$destination/terraform"
          chmod 0500 "$destination/terraform"

      - name: Extract the exact checksum-pinned Google provider without host execution
        if: ${{ success() && !cancelled() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GOOGLE_PROVIDER_SHA256: fb1b9d1ea7bc79b7409f02aa7c19ba39afa22dbead69e83ae7eb2691ac5c2426
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/terraform-provider-google-7.45.0-linux-amd64.zip"
          destination="$RUNNER_TEMP/terraform-provider-google"
          mirror="$destination/registry.terraform.io/hashicorp/google/7.45.0/linux_amd64"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            https://releases.hashicorp.com/terraform-provider-google/7.45.0/terraform-provider-google_7.45.0_linux_amd64.zip
          echo "${GOOGLE_PROVIDER_SHA256}  ${archive}" | sha256sum --check --strict
          test "$(unzip -Z1 "$archive")" = $'LICENSE.txt\nterraform-provider-google_v7.45.0_x5'
          mkdir -m 0700 "$destination"
          mkdir -m 0700 "$destination/registry.terraform.io"
          mkdir -m 0700 "$destination/registry.terraform.io/hashicorp"
          mkdir -m 0700 "$destination/registry.terraform.io/hashicorp/google"
          mkdir -m 0700 "$destination/registry.terraform.io/hashicorp/google/7.45.0"
          mkdir -m 0700 "$mirror"
          unzip -q "$archive" -d "$mirror"
          test -f "$mirror/LICENSE.txt" && test ! -L "$mirror/LICENSE.txt"
          test -f "$mirror/terraform-provider-google_v7.45.0_x5"
          test ! -L "$mirror/terraform-provider-google_v7.45.0_x5"
          chmod 0400 "$mirror/LICENSE.txt"
          chmod 0500 "$mirror/terraform-provider-google_v7.45.0_x5"

      - name: Pull the exact Terraform sandbox image before any secret exists
        if: ${{ success() && !cancelled() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          TERRAFORM_SANDBOX_IMAGE: docker.io/oven/bun@sha256:8aac45197595035f697ea6b11cd73ce2401d82503fcb2540b5fac606973b242b
        run: |
          set -euo pipefail
          canonical_image="${TERRAFORM_SANDBOX_IMAGE#docker.io/}"
          test "$canonical_image" != "$TERRAFORM_SANDBOX_IMAGE"
          /usr/bin/docker pull --platform=linux/amd64 "$TERRAFORM_SANDBOX_IMAGE"
          /usr/bin/docker image inspect "$TERRAFORM_SANDBOX_IMAGE" \
            --format '{{json .RepoDigests}}' | \
            jq -e --arg image "$canonical_image" 'index($image) != null' >/dev/null

      - name: Plan or apply through a deterministic single-run executor
        id: protected-bridge
        if: ${{ success() && !cancelled() }}
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          APPROVED_MANIFEST_SHA256: ${{ inputs.approved_manifest_sha256 }}
          APPROVED_PLAN_RUN_ID: ${{ inputs.approved_plan_run_id }}
          CONSUMER_ROOT: ${{ runner.temp }}/consumer
          CONSUMER_SHA: ${{ inputs.consumer_sha }}
          EXECUTION_MODE: ${{ inputs.mode }}
          EXPOSURE_ADOPTION_CONFIRMATION: ${{ inputs.exposure_adoption_confirmation }}
          EXPOSURE_ADOPTION_RUN_ID: ${{ inputs.exposure_adoption_run_id }}
          GITHUB_ACTOR_ID_EXACT: ${{ github.actor_id }}
          GITHUB_EVENT_NAME_EXACT: ${{ github.event_name }}
          GITHUB_REF_EXACT: ${{ github.ref }}
          GITHUB_REPOSITORY_EXACT: ${{ github.repository }}
          GITHUB_REPOSITORY_ID_EXACT: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID_EXACT: ${{ github.repository_owner_id }}
          GITHUB_RUN_ATTEMPT_EXACT: ${{ github.run_attempt }}
          GITHUB_RUN_ID_EXACT: ${{ github.run_id }}
          GITHUB_SHA_EXACT: ${{ github.sha }}
          GITHUB_WORKFLOW_REF_EXACT: ${{ github.workflow_ref }}
          LEGACY_COMPATIBILITY_MODE: ${{ inputs.legacy_compatibility_mode }}
          PLATFORM_ROOT: ${{ runner.temp }}/platform
          RUNNER_ARCH_EXACT: ${{ runner.arch }}
          RUNNER_ENVIRONMENT_EXACT: ${{ runner.environment }}
          RUNNER_OS_EXACT: ${{ runner.os }}
          RUNNER_TEMP_EXACT: ${{ runner.temp }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TERRAFORM_BINARY: ${{ runner.temp }}/terraform-bin/terraform
          TERRAFORM_PROVIDER_ARCHIVE: ${{ runner.temp }}/terraform-provider-google-7.45.0-linux-amd64.zip
          TERRAFORM_PROVIDER_DIRECTORY: ${{ runner.temp }}/terraform-provider-google
          TERRAFORM_ROOT: ${{ inputs.terraform_root }}
          TERRAFORM_SANDBOX_IMAGE: docker.io/oven/bun@sha256:8aac45197595035f697ea6b11cd73ce2401d82503fcb2540b5fac606973b242b
          TRANSITION_PLATFORM_ROOT: ${{ runner.temp }}/transition-platform
          TRANSITION_WORKFLOW_SHA: ${{ inputs.transition_workflow_sha }}
          CONSUMER_ACTIONS_READ_TOKEN: ${{ secrets.CONSUMER_ACTIONS_READ_TOKEN }}
          OWNER_OAUTH_ACCESS_TOKEN: ${{ secrets.OWNER_OAUTH_ACCESS_TOKEN }}
          PLATFORM_ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Copy once into non-exported shell variables and remove the exported
          # names before any child is created. Only Bash builtins handle the
          # values; Bun then consumes and closes the anonymous pipe under an
          # empty initial environment before any API or child process starts.
          owner_token="$OWNER_OAUTH_ACCESS_TOKEN"
          consumer_token="$CONSUMER_ACTIONS_READ_TOKEN"
          platform_token="$PLATFORM_ACTIONS_READ_TOKEN"
          unset OWNER_OAUTH_ACCESS_TOKEN CONSUMER_ACTIONS_READ_TOKEN PLATFORM_ACTIONS_READ_TOKEN
          export -n owner_token consumer_token platform_token
          job_start_file="$RUNNER_TEMP_EXACT/protected-bootstrap-job-start.epoch"
          test -f "$job_start_file" && test ! -L "$job_start_file"
          test "$(/usr/bin/stat --format=%a -- "$job_start_file")" = "600"
          test "$(/usr/bin/stat --format=%h -- "$job_start_file")" = "1"
          job_start_epoch="$(< "$job_start_file")"
          test -n "$job_start_epoch"
          test "$(/usr/bin/stat --format=%s -- "$job_start_file")" = \
            "${#job_start_epoch}"
          [[ "$job_start_epoch" =~ ^[1-9][0-9]*$ ]]
          current_epoch="$(/usr/bin/date +%s)"
          [[ "$current_epoch" =~ ^[1-9][0-9]*$ ]]
          elapsed_seconds=$((current_epoch - job_start_epoch))
          test "$elapsed_seconds" -ge 0
          # Plan keeps its complete sixteen-minute same-job recovery tail.
          # Apply keeps two minutes for opportunistic same-job containment and
          # relies on the independently authenticated eighteen-minute fresh
          # recovery job after a late failure.
          #
          # The apply budget shortens by one second per second of setup, and
          # its floor is what still leaves the reviewed pre-elevation envelope
          # satisfiable: 39 minutes less the 45-second setup tolerance the
          # bridge derives. The previous 34-minute floor admitted five setup
          # minutes, 239 seconds short of that envelope, so such a run passed
          # this check and failed twelve minutes later having already acquired
          # and elevated an executor. Setup measures 6 to 9 seconds here.
          case "$EXECUTION_MODE" in
            plan)
              bridge_reserve_seconds=$((16 * 60))
              bridge_minimum_seconds=$((7 * 60))
              bridge_maximum_seconds=$((25 * 60))
              ;;
            apply)
              bridge_reserve_seconds=$((2 * 60))
              bridge_minimum_seconds=$((39 * 60 - 45))
              bridge_maximum_seconds=$((39 * 60))
              ;;
            *) exit 1 ;;
          esac
          bridge_budget_seconds=$((41 * 60 - elapsed_seconds - bridge_reserve_seconds))
          test "$bridge_budget_seconds" -ge "$bridge_minimum_seconds"
          test "$bridge_budget_seconds" -le "$bridge_maximum_seconds"
          shopt -s lastpipe
          {
            printf '%s\0%s\0%s\0' "$owner_token" "$consumer_token" "$platform_token"
            owner_token= consumer_token= platform_token=
            unset owner_token consumer_token platform_token
          } | \
          exec /usr/bin/timeout --signal=TERM --kill-after=15s \
            "${bridge_budget_seconds}s" \
            /usr/bin/env -i \
            APPROVED_MANIFEST_SHA256="$APPROVED_MANIFEST_SHA256" \
            APPROVED_PLAN_RUN_ID="$APPROVED_PLAN_RUN_ID" \
            BRIDGE_OPERATION_BUDGET_SECONDS_EXACT="$bridge_budget_seconds" \
            CONSUMER_ROOT="$CONSUMER_ROOT" \
            CONSUMER_SHA="$CONSUMER_SHA" \
            EXECUTION_MODE="$EXECUTION_MODE" \
            EXPOSURE_ADOPTION_CONFIRMATION="$EXPOSURE_ADOPTION_CONFIRMATION" \
            EXPOSURE_ADOPTION_RUN_ID="$EXPOSURE_ADOPTION_RUN_ID" \
            GITHUB_ACTOR_ID_EXACT="$GITHUB_ACTOR_ID_EXACT" \
            GITHUB_EVENT_NAME_EXACT="$GITHUB_EVENT_NAME_EXACT" \
            GITHUB_REF_EXACT="$GITHUB_REF_EXACT" \
            GITHUB_REPOSITORY_EXACT="$GITHUB_REPOSITORY_EXACT" \
            GITHUB_REPOSITORY_ID_EXACT="$GITHUB_REPOSITORY_ID_EXACT" \
            GITHUB_REPOSITORY_OWNER_ID_EXACT="$GITHUB_REPOSITORY_OWNER_ID_EXACT" \
            GITHUB_RUN_ATTEMPT_EXACT="$GITHUB_RUN_ATTEMPT_EXACT" \
            GITHUB_RUN_ID_EXACT="$GITHUB_RUN_ID_EXACT" \
            GITHUB_SHA_EXACT="$GITHUB_SHA_EXACT" \
            GITHUB_STEP_SUMMARY_EXACT="$GITHUB_STEP_SUMMARY" \
            GITHUB_WORKFLOW_REF_EXACT="$GITHUB_WORKFLOW_REF_EXACT" \
            HOME="$RUNNER_TEMP_EXACT" \
            LEGACY_COMPATIBILITY_MODE="$LEGACY_COMPATIBILITY_MODE" \
            PATH=/usr/bin:/bin \
            PLATFORM_ROOT="$PLATFORM_ROOT" \
            RUNNER_ARCH_EXACT="$RUNNER_ARCH_EXACT" \
            RUNNER_ENVIRONMENT_EXACT="$RUNNER_ENVIRONMENT_EXACT" \
            RUNNER_OS_EXACT="$RUNNER_OS_EXACT" \
            RUNNER_TEMP_EXACT="$RUNNER_TEMP_EXACT" \
            TARGET_REPOSITORY="$TARGET_REPOSITORY" \
            TERRAFORM_BINARY="$TERRAFORM_BINARY" \
            TERRAFORM_PROVIDER_ARCHIVE="$TERRAFORM_PROVIDER_ARCHIVE" \
            TERRAFORM_PROVIDER_DIRECTORY="$TERRAFORM_PROVIDER_DIRECTORY" \
            TERRAFORM_ROOT="$TERRAFORM_ROOT" \
            TERRAFORM_SANDBOX_IMAGE="$TERRAFORM_SANDBOX_IMAGE" \
            TRANSITION_PLATFORM_ROOT="$TRANSITION_PLATFORM_ROOT" \
            TRANSITION_WORKFLOW_SHA="$TRANSITION_WORKFLOW_SHA" \
            "$RUNNER_TEMP_EXACT/bun-bin/bun-linux-x64/bun" --no-env-file --no-orphans \
              "$PLATFORM_ROOT/tools/ci/protected-bootstrap-bridge.ts"

      - name: Remove exact Terraform sandbox containers after bridge failure
        if: ${{ always() && (steps.protected-bridge.outcome == 'failure' || steps.protected-bridge.outcome == 'cancelled') }}
        timeout-minutes: 1
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_RUN_ID_EXACT: ${{ github.run_id }}
          RUNNER_TEMP_EXACT: ${{ runner.temp }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID_EXACT" =~ ^[1-9][0-9]*$ ]]
          case "$TARGET_REPOSITORY" in
            cdbentley) target_repository_id="1255553151" ;;
            runsetta) target_repository_id="711292980" ;;
            healthmcp) target_repository_id="1025243085" ;;
            critical-history) target_repository_id="280932482" ;;
            *) exit 1 ;;
          esac

          owner_label="io.collinbentley1.platform.protected-bootstrap"
          run_label="io.collinbentley1.platform.github-run-id"
          platform_label="io.collinbentley1.platform.repository-id"
          target_label="io.collinbentley1.platform.target-repository-id"
          filters=(
            --filter "label=${owner_label}=true"
            --filter "label=${run_label}=${GITHUB_RUN_ID_EXACT}"
            --filter "label=${platform_label}=1255856466"
            --filter "label=${target_label}=${target_repository_id}"
          )
          docker_bounded() {
            /usr/bin/timeout --signal=KILL 3s /usr/bin/docker "$@"
          }

          if ! candidate_output="$(
            docker_bounded ps --all --no-trunc --quiet "${filters[@]}"
          )"; then
            exit 1
          fi
          candidates=()
          if [ -n "$candidate_output" ]; then
            mapfile -t candidates <<< "$candidate_output"
          fi

          cleanup_failed=0
          validated_ids=()
          for container_id in "${candidates[@]}"; do
            if [[ ! "$container_id" =~ ^[0-9a-f]{64}$ ]]; then
              cleanup_failed=1
              continue
            fi
            if ! inspection="$(
              docker_bounded inspect --type=container \
                --format '{"Id":{{json .Id}},"Name":{{json .Name}},"Labels":{{json .Config.Labels}}}' \
                "$container_id"
            )"; then
              cleanup_failed=1
              continue
            fi
            if ! container_name="$(
              /usr/bin/jq -er '.Name' <<< "$inspection"
            )"; then
              cleanup_failed=1
              continue
            fi
            container_name="${container_name#/}"
            container_pattern="^pbt-${GITHUB_RUN_ID_EXACT}-([1-5])-([0-9a-f]{12})$"
            if [[ ! "$container_name" =~ $container_pattern ]]; then
              cleanup_failed=1
              continue
            fi
            counter="${BASH_REMATCH[1]}"
            expected_suffix="$(
              /usr/bin/python3 - "$target_repository_id" "$GITHUB_RUN_ID_EXACT" \
                "$counter" <<'PY'
          import hashlib
          import sys

          target_repository_id, run_id, counter = sys.argv[1:]
          fields = [
              "protected-bootstrap-artifact-v1",
              "1255856466",
              target_repository_id,
              run_id,
              "1",
              f"container-{counter}",
          ]
          digest = hashlib.sha256()
          for field in fields:
              encoded = field.encode("utf-8")
              digest.update(str(len(encoded)).encode("ascii"))
              digest.update(b"\0")
              digest.update(encoded)
              digest.update(b"\0")
          print(digest.hexdigest()[:12])
          PY
            )"
            expected_name="pbt-${GITHUB_RUN_ID_EXACT}-${counter}-${expected_suffix}"
            if [ "$container_name" != "$expected_name" ]; then
              cleanup_failed=1
              continue
            fi
            if ! /usr/bin/jq -e \
              --arg id "$container_id" \
              --arg name "/$expected_name" \
              --arg run_id "$GITHUB_RUN_ID_EXACT" \
              --arg target_repository_id "$target_repository_id" '
                .Id == $id and
                .Name == $name and
                .Labels["io.collinbentley1.platform.protected-bootstrap"] == "true" and
                .Labels["io.collinbentley1.platform.github-run-id"] == $run_id and
                .Labels["io.collinbentley1.platform.repository-id"] == "1255856466" and
                .Labels["io.collinbentley1.platform.target-repository-id"] == $target_repository_id and
                ([
                  .Labels | keys[] |
                  select(startswith("io.collinbentley1.platform."))
                ] | sort) == [
                  "io.collinbentley1.platform.github-run-id",
                  "io.collinbentley1.platform.protected-bootstrap",
                  "io.collinbentley1.platform.repository-id",
                  "io.collinbentley1.platform.target-repository-id"
                ]
              ' <<< "$inspection" >/dev/null; then
              cleanup_failed=1
              continue
            fi
            validated_ids+=("$container_id")
          done

          for container_id in "${validated_ids[@]}"; do
            if ! docker_bounded kill --signal=KILL "$container_id" >/dev/null 2>&1; then
              if ! state="$(
                docker_bounded inspect --type=container --format '{{.State.Running}}' \
                  "$container_id"
              )" || [ "$state" != "false" ]; then
                cleanup_failed=1
                continue
              fi
            fi
            if ! docker_bounded wait "$container_id" >/dev/null 2>&1; then
              if ! state="$(
                docker_bounded inspect --type=container --format '{{.State.Running}}' \
                  "$container_id"
              )" || [ "$state" != "false" ]; then
                cleanup_failed=1
                continue
              fi
            fi
            if ! docker_bounded rm --force "$container_id" >/dev/null; then
              cleanup_failed=1
              continue
            fi
            if ! same_id="$(
              docker_bounded ps --all --no-trunc --quiet --filter "id=${container_id}"
            )" || [ -n "$same_id" ]; then
              cleanup_failed=1
            fi
          done

          if ! remaining_output="$(
            docker_bounded ps --all --no-trunc --quiet "${filters[@]}"
          )"; then
            cleanup_failed=1
            remaining_output="docker-query-failed"
          fi
          if [ -n "$remaining_output" ]; then
            cleanup_failed=1
          else
            test -d "$RUNNER_TEMP_EXACT" && test ! -L "$RUNNER_TEMP_EXACT"
            sandbox_path="${RUNNER_TEMP_EXACT}/protected-bootstrap-${GITHUB_RUN_ID_EXACT}.sandbox"
            if ! /usr/bin/timeout --signal=KILL 5s /usr/bin/rm \
              --recursive --force --one-file-system -- "$sandbox_path"; then
              cleanup_failed=1
            fi
            if [ -e "$sandbox_path" ] || [ -L "$sandbox_path" ]; then
              cleanup_failed=1
            fi
          fi
          test "$cleanup_failed" = "0"

      - name: Recover exact IAM artifacts after bridge failure
        if: ${{ always() && (steps.protected-bridge.outcome == 'failure' || steps.protected-bridge.outcome == 'cancelled') }}
        timeout-minutes: 14
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_ACTOR_ID_EXACT: ${{ github.actor_id }}
          GITHUB_EVENT_NAME_EXACT: ${{ github.event_name }}
          GITHUB_REF_EXACT: ${{ github.ref }}
          GITHUB_REPOSITORY_EXACT: ${{ github.repository }}
          GITHUB_REPOSITORY_ID_EXACT: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID_EXACT: ${{ github.repository_owner_id }}
          GITHUB_RUN_ATTEMPT_EXACT: ${{ github.run_attempt }}
          GITHUB_RUN_ID_EXACT: ${{ github.run_id }}
          GITHUB_SHA_EXACT: ${{ github.sha }}
          GITHUB_WORKFLOW_REF_EXACT: ${{ github.workflow_ref }}
          OWNER_OAUTH_ACCESS_TOKEN: ${{ secrets.OWNER_OAUTH_ACCESS_TOKEN }}
          PLATFORM_ROOT: ${{ runner.temp }}/platform
          RUNNER_ARCH_EXACT: ${{ runner.arch }}
          RUNNER_ENVIRONMENT_EXACT: ${{ runner.environment }}
          RUNNER_OS_EXACT: ${{ runner.os }}
          RUNNER_TEMP_EXACT: ${{ runner.temp }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          owner_token="$OWNER_OAUTH_ACCESS_TOKEN"
          unset OWNER_OAUTH_ACCESS_TOKEN
          export -n owner_token
          # Bun's Linux parent-death guard follows the thread that forked it.
          # Keep a dedicated single-threaded parent alive instead of binding it
          # directly to a transient GitHub Runner.Worker launch thread.
          shopt -s lastpipe
          {
            printf '%s\0' "$owner_token"
            owner_token=
            unset owner_token
          } | \
          exec /usr/bin/timeout --signal=TERM --kill-after=15s 795s \
            /usr/bin/env -i \
            GITHUB_ACTOR_ID_EXACT="$GITHUB_ACTOR_ID_EXACT" \
            GITHUB_EVENT_NAME_EXACT="$GITHUB_EVENT_NAME_EXACT" \
            GITHUB_REF_EXACT="$GITHUB_REF_EXACT" \
            GITHUB_REPOSITORY_EXACT="$GITHUB_REPOSITORY_EXACT" \
            GITHUB_REPOSITORY_ID_EXACT="$GITHUB_REPOSITORY_ID_EXACT" \
            GITHUB_REPOSITORY_OWNER_ID_EXACT="$GITHUB_REPOSITORY_OWNER_ID_EXACT" \
            GITHUB_RUN_ATTEMPT_EXACT="$GITHUB_RUN_ATTEMPT_EXACT" \
            GITHUB_RUN_ID_EXACT="$GITHUB_RUN_ID_EXACT" \
            GITHUB_SHA_EXACT="$GITHUB_SHA_EXACT" \
            GITHUB_WORKFLOW_REF_EXACT="$GITHUB_WORKFLOW_REF_EXACT" \
            HOME="$RUNNER_TEMP_EXACT" \
            PATH=/usr/bin:/bin \
            PLATFORM_ROOT="$PLATFORM_ROOT" \
            RUNNER_ARCH_EXACT="$RUNNER_ARCH_EXACT" \
            RUNNER_ENVIRONMENT_EXACT="$RUNNER_ENVIRONMENT_EXACT" \
            RUNNER_OS_EXACT="$RUNNER_OS_EXACT" \
            RUNNER_TEMP_EXACT="$RUNNER_TEMP_EXACT" \
            TARGET_REPOSITORY="$TARGET_REPOSITORY" \
            "$RUNNER_TEMP_EXACT/bun-bin/bun-linux-x64/bun" --no-env-file --no-orphans \
              "$PLATFORM_ROOT/tools/ci/protected-bootstrap-bridge.ts" --recover-only

  owner-terraform-recovery:
    name: Recover ${{ inputs.target_repository }} protected Terraform bridge
    needs: owner-terraform
    if: ${{ always() && needs.owner-terraform.result != 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: protected-bootstrap-owner-token
    permissions: {}

    steps:
      - name: Reject every recovery route except the failed owner dispatch
        id: recovery-route
        if: ${{ always() }}
        timeout-minutes: 1
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_ACTOR_ID_EXACT: ${{ github.actor_id }}
          GITHUB_EVENT_NAME_EXACT: ${{ github.event_name }}
          GITHUB_REF_EXACT: ${{ github.ref }}
          GITHUB_REPOSITORY_EXACT: ${{ github.repository }}
          GITHUB_REPOSITORY_ID_EXACT: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID_EXACT: ${{ github.repository_owner_id }}
          GITHUB_RUN_ATTEMPT_EXACT: ${{ github.run_attempt }}
          GITHUB_SHA_EXACT: ${{ github.sha }}
          GITHUB_WORKFLOW_REF_EXACT: ${{ github.workflow_ref }}
          OWNER_TERRAFORM_RESULT: ${{ needs.owner-terraform.result }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME_EXACT" = "workflow_dispatch"
          test "$GITHUB_REF_EXACT" = "refs/heads/main"
          test "$GITHUB_REPOSITORY_EXACT" = "collinbentley1/platform"
          test "$GITHUB_REPOSITORY_ID_EXACT" = "1255856466"
          test "$GITHUB_REPOSITORY_OWNER_ID_EXACT" = "16823277"
          test "$GITHUB_ACTOR_ID_EXACT" = "16823277"
          test "$GITHUB_RUN_ATTEMPT_EXACT" = "1"
          test "$GITHUB_WORKFLOW_REF_EXACT" = \
            "collinbentley1/platform/.github/workflows/protected-bootstrap-implementation.yml@refs/heads/main"
          [[ "$GITHUB_SHA_EXACT" =~ ^[0-9a-f]{40}$ ]]
          case "$TARGET_REPOSITORY" in
            cdbentley|runsetta|healthmcp|critical-history) ;;
            *) exit 1 ;;
          esac
          case "$OWNER_TERRAFORM_RESULT" in
            failure|cancelled|skipped) ;;
            *) exit 1 ;;
          esac

      - name: Fetch the exact public platform commit for recovery
        id: recovery-source
        if: ${{ always() && steps.recovery-route.outcome == 'success' }}
        timeout-minutes: 1
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PLATFORM_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$PLATFORM_SHA" =~ ^[0-9a-f]{40}$ ]]
          platform_root="$RUNNER_TEMP/platform"
          test ! -e "$platform_root" && test ! -L "$platform_root"
          mkdir -m 0700 "$platform_root"
          git_command=(/usr/bin/env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
            /usr/bin/git -c credential.helper= -c core.hooksPath=/dev/null
            -c core.fsmonitor=false -c diff.external= -c protocol.file.allow=never
            -c protocol.version=2)
          "${git_command[@]}" -C "$platform_root" init --quiet
          "${git_command[@]}" -C "$platform_root" remote add origin \
            https://github.com/collinbentley1/platform.git
          /usr/bin/timeout --signal=TERM --kill-after=5s 30s \
            "${git_command[@]}" -C "$platform_root" fetch --quiet --depth=1 --no-tags \
              origin "$PLATFORM_SHA"
          test "$("${git_command[@]}" -C "$platform_root" rev-parse FETCH_HEAD)" = \
            "$PLATFORM_SHA"
          "${git_command[@]}" -C "$platform_root" checkout --quiet --detach "$PLATFORM_SHA"
          test "$("${git_command[@]}" -C "$platform_root" rev-parse HEAD)" = \
            "$PLATFORM_SHA"
          test -z "$("${git_command[@]}" -C "$platform_root" status \
            --porcelain=v1 --untracked-files=all)"

      - name: Install checksum-pinned Bun 1.4.0 for recovery
        id: recovery-bun
        if: ${{ always() && steps.recovery-source.outcome == 'success' }}
        timeout-minutes: 1
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BUN_SHA256: 2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          curl --connect-timeout 10 --max-time 30 --fail --show-error --silent --location \
            --output "$archive" \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64.zip
          echo "${BUN_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -m 0700 "$destination"
          unzip -q "$archive" -d "$destination"
          test "$("$destination/bun-linux-x64/bun" --revision | cut -d+ -f1)" = "1.4.0"

      - name: Recover exact IAM artifacts on a fresh runner
        if: ${{ always() && steps.recovery-bun.outcome == 'success' }}
        timeout-minutes: 14
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_ACTOR_ID_EXACT: ${{ github.actor_id }}
          GITHUB_EVENT_NAME_EXACT: ${{ github.event_name }}
          GITHUB_REF_EXACT: ${{ github.ref }}
          GITHUB_REPOSITORY_EXACT: ${{ github.repository }}
          GITHUB_REPOSITORY_ID_EXACT: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID_EXACT: ${{ github.repository_owner_id }}
          GITHUB_RUN_ATTEMPT_EXACT: ${{ github.run_attempt }}
          GITHUB_RUN_ID_EXACT: ${{ github.run_id }}
          GITHUB_SHA_EXACT: ${{ github.sha }}
          GITHUB_WORKFLOW_REF_EXACT: ${{ github.workflow_ref }}
          OWNER_OAUTH_ACCESS_TOKEN: ${{ secrets.OWNER_OAUTH_ACCESS_TOKEN }}
          PLATFORM_ROOT: ${{ runner.temp }}/platform
          RUNNER_ARCH_EXACT: ${{ runner.arch }}
          RUNNER_ENVIRONMENT_EXACT: ${{ runner.environment }}
          RUNNER_OS_EXACT: ${{ runner.os }}
          RUNNER_TEMP_EXACT: ${{ runner.temp }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
        run: |
          set -euo pipefail
          owner_token="$OWNER_OAUTH_ACCESS_TOKEN"
          unset OWNER_OAUTH_ACCESS_TOKEN
          export -n owner_token
          # Bun's Linux parent-death guard follows the thread that forked it.
          # Keep a dedicated single-threaded parent alive instead of binding it
          # directly to a transient GitHub Runner.Worker launch thread.
          shopt -s lastpipe
          {
            printf '%s\0' "$owner_token"
            owner_token=
            unset owner_token
          } | \
          exec /usr/bin/timeout --signal=TERM --kill-after=15s 795s \
            /usr/bin/env -i \
            GITHUB_ACTOR_ID_EXACT="$GITHUB_ACTOR_ID_EXACT" \
            GITHUB_EVENT_NAME_EXACT="$GITHUB_EVENT_NAME_EXACT" \
            GITHUB_REF_EXACT="$GITHUB_REF_EXACT" \
            GITHUB_REPOSITORY_EXACT="$GITHUB_REPOSITORY_EXACT" \
            GITHUB_REPOSITORY_ID_EXACT="$GITHUB_REPOSITORY_ID_EXACT" \
            GITHUB_REPOSITORY_OWNER_ID_EXACT="$GITHUB_REPOSITORY_OWNER_ID_EXACT" \
            GITHUB_RUN_ATTEMPT_EXACT="$GITHUB_RUN_ATTEMPT_EXACT" \
            GITHUB_RUN_ID_EXACT="$GITHUB_RUN_ID_EXACT" \
            GITHUB_SHA_EXACT="$GITHUB_SHA_EXACT" \
            GITHUB_WORKFLOW_REF_EXACT="$GITHUB_WORKFLOW_REF_EXACT" \
            HOME="$RUNNER_TEMP_EXACT" \
            PATH=/usr/bin:/bin \
            PLATFORM_ROOT="$PLATFORM_ROOT" \
            RUNNER_ARCH_EXACT="$RUNNER_ARCH_EXACT" \
            RUNNER_ENVIRONMENT_EXACT="$RUNNER_ENVIRONMENT_EXACT" \
            RUNNER_OS_EXACT="$RUNNER_OS_EXACT" \
            RUNNER_TEMP_EXACT="$RUNNER_TEMP_EXACT" \
            TARGET_REPOSITORY="$TARGET_REPOSITORY" \
            "$RUNNER_TEMP_EXACT/bun-bin/bun-linux-x64/bun" --no-env-file --no-orphans \
              "$PLATFORM_ROOT/tools/ci/protected-bootstrap-bridge.ts" --recover-only
